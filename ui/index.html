<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: chat (left) | main screen with tabs (center) | navigation sidebar (right). Light theme only, by choice. */
:root{
  color-scheme:light;
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --line:#d6dce8; --line2:#e7ebf2;
  --ink:#141a26; --ink2:#323c50; --dim:#5b667b;
  --accent:#2148c9; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --net:#6b2fb3; --net-soft:#f0e7fb;
  --ok:#167a46; --ok-soft:#e1f2e8; --warn:#8f5d00; --warn-soft:#fbefd2; --bad:#b8322a; --bad-soft:#fbe4e2;
  --nav:#17203a; --nav-ink:#dfe5f3; --nav-dim:#94a0bd; --nav-sel:#2a3657;
  --sch-bg:#fbfcfe; --sch-wire:#233f99; --sch-body:#fdf2c8; --sch-body-line:#7d2f14; --sch-text:#151515;
  --sch-pwr:#d27a12; --sch-pwr3:#2e7a33; --sch-gnd:#6b4a3a; --sch-dash:#a3abba;
  --hl:rgba(33,72,201,.15); --hl2:rgba(33,72,201,.07);
  --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 20px rgba(20,26,38,.07);
  --f-ui:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{font-family:var(--f-mono)}
.app{height:100%;display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr) 216px;gap:12px;padding-inline:16px;padding-block:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:0;min-width:0}

/* ---------- nav (right) ---------- */
.nav{background:var(--nav);color:var(--nav-ink);border-radius:12px;display:flex;flex-direction:column;gap:18px;padding:14px 10px;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:0 6px}
.brand svg{width:22px;height:22px;flex:none}
.ngroup{display:grid;gap:2px}
.nlabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-dim);padding:0 8px 4px}
.nitem{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--nav-ink);text-align:left;padding:7px 8px;border-radius:8px;font-size:13.5px}
.nitem svg{width:17px;height:17px;flex:none;opacity:.85}
.nitem .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .cnt{font-family:var(--f-mono);font-size:11px;color:var(--nav-dim)}
.nitem:hover{background:rgba(255,255,255,.06)}
.nitem[aria-current="true"]{background:var(--nav-sel);font-weight:600}
.nitem .pdot{width:8px;height:8px;border-radius:50%;background:var(--nav-dim);flex:none;margin-inline:4.5px}
.nitem[aria-current="true"] .pdot{background:#7fd1a4}
.nsub{display:grid;gap:1px;padding-left:35px}
.nsub button{border:0;background:none;color:var(--nav-dim);text-align:left;padding:3px 8px;border-radius:6px;font-size:12.5px}
.nsub button:hover{color:var(--nav-ink)}
.nsub button[aria-current="true"]{color:var(--nav-ink);font-weight:600}
.nfoot{margin-top:auto;display:grid;gap:8px}
.mock{font-size:11.5px;color:#f3d48c;border:1px solid #6b5a2c;border-radius:8px;padding:5px 8px;line-height:1.35}

/* ---------- chat (left) ---------- */
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.convbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px;min-width:0;flex:1;text-align:left}
.convbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.convbtn svg{width:14px;height:14px;flex:none}
.newbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap}
.newbtn:hover,.convbtn:hover{border-color:var(--accent)}
.convs{position:absolute;inset:51px 0 0 0;background:var(--panel);z-index:4;overflow-y:auto;padding:8px}
.convs h4{margin:8px 6px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.conv{display:grid;gap:1px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px}
.conv:hover{background:var(--panel2)}
.conv[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.conv .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.conv .t small{font-weight:400;color:var(--dim);font-size:11.5px;white-space:nowrap}
.conv .p{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .anc{font-family:var(--f-mono);font-size:11px;color:var(--net);background:var(--net-soft);border-radius:4px;padding:0 5px;margin-right:4px}
.msgs{overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px}
.msg.user{align-self:flex-end;max-width:88%}
.msg.user .bubble{background:var(--accent-soft);border-radius:12px 12px 3px 12px;padding:8px 12px;white-space:pre-wrap}
.msg.agent .who{font-size:11.5px;color:var(--dim);font-weight:600;margin-bottom:2px}
.msg.agent .txt{color:var(--ink2)}
.msg.agent .txt p{margin:0 0 6px}
.msg.agent .txt ul,.msg.agent .txt ol{margin:4px 0 6px;padding-left:18px}
.msg.agent .txt li{margin-bottom:4px}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--net);background:var(--net-soft);border:0;border-radius:5px;padding:0 6px}
.ref:hover{text-decoration:underline}
.src{display:inline-flex;gap:5px;align-items:baseline;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-top:3px;background:var(--panel2);text-align:left}
.src b{font-weight:600;color:var(--ink2);font-family:var(--f-mono);font-size:11px}
button.src:hover{border-color:var(--accent)}
.tools{border:1px solid var(--line2);border-radius:9px;background:var(--panel2);padding:6px 10px;display:grid;gap:3px;font-size:12.5px}
.tool{display:grid;grid-template-columns:16px auto minmax(0,1fr);gap:8px;align-items:baseline}
.tool .tt{font-weight:600;color:var(--ink2);white-space:nowrap}
.tool .td{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .ti::before{display:inline-block;width:14px;text-align:center;font-weight:700}
.tool.ok .ti::before{content:"✓";color:var(--ok)}
.tool.warn .ti::before{content:"!";color:var(--warn)}
.tool.run .ti::before{content:"";width:9px;height:9px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tool.run .ti::before{animation:none}}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.stage-k{font-size:11.5px;color:var(--ok);font-weight:600}
.stage-t{font-weight:600}
.stage-d{font-size:12.5px;color:var(--dim)}
.lnk{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.lnk:hover{text-decoration:underline}
.diff{border:1px solid var(--warn);border-radius:10px;overflow:hidden;background:var(--panel)}
.diff.ok{border-color:var(--ok)} .diff.no{border-color:var(--line);opacity:.75}
.diff-h{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--warn-soft);font-weight:600;font-size:13px}
.diff.ok .diff-h{background:var(--ok-soft)} .diff.no .diff-h{background:var(--panel2)}
.diff table{width:100%;border-collapse:collapse;font-size:12.5px}
.diff td{padding:4px 12px;border-top:1px solid var(--line2);vertical-align:top}
.diff td:first-child{color:var(--dim);width:30%}
.diff .old{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.diff .new{color:var(--ok);font-weight:600}
.diff-n{margin:0;padding:6px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--line2)}
.diff-a{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line2)}
.diff-s{padding:7px 12px;font-size:12.5px;font-weight:600;border-top:1px solid var(--line2);color:var(--dim)}
.diff.ok .diff-s{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ctx{border:1px dashed var(--net);border-radius:10px;padding:8px 12px;font-size:12.5px;background:var(--net-soft);color:var(--ink2)}
.ctx b{color:var(--ink)}
.ctx .nets{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ctx .nets span{font-family:var(--f-mono);font-size:11px;color:var(--net);border:1px solid var(--net);border-radius:4px;padding:0 5px}
.composer{border-top:1px solid var(--line2);padding:8px 12px 12px;display:grid;gap:8px}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink2)}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:8px 11px;font:inherit;min-height:42px;max-height:120px}
.inrow .btn.pri{height:42px;padding-inline:16px}

/* ---------- center ---------- */
.work{display:grid;grid-template-rows:auto minmax(0,1fr);position:relative;overflow:hidden}
.whead{display:flex;align-items:center;gap:12px;padding:10px 16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--dim);padding-bottom:10px}
.crumb b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-right:auto}
.tab{border:0;background:none;padding:7px 12px 9px;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap;color:var(--dim);font-weight:500}
.tab .n{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st{font-size:11px;border-radius:999px;padding:0 7px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.dim{background:var(--panel2);color:var(--dim)}
.view{overflow:auto;padding:14px 16px;min-width:0}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.vhead h2{margin:0;font-size:17px;text-wrap:balance}
.vhead p{margin:2px 0 0;color:var(--dim);font-size:13px;max-width:70ch}
.vacts{display:flex;gap:6px;flex-wrap:wrap}

/* BOM */
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:5px 12px;background:var(--panel2);display:flex;gap:8px;align-items:baseline}
.kpi b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim)}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)} .kpi.bad b{color:var(--bad)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)} .kpi.warn b{color:var(--warn)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.bom{border-collapse:collapse;width:100%;min-width:1000px;font-size:13px}
.bom th,.libt th,.srct th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;font-size:12px;color:var(--dim);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.bom td{padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
.bom tr,.libt tr{cursor:pointer}
.bom tbody tr:hover td,.libt tbody tr:hover td{background:var(--hl2)}
.bom tr.sel td,.libt tr.sel td{background:var(--hl)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--ok-soft)}100%{background:transparent}}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.refs{font-family:var(--f-mono);font-weight:600;color:var(--net)}
.bom .mpn input,.bom .note input{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:5px;padding:1px 5px;width:100%}
.bom .mpn input{font-family:var(--f-mono);font-size:12.5px;min-width:150px}
.bom .note input{min-width:170px;color:var(--dim)}
.bom input:hover{border-color:var(--line)}
.bom input:focus{border-color:var(--accent);background:var(--panel)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.na{background:var(--line)} .dot.pend{background:var(--accent)} .dot.dim{background:var(--dim)}
.bom .role-input{min-width:130px;color:var(--ink2);font-size:12.5px}
.lib{font-size:12px;border-radius:5px;padding:0 7px;white-space:nowrap}
.lib.std{color:var(--dim);background:var(--panel2)} .lib.ok{color:var(--ok);background:var(--ok-soft)} .lib.review{color:var(--warn);background:var(--warn-soft)} .lib.missing{color:var(--bad);background:var(--bad-soft)}
.secs{display:flex;gap:3px}
.secb{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 5px}
.secb:hover{border-color:var(--accent);color:var(--accent)}
.stock.bad{color:var(--bad);font-weight:600}
.foot{font-size:12px;color:var(--dim);margin-top:8px}

/* detail drawer */
.detail{position:absolute;top:0;right:0;bottom:0;width:320px;max-width:100%;border-left:1px solid var(--line);overflow-y:auto;background:var(--panel);box-shadow:-10px 0 28px rgba(20,26,38,.12);z-index:5}
.dt{padding:14px 16px;display:grid;gap:14px}
.dt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dt-h .refs{font-size:13px}
.dt-h h3{margin:2px 0 0;font-family:var(--f-mono);font-size:16px;word-break:break-all}
.dt-h p{margin:2px 0 0;color:var(--dim);font-size:12.5px}
.x{border:0;background:none;font-size:18px;line-height:1;color:var(--dim);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--panel2)}
.dt-a{display:flex;gap:6px;flex-wrap:wrap}
.dsec h4{margin:0 0 5px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.where{display:grid;gap:4px}
.where button{display:flex;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:4px 8px;font-size:12.5px}
.where button:hover{border-color:var(--accent)}
.where .r{font-family:var(--f-mono);font-weight:600;color:var(--net)}
.where .s{color:var(--dim)}
.netl{display:flex;flex-wrap:wrap;gap:4px}
.netl span{font-family:var(--f-mono);font-size:11px;color:var(--net);border:1px solid var(--net);border-radius:4px;padding:0 5px}
table.sup{width:100%;border-collapse:collapse;font-size:12.5px}
.sup td,.sup th{padding:3px 4px;border-bottom:1px solid var(--line2);text-align:left}
.sup th{font-weight:600;color:var(--dim);font-size:11.5px}
.sup tr.best td{color:var(--ok);font-weight:600}
.checked{font-size:11.5px;color:var(--dim);margin-top:4px}
.libg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.libg div{border:1px solid var(--line2);border-radius:7px;padding:4px 6px;text-align:center;font-size:12px}
.libg b{display:block;font-size:14px}
.y{color:var(--ok)} .nn{color:var(--bad)} .q{color:var(--warn)}
.dnote{font-size:12.5px;color:var(--ink2);background:var(--panel2);border-radius:7px;padding:6px 9px}

/* schematic */
.sheets{display:flex;gap:4px;flex-wrap:wrap}
.sheet{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:12.5px}
.sheet[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sheet:disabled{color:var(--dim);cursor:default;opacity:.7}
.schwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--sch-bg)}
svg.sch{display:block;width:100%;min-width:980px;height:auto}
.sch text{font-family:var(--f-mono);font-size:10px;fill:var(--sch-text)}
.sch .refd{font-weight:600;font-size:11.5px}
.sch .mpn{fill:var(--sch-wire);font-size:9.5px}
.sch .pnum{font-size:8.5px;fill:var(--dim)}
.sch .pname{font-weight:600}
.sch .net{fill:var(--net);font-weight:600}
.sch .pwr{fill:var(--sch-pwr);font-weight:700}
.sch .pwr3{fill:var(--sch-pwr3);font-weight:700}
.sch .refs{font-size:9.5px;fill:var(--sch-text);font-weight:400}
.sch .w{stroke:var(--sch-wire);stroke-width:1.6;fill:none;stroke-linecap:round}
.sch .pin{stroke:var(--sch-text);stroke-width:1.2}
.sch .pb{stroke:var(--sch-pwr);stroke-width:2.6}
.sch .pb3{stroke:var(--sch-pwr3);stroke-width:2.6}
.sch .g{stroke:var(--sch-gnd);stroke-width:1.6}
.sch .gt{fill:var(--sch-gnd);font-size:8px;font-weight:600}
.sch .body{fill:var(--sch-body);stroke:var(--sch-body-line);stroke-width:1.8}
.sch .nbox{fill:var(--sch-bg);stroke:var(--net);stroke-width:1.2}
.sch .secr{fill:none;stroke:var(--sch-dash);stroke-dasharray:7 5;stroke-width:1.3}
.sch .sect{font-family:var(--f-ui);font-weight:600;font-size:12px;fill:var(--ink)}
.sch .title{font-family:var(--f-ui);font-weight:700;font-size:14px;fill:var(--ink)}
.sch .nc{stroke:var(--bad);stroke-width:1.8}
.sch .nct{fill:var(--bad);font-size:8px}
.sch .note{fill:var(--dim);font-size:9px;font-style:italic}
.sch .wn{fill:var(--bad);font-size:9px;font-style:italic}
.sch .jn{fill:var(--sch-wire)}
.sch .dnp{opacity:.5}
.sch .dnp .w{stroke-dasharray:3 3}
.sch .tpc{fill:none;stroke:var(--sch-wire);stroke-width:1.8}
.sch .part{cursor:pointer;transition:opacity .2s}
.sch .hlbox{fill:transparent;stroke:none}
.sch .part:hover .hlbox{fill:var(--hl2)}
.sch .part.sel .hlbox{fill:var(--hl);stroke:var(--accent);stroke-width:1.6}
.sch.focus .part:not(.sel){opacity:.28}

/* idea */
.idea{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.card h3{margin:0;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line2);color:var(--ink2)}
.agreed{margin:0}
.agreed div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2)}
.agreed div:last-child{border-bottom:0}
.agreed dt{font-weight:600;font-size:13px}
.agreed dd{margin:0;font-size:13px;color:var(--ink2)}
.agreed small{display:block;color:var(--dim);font-size:11.5px}
.reqs{list-style:none;margin:0;padding:8px 14px 6px;display:grid;gap:6px;font-size:13px}

<body>
<div class="app" id="app" data-view="work">
  <!-- LEFT: chat -->
  <section class="panel chat" aria-label="Chat with the agent">
    <div class="chead">
      <button class="convbtn" data-act="convs" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><span id="convtitle">Conversation</span></button>
      <button class="newbtn" data-act="new">+ New</button>
    </div>
    <div class="convs" id="convs" hidden></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="composer">
      <div class="sugs" id="sugs"></div>
      <form class="inrow" id="form">
        <textarea id="input" rows="1" dir="auto" placeholder="Message the agent… (Enter to send)"></textarea>
        <button class="btn pri" type="submit" id="sendbtn">Send</button>
      </form>
    </div>
  </section>

  <!-- CENTER: main screen -->
  <section class="panel work" aria-label="Workspace">
    <div class="whead" id="whead"></div>
    <div class="view" id="view"></div>
    <aside class="detail" id="detail" hidden></aside>
    <aside class="viewer" id="viewer" hidden aria-label="File viewer"></aside>
  </section>

  <!-- RIGHT: navigation -->
  <nav class="nav" aria-label="Navigation" id="nav"></nav>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filepick" hidden>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPS = ['LCSC','Mouser','DigiKey'];
const URLQ = new URLSearchParams(location.search);

/* ---------- state ---------- */
let S = null;                 // the whole project, from /api/state
let PROJECT = URLQ.get('project') || null;
let SESSION = URLQ.get('session') || null;
let PROJECTS = [], SKILLS = null, CONFIG = null, ALTIUM_DATA = null, RULES_DATA = null;
let page = 'workspace', tab = 'bom', sel = null, hitSrc = null, sheetId = null;
let convsOpen = false, pending = false, compareCard = null, exportCard = null, libExport = null, altsCard = null;
let svgCache = {key: '', text: ''};
let lastChatKey = '', lastCenterKey = '';

const q = (extra = {}) => {
  const p = new URLSearchParams({project: PROJECT, ...(SESSION ? {session: SESSION} : {}), ...extra});
  return p.toString();
};
async function api(path, body, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const url = path + sep + q();
  const r = body === undefined
    ? await fetch(url)
    : await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let data = null;
  try { data = await r.json(); } catch (e) { data = {error: 'bad response'}; }
  if (!r.ok && !opts.soft) { toast(data.error || ('Error ' + r.status)); throw new Error(data.error || r.status); }
  return data;
}
function setState(st) {
  S = st;
  if (st.session) SESSION = st.session;
}
async function refresh(force) {
  try {
    const st = await api('/api/state');
    setState(st);
    render(force);
  } catch (e) { /* the toast already said it */ }
}
async function loadAltium() {
  try {
    ALTIUM_DATA = await api('/api/altium', undefined, {soft: true});
    if (page === 'settings') renderCenter(true);
  } catch (e) { /* error toasted */ }
}
async function loadRules() {
  try {
    RULES_DATA = await api('/api/rules', undefined, {soft: true});
    if (page === 'workspace' && tab === 'rules') renderCenter(true);
  } catch (e) { /* error toasted */ }
}

/* ---------- derived values ---------- */
const lines = () => (S ? S.bom : []);
const lineByKey = k => lines().find(l => l.key === k);
const lineOfRef = r => lines().find(l => (l.refs || []).includes(r));
const qty = l => (l.dnp || l.nobuy) ? 0 : (l.refs || []).length;
function best(l) {
  if (!l.supply) return null;
  let b = null;
  for (const s of SUPS) {
    const v = l.supply[s]; if (!v || v.unit_price == null) continue;
    if ((v.stock || 0) >= Math.max(qty(l), 1) && (!b || v.unit_price < b.price)) b = {s, stock: v.stock, price: v.unit_price, at: v.checked_at};
  }
  return b;
}
function status(l) {
  if (l.nobuy || l.dnp) return 'na';
  if (l.supply == null) return 'pend';
  if (!best(l)) return 'bad';
  if (l.library === 'review' || l.library === 'missing') return 'warn';
  return 'ok';
}
const money = p => p == null ? '—' : '$' + (p < 0.01 ? p.toFixed(4) : p < 1 ? p.toFixed(3) : p.toFixed(2));
const num = n => (n ?? 0).toLocaleString('en-US');
const LIBTXT = {std: 'Altium default', ok: 'In library · verified', review: 'In library · to review', missing: 'Missing'};
const FIELD = {mpn: 'MPN', manufacturer: 'Manufacturer', package: 'Package', value: 'Value', description: 'Description',
  note: 'Note', datasheet: 'Datasheet', dnp: 'Not fitted', nobuy: 'Not bought', refs: 'Designators', role: 'Role'};
const sheetsOfLine = l => {
  const out = [];
  for (const r of l.refs || []) for (const sh of S.sheets) {
    const p = sh.parts[r]; if (!p) continue;
    const sec = (sh.sections || []).find(x => x.id === p.section);
    out.push({ref: r, sheet: sh.id, section: p.section, title: sec ? sec.title : '', nets: p.nets});
  }
  return out;
};
const checkedAt = () => {
  let t = '';
  for (const l of lines()) for (const s of Object.values(l.supply || {})) if ((s.checked_at || '') > t) t = s.checked_at;
  return t ? t.replace('T', ' ').slice(0, 16) : null;
};
const srcByName = n => (S.sources || []).find(s => s.name === n);

/* ---------- text: citations, refs, lists ---------- */
function chip(name, where) {
  const known = srcByName(name);
  return `<button class="src ${known ? '' : 'broken'}" data-src="${esc(name)}" ${where ? `data-where="${esc(where)}"` : ''} title="${known ? '' : 'Not in Sources'}"><b>${esc(name)}</b>${where ? ' · ' + esc(where) : ''}</button>`;
}
function inline(t) {
  // t is escaped text. Citations and refs become buttons; **bold** and `code` are the only markup.
  return t
    .replace(/\{\{src:([^|}]+)(?:\|([^}]*))?\}\}/g, (m, n, w) => chip(n.trim().replace(/&amp;/g, '&'), (w || '').trim().replace(/&amp;/g, '&')))
    .replace(/\{\{ref:([^}]+)\}\}/g, (m, r) => `<button class="ref" data-ref="${r}">${r}</button>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<span class="m">$1</span>');
}
function fmt(text) {
  const out = []; let list = null;
  const flush = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${i}</li>`).join('')}</${list.t}>`); list = null; } };
  for (const raw of String(text || '').split('\n')) {
    const line = esc(raw);
    const ul = /^\s*[-*] (.*)$/.exec(line), ol = /^\s*\d+[.)] (.*)$/.exec(line);
    if (ul || ol) {
      const t = ul ? 'ul' : 'ol';
      if (!list || list.t !== t) { flush(); list = {t, items: []}; }
      list.items.push(inline((ul || ol)[1]));
    } else if (!line.trim()) { flush(); }
    else if (list && /^\s{2,}/.test(raw)) { list.items[list.items.length - 1] += '<br>' + inline(line.trim()); }
    else { flush(); out.push(`<p>${inline(line)}</p>`); }
  }
  flush();
  return out.join('');
}

/* ---------- chat ---------- */
function diffHTML(p) {
  if (!p) return '';
  const keys = Object.keys(p.changes || {});
  const rows = keys.map(k => [FIELD[k] || k, p.before ? p.before[k] : null, p.changes[k]]);
  if (p.library) rows.push(['Library', 'Missing', 'Model from ' + (p.library.model_source || 'agent') + ' · needs your check']);
  const cls = p.status === 'approved' ? 'ok' : p.status === 'rejected' ? 'no' : '';
  const ref = (lineByKey(p.line)?.refs || [p.line])[0];
  const show = v => Array.isArray(v) ? v.join(', ') : (v === null || v === undefined || v === '') ? '—' : String(v);
  return `<div class="diff ${cls}"><div class="diff-h">Proposed BOM change <button class="ref" data-ref="${esc(ref)}">${esc(p.new ? 'new line ' + p.line : ref)}</button></div>
    <table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td><span class="old">${esc(show(r[1]))}</span> → <span class="new">${esc(show(r[2]))}</span></td></tr>`).join('')}</table>
    <p class="diff-n">${esc(p.reason || '')} ${(p.sources || []).map(s => chip(s, '')).join(' ')}</p>
    ${p.status === 'pending' ? `<div class="diff-a"><button class="btn pri" data-decide="approved" data-pid="${esc(p.id)}">Approve change</button><button class="btn" data-decide="rejected" data-pid="${esc(p.id)}">Reject</button></div>`
      : p.status === 'approved' ? `<div class="diff-s">Approved · BOM, schematic and library updated</div>` : `<div class="diff-s">Rejected · ${esc(p.line)} unchanged</div>`}
  </div>`;
}
function ctxHTML(part) {
  if (!part) return '';
  const secs = [...new Set((part.where || []).map(w => `${w.sheet}:${w.block}${w.title ? ' (' + w.title + ')' : ''}`))].join(', ');
  return `<div class="ctx"><b>The agent has this part's context:</b> <span class="m">${esc(part.mpn)}</span>${secs ? ' · sheet ' + esc(secs) : ''}${part.datasheet ? ' · ' + chip(part.datasheet, '') : ''}
    <div class="nets">${(part.nets || []).map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`;
}
function toolsHTML(items) {
  return `<div class="tools">${items.map(t => `<div class="tool ${esc(t.st || 'ok')}"><span class="ti"></span><span class="tt">${esc(t.t)}</span><span class="td">${esc(t.d || '')}</span></div>`).join('')}</div>`;
}
function stageHTML() {
  if (!S.idea.confirmed) return '';
  const when = (S.idea.confirmed_at || '').slice(0, 10);
  return `<div class="stage"><div class="stage-k">Stage 1 · Idea · confirmed${when ? ' ' + esc(when) : ''}</div><div class="stage-t">${esc(S.title)}</div>
    <div class="stage-d">${S.sheets.length} sheet${S.sheets.length === 1 ? '' : 's'} · ${S.totals.lines} BOM lines</div><button class="lnk" data-tab="idea">Open the idea summary</button></div>`;
}
function msgHTML(m) {
  if (m.role === 'user') return `<div class="msg user"><div class="bubble" dir="auto">${esc(m.text)}</div></div>`;
  if (m.role === 'ctx') return ctxHTML(m.part);
  if (m.role === 'agent') {
    const props = (m.proposals || (m.proposal ? [m.proposal] : [])).map(id => diffHTML(S.proposals.find(p => p.id === id))).join('');
    return (m.tools && m.tools.length ? toolsHTML(m.tools) : '') +
      `<div class="msg agent"><div class="who">PCB Advisor</div><div class="txt" dir="auto">${fmt(m.text)}</div></div>` + props;
  }
  return '';
}
function currentRow() { return (S.sessions || []).find(r => r.id === S.session) || {}; }
function suggestions() {
  const row = currentRow();
  if (row.anchor) return ['Why did we pick this part?', 'Find an in-stock alternative', 'What should I check in the datasheet?'];
  if (row.id === 'idea' || !S.idea.confirmed) return ['What is still open?', 'What should I decide first?'];
  return ['Check stock for the whole BOM', 'Compare supplier prices', 'What is still open?'];
}
function preview(r) { return r.messages ? r.messages + ' message' + (r.messages === 1 ? '' : 's') : 'No messages yet'; }
function renderConvs() {
  const box = $('#convs');
  box.hidden = !convsOpen;
  $('[data-act="convs"]').setAttribute('aria-expanded', convsOpen);
  if (!convsOpen) return;
  const rows = S.sessions || [];
  const item = r => {
    const l = r.anchor ? lineByKey(r.anchor) : null;
    const anc = r.anchor ? (l && l.refs.length > 3 ? `${l.refs[0]}…${l.refs.at(-1)}` : (l ? l.refs.join(',') : r.anchor)) : '';
    return `<button class="conv" data-thread="${esc(r.id)}" aria-current="${r.id === S.session}"><span class="t"><span>${anc ? `<span class="anc">${esc(anc)}</span>` : ''}${esc(r.title)}</span><small>${esc((r.updated || '').slice(5, 10))}</small></span><span class="p">${esc(preview(r))}</span></button>`;
  };
  const proj = rows.filter(r => !r.anchor), parts = rows.filter(r => r.anchor);
  box.innerHTML = `<h4>Project conversations</h4>${proj.map(item).join('')}` + (parts.length ? `<h4>About a part</h4>${parts.map(item).join('')}` : '');
}
function renderChat(force) {
  const key = JSON.stringify([S.session, S.chat.length, S.chat.at(-1)?.ts, S.proposals.map(p => p.status), pending, S.idea.confirmed]);
  if (!force && key === lastChatKey) { renderConvs(); return; }
  lastChatKey = key;
  const row = currentRow();
  const l = row.anchor ? lineByKey(row.anchor) : null;
  $('#convtitle').textContent = (l ? l.refs[0] + (l.refs.length > 1 ? '…' : '') + ' · ' : '') + (row.title || 'Conversation');
  const box = $('#msgs');
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || force;
  let html = row.anchor ? '' : stageHTML();
  html += S.chat.length ? S.chat.map(msgHTML).join('')
    : `<div class="msg agent"><div class="who">PCB Advisor</div><div class="txt"><p>New conversation in ${esc(S.title)}. I can see the BOM, the schematic and all sources.</p></div></div>`;
  if (pending) html += toolsHTML([{t: 'Working…', d: '', st: 'run'}]);
  box.innerHTML = html;
  if (stick) box.scrollTop = box.scrollHeight;
  $('#sugs').innerHTML = suggestions().map(s => `<button class="sug" type="button">${esc(s)}</button>`).join('');
  $('#sendbtn').disabled = pending;
  renderConvs();
}
async function send(text) {
  text = (text || '').trim(); if (!text || pending) return;
  pending = true;
  S.chat = [...S.chat, {role: 'user', text, ts: new Date().toISOString()}];
  renderChat(true);
  try { setState(await api('/api/chat', {text})); }
  catch (e) { /* toast shown */ }
  pending = false;
  render(true);
}
async function openPart(anchor) {
  const r = await api('/api/thread/open', {anchor});

async function loadSheet() {
  const key = sheetId + '|' + JSON.stringify(lines().map(l => [l.key, l.mpn, l.value, l.dnp])) + JSON.stringify(S.sheets.map(s => Object.keys(s.parts).length));
  if (svgCache.key === key && svgCache.text) { afterSheet(); return; }
  const r = await fetch('/api/sheet.svg?' + q({sheet: sheetId}));
  if (!r.ok) { svgCache = {key: '', text: ''}; return; }
  svgCache = {key, text: await r.text()};
  const w = $('#schwrap'); if (w) { w.innerHTML = svgCache.text; afterSheet(); }
}
function afterSheet() {
  const svg = $('#sch'); if (!svg) return;
  if (!svg.dataset.hl) {
    for (const g of svg.querySelectorAll('g.part')) {
      const b = g.getBBox(); if (!b.width) continue;
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', b.x - 6); r.setAttribute('y', b.y - 6); r.setAttribute('width', b.width + 12); r.setAttribute('height', b.height + 12);
      r.setAttribute('rx', 6); r.setAttribute('class', 'hlbox'); g.insertBefore(r, g.firstChild);
    }
    svg.dataset.hl = '1';
  }
  applyFocus();
}
function applyFocus() {
  const svg = $('#sch'); if (!svg) return;
  const l = sel && lineByKey(sel);
  svg.classList.toggle('focus', !!l);
  svg.querySelectorAll('g.part').forEach(g => g.classList.toggle('sel', !!l && (l.refs || []).includes(g.dataset.ref)));
}
function blocksSVG() {
  const blocks = S.idea.blocks || [], links = S.idea.links || [];
  if (!blocks.length) return '<div class="dnote" style="margin:10px">No block diagram yet. The agent draws it once the idea takes shape.</div>';
  const depth = {}; blocks.forEach(b => depth[b.id] = 0);
  for (let i = 0; i < blocks.length; i++) for (const [a, b] of links) if (depth[a] !== undefined && depth[b] !== undefined) depth[b] = Math.max(depth[b], depth[a] + 1);
  const cols = {}; blocks.forEach(b => (cols[depth[b.id]] ||= []).push(b));
  const W = 140, H = 52, GX = 40, GY = 22, pos = {};
  const ncol = Object.keys(cols).length, maxn = Math.max(...Object.values(cols).map(c => c.length));
  Object.entries(cols).forEach(([d, bs]) => bs.forEach((b, i) => pos[b.id] = {x: 10 + d * (W + GX), y: 16 + i * (H + GY) + (maxn - bs.length) * (H + GY) / 2}));
  const w = 20 + ncol * (W + GX) - GX, h = 32 + maxn * (H + GY) - GY;
  let s = '';
  for (const [a, b] of links) { const p = pos[a], r = pos[b]; if (!p || !r) continue;
    s += `<path d="M${p.x + W} ${p.y + H / 2}C${p.x + W + GX / 2} ${p.y + H / 2} ${r.x - GX / 2} ${r.y + H / 2} ${r.x} ${r.y + H / 2}"/>`; }
  for (const b of blocks) { const p = pos[b.id];
    s += `<g class="${b.sheet ? 'cur' : ''} ${b.open ? 'open' : ''}" ${b.sheet ? 'data-tab="sch"' : ''}><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="7"/><text x="${p.x + 10}" y="${p.y + 22}">${esc(b.label || b.id)}</text><text x="${p.x + 10}" y="${p.y + 40}" class="s">${esc(b.sub || '')}</text></g>`; }
  return `<svg class="blocks" viewBox="0 0 ${w} ${h}" role="img" aria-label="Block diagram">${s}</svg>`;
}

function closeViewer() {
  const v = $('#viewer');
  if (v && !v.hidden) {
    v.hidden = true;
    v.innerHTML = '';
  }
}
function parseCsvLine(line) {
  const cells = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      cells.push(cur.trim()); cur = '';
    } else {
      cur += ch;
    }
  }
  cells.push(cur.trim());
  return cells;
}
async function openViewerSource(name, where) {
  const v = $('#viewer');
  if (!v) return;
  setView('work');
  v.hidden = false;
  const known = srcByName(name);
  const size = (known && known.size) ? known.size : '';
  const ext = (name.includes('.') ? '.' + name.split('.').pop() : '').toLowerCase();
  const qDownload = q({download: '1'});
  const downloadUrl = `/api/source/${encodeURIComponent(name)}?${qDownload}`;
  const rawUrl = `/api/source/${encodeURIComponent(name)}?${q()}`;

  if (['.schdoc', '.pcbdoc', '.prjpcb', '.rul'].includes(ext)) {
    let resolved = null;
    if (ALTIUM_DATA && ALTIUM_DATA.linked) {
      const l = ALTIUM_DATA.linked;
      const allDocs = [...(l.sheets || []), l.pcb_file, l.project_file].filter(Boolean);
      resolved = allDocs.find(p => p.toLowerCase().endsWith(name.toLowerCase()));
    }
    if (resolved) {
      return openViewerAltium(resolved);
    }
  }

  if (ext === '.pdf') {
    let iframeUrl = rawUrl;
    const m = (where || '').match(/\b(?:p\.?|page)\s*(\d+)\b/i);
    if (m) iframeUrl += '#page=' + m[1];
    v.innerHTML = `
      <div class="viewer-h">
        <div class="vtitle"><span class="badge">PDF</span><span title="${esc(name)}">${esc(name)}${m ? ` (p. ${m[1]})` : ''}</span></div>
        <div class="vacts">
          <a class="lnk" href="${esc(downloadUrl)}" download>Download</a>
          <a class="lnk" href="${esc(iframeUrl)}" target="_blank" rel="noopener">Open in tab</a>
          <button class="x" data-act="closeviewer" aria-label="Close">×</button>
        </div>
      </div>
      <div class="viewer-b" style="padding:0">
        <iframe src="${esc(iframeUrl)}" style="width:100%;height:100%;border:0;flex:1;min-height:0" title="${esc(name)}"></iframe>
      </div>`;
    return;
  }

  if (['.png', '.jpg', '.jpeg', '.gif', '.webp'].includes(ext)) {
    v.innerHTML = `
      <div class="viewer-h">
        <div class="vtitle"><span class="badge">IMAGE</span><span title="${esc(name)}">${esc(name)}</span></div>
        <div class="vacts">
          <a class="lnk" href="${esc(downloadUrl)}" download>Download</a>
          <a class="lnk" href="${esc(rawUrl)}" target="_blank" rel="noopener">Open in tab</a>
          <button class="x" data-act="closeviewer" aria-label="Close">×</button>
        </div>
      </div>
      <div class="viewer-b" style="align-items:center;justify-content:center;background:var(--panel2)">
        <img src="${esc(rawUrl)}" alt="${esc(name)}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:4px">
      </div>`;
    return;
  }

  if (['.txt', '.text', '.md', '.markdown', '.csv', '.json'].includes(ext) || (known && known.text)) {
    v.innerHTML = `
      <div class="viewer-h">
        <div class="vtitle"><span class="badge">${esc(ext ? ext.slice(1).toUpperCase() : 'TEXT')}</span><span title="${esc(name)}">${esc(name)}</span></div>
        <div class="vacts">
          <a class="lnk" href="${esc(downloadUrl)}" download>Download</a>
          <a class="lnk" href="${esc(rawUrl)}" target="_blank" rel="noopener">Open in tab</a>
          <button class="x" data-act="closeviewer" aria-label="Close">×</button>
        </div>
      </div>
      <div class="viewer-b"><div class="dnote">Loading text…</div></div>`;
    try {
      const res = await fetch(rawUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const bodyEl = v.querySelector('.viewer-b');
      if (!bodyEl) return;
      if (ext === '.csv') {
        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        const maxRows = 500;
        const rows = [];
        for (let i = 0; i < Math.min(lines.length, maxRows); i++) {
          rows.push(parseCsvLine(lines[i]));
        }
        if (rows.length) {
          const head = rows[0];
          const bodyRows = rows.slice(1);
          bodyEl.innerHTML = `<div class="tblwrap"><table class="viewer-tbl">` +
            `<thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>` +
            `<tbody>${bodyRows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>` +
            `</table></div>` +
            (lines.length > maxRows ? `<div class="dnote" style="margin-top:8px">Showing 500 of ${lines.length} rows</div>` : '');
        } else {
          bodyEl.innerHTML = `<div class="dnote">Empty CSV file</div>`;
        }
      } else {
        bodyEl.innerHTML = `<pre class="viewer-pre">${esc(text)}</pre>`;
      }
    } catch (err) {
      const bodyEl = v.querySelector('.viewer-b');
      if (bodyEl) bodyEl.innerHTML = `<div class="warnbox"><b>Failed to load text:</b> ${esc(err.message)}</div>`;
    }
    return;
  }

  // Anything else: name, size and a "Download" link
  v.innerHTML = `
    <div class="viewer-h">
      <div class="vtitle"><span class="badge">FILE</span><span title="${esc(name)}">${esc(name)}</span></div>
      <div class="vacts">
        <button class="x" data-act="closeviewer" aria-label="Close">×</button>
      </div>
    </div>
    <div class="viewer-b">
      <div class="card" style="padding:16px;display:grid;gap:12px">
        <div><b>File name:</b> <span class="m">${esc(name)}</span></div>
        ${size ? `<div><b>Size:</b> ${esc(size)}</div>` : ''}
        <div><a class="btn pri" href="${esc(downloadUrl)}" download>Download</a></div>
      </div>
    </div>`;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('button, tr[data-key], g.part, g[data-tab], a');
  if (!el) return;
  if (el.tagName === 'A') return;
  if (el.matches('g.part')) { const l = lineOfRef(el.dataset.ref); if (l) select(l.key); return; }
  if (el.matches('tr[data-key]')) { if (e.target.closest('input')) return; if (!e.target.closest('button')) { select(el.dataset.key); return; } }
  const d = el.dataset;
  try {
    if (d.decide) { setState(await api('/api/proposal', {id: d.pid, decision: d.decide})); render(true); toast(d.decide === 'approved' ? 'Change applied to the BOM, schematic and library' : 'Rejected. Nothing changed'); return; }
    if (d.accept) { setState(await api('/api/library/accept', {line: d.accept})); render(true); toast('Accepted'); return; }
    if (d.verify) { toast('Verifying…'); const r = await api('/api/skill', {name: 'verify', args: [d.verify]}); setState(r.state); render(true); toast('Result: ' + r.result.verify); return; }
    if (d.thread !== undefined && el.dataset.thread !== undefined) { if (d.thread) switchSession(d.thread); return; }
    if (d.proj) { ALTIUM_DATA = null; const u = new URL(location.href); u.searchParams.set('project', d.proj); u.searchParams.delete('session'); location.href = u; return; }
    if (d.tab) { go('workspace', d.tab); return; }
    if (d.page) { go(d.page); return; }
    if (d.view) { setView(d.view); return; }
    if (d.src) { hitSrc = d.src; openViewerSource(d.src, el.dataset.where); return; }
    if (d.altiumPath) { openViewerAltium(d.altiumPath); return; }
    if (d.ref) { const l = lineOfRef(d.ref); if (l) select(l.key); return; }
    if (d.show) { select(d.show, true); return; }
    if (d.chat) { openPart(d.chat); return; }
    if (d.sheet) { sheetId = d.sheet; svgCache = {key: '', text: ''}; render(true); return; }
    if (d.calc) {
      if (d.calc === 'tw') {
        const cur = parseFloat($('#calc-tw-i').value) || 1.0;
        const rise = parseFloat($('#calc-tw-dt').value) || 10.0;
        const oz = parseFloat($('#calc-tw-oz').value) || 1.0;
        const res = await api(`/api/calc?type=trace_width&current=${cur}&rise=${rise}&oz=${oz}`);
        const box = $('#res-tw');
        box.style.display = 'block';
        box.innerHTML = `<b>Width: ${res.width_mm} mm (${res.width_mil} mil)</b><br><small style="color:var(--dim)">Formula: ${esc(res.formula)}<br>Source: ${esc(res.source)}</small>`;
      } else if (d.calc === 'div') {
        const vin = parseFloat($('#calc-div-vin').value) || 5.0;
        const vout = parseFloat($('#calc-div-vout').value) || 3.3;
        const res = await api(`/api/calc?type=divider&vin=${vin}&vout=${vout}`);
        const box = $('#res-div');
        box.style.display = 'block';
        box.innerHTML = `<b>Recommended E24: R1 = ${res.r1} Ω, R2 = ${res.r2} Ω</b><br>Actual Vout: <b>${res.vout} V</b> (error ${res.error_pct}%)<br><small style="color:var(--dim)">Formula: ${esc(res.formula)}<br>Source: ${esc(res.source)}</small>`;
      } else if (d.calc === 'led') {
        const vs = parseFloat($('#calc-led-vs').value) || 5.0;
        const vf = parseFloat($('#calc-led-vf').value) || 2.0;
        const if_ma = parseFloat($('#calc-led-if').value) || 20.0;
        const res = await api(`/api/calc?type=led&v_supply=${vs}&v_forward=${vf}&i_forward_ma=${if_ma}`);
        const box = $('#res-led');
        box.style.display = 'block';
        box.innerHTML = `<b>Standard E24 Resistor: ${res.r_standard_ohm} Ω</b> (exact: ${res.r_exact_ohm} Ω)<br>Power dissipation: <b>${res.power_w} W</b><br><small style="color:var(--dim)">Formula: ${esc(res.formula)}<br>Source: ${esc(res.source)}</small>`;
      } else if (d.calc === 'via') {
        const drill = parseFloat($('#calc-via-d').value) || 0.3;
        const rise = parseFloat($('#calc-via-dt').value) || 10.0;
        const res = await api(`/api/calc?type=via&drill_mm=${drill}&rise=${rise}`);
        const box = $('#res-via');
        box.style.display = 'block';
        box.innerHTML = `<b>Max current: ${res.current_a} A</b> (barrel area ${res.barrel_area_mil2} mil²)<br><small style="color:var(--dim)">Formula: ${esc(res.formula)}<br>Source: ${esc(res.source)}</small>`;
      } else if (d.calc === 'ms') {
        const w = parseFloat($('#calc-ms-w').value) || 0.3;
        const h = parseFloat($('#calc-ms-h').value) || 0.2;
        const er = parseFloat($('#calc-ms-er').value) || 4.4;
        const res = await api(`/api/calc?type=microstrip&width_mm=${w}&height_mm=${h}&er=${er}`);
        const box = $('#res-ms');
        box.style.display = 'block';
        box.innerHTML = `<b>Impedance Z0: ${res.z0_ohm} Ω</b><br><small style="color:var(--dim)">Formula: ${esc(res.formula)}<br>Source: ${esc(res.source)}</small>`;
      }
      return;
    }
    if (d.act === 'add-extra-rule') {
      const name = ($('#er-name')?.value || '').trim();
      const kind = $('#er-kind')?.value || 'Width';
      const scope1 = ($('#er-scope')?.value || 'All').trim();
      const val = ($('#er-val')?.value || '').trim();
      if (!name || !val) { toast('Please specify rule name and value'); return; }
      await api('/api/rules/extra', {rule: {name, kind, scope1, value: val}});
      toast('Extra rule added');
      await loadRules();
      render(true);
      return;
    }
    switch (d.act) {
      case 'closeviewer': closeViewer(); return;
      case 'close': sel = null; renderDetail(); document.querySelectorAll('#view tr.sel').forEach(r => r.classList.remove('sel')); applyFocus(); return;
      case 'closecard': compareCard = exportCard = libExport = altsCard = null; render(true); return;
      case 'convs': convsOpen = !convsOpen; renderConvs(); return;
      case 'check-all': toast('Checking stock with JLC…'); { const r = await api('/api/parts/check', {}); setState(r); render(true); toast('Stock checked for all lines'); } return;
      case 'alts': {
        const lineKey = el.dataset.line;
        const l = lineByKey(lineKey);
        altsCard = {line: lineKey, mpn: l ? l.mpn : '', loading: true, list: []};
        compareCard = exportCard = libExport = null;
        render(true);
        try {
          const list = await api(`/api/parts/alternatives?line=${encodeURIComponent(lineKey)}`);
          altsCard = {line: lineKey, mpn: l ? l.mpn : '', loading: false, list: Array.isArray(list) ? list : []};
        } catch (err) {
          altsCard = {line: lineKey, mpn: l ? l.mpn : '', loading: false, list: []};
        }
        render(true);
        return;
      }
      case 'propose-alt': {
        const lineKey = el.dataset.line;
        const mpn = el.dataset.mpn;
        const pkg = el.dataset.pkg;
        const desc = el.dataset.desc;
        const code = el.dataset.code;
        const libType = el.dataset.type;
        toast('Proposing alternative…');
        const res = await api('/api/bom/propose', {
          line: lineKey,
          changes: {mpn, package: pkg, description: desc},
          reason: `Alternative part proposed: ${code} (${libType || 'Standard'})`,
          sources: [`JLC ${code}`]
        });
        setState(res);
        altsCard = null;
        render(true);
        toast(`Proposed ${mpn} for line ${lineKey}`);
        return;
      }
      case 'get-datasheet': {
        const lineKey = el.dataset.line;
        toast('Fetching datasheet…');
        const res = await api('/api/parts/datasheet', {line: lineKey});
        if (res.error) {
          if (res.url) {
            alert(`Could not download datasheet automatically (${res.error}).\n\nPlease open this link, download the PDF, and upload it in Sources:\n${res.url}`);
          } else {
            toast('Could not find datasheet URL: ' + res.error);
          }
          return;
        }
        if (res.state) setState(res.state);
        render(true);
        toast('Datasheet added to ' + lineKey);
        return;
      }
      case 'new': { const r = await api('/api/sessions/new', {}); SESSION = r.created; convsOpen = false; await refresh(true); return; }
      case 'newproj': { const n = prompt('Name of the new project'); if (!n) return;
        const r = await api('/api/projects/new', {name: n}); const u = new URL(location.href); u.searchParams.set('project', r.created); u.searchParams.delete('session'); location.href = u; return; }
      case 'confirmidea': setState(await api('/api/idea/confirm', {})); render(true); toast('Idea confirmed'); return;
      case 'check': toast('Checking stock… this can take a little while'); { const r = await api('/api/skill', {name: 'check'}); setState(r.state); render(true);
        const errs = r.result.results.filter(x => x.error); toast('Stock checked' + (errs.length ? ` · ${errs.length} supplier error(s)` : '')); } return;
      case 'compare': { const r = await api('/api/skill', {name: 'compare'}); compareCard = r.result; exportCard = null; render(true); } return;
      case 'export': { const r = await api('/api/skill', {name: 'export_bom', args: [d.fmt]}); exportCard = r.result; compareCard = null; render(true); } return;
      case 'libexport': libExport = await api('/api/library/export', {}); render(true); return;
      case 'upload': $('#filepick').click(); return;
      case 'addurl': { const u = prompt('Address of the document (a PDF or text file)'); if (!u) return; toast('Fetching…');
        const r = await api('/api/fetch_source', {url: u}); if (r.error) { toast(r.error); return; } setState(r); render(true); toast('Added'); } return;
      case 'altium-link': { const p = el.dataset.path; if (!p) return;
        ALTIUM_DATA = await api('/api/altium/link', {path: p}); render(true); toast('Linked Altium project'); return; }
      case 'altium-link-custom': { const inp = $('#altium-custom-path'); const p = inp ? inp.value.trim() : '';
        if (!p) { toast('Path required'); return; }
        ALTIUM_DATA = await api('/api/altium/link', {path: p}); render(true); toast('Linked Altium project'); return; }
      case 'altium-unlink': {
        ALTIUM_DATA = await api('/api/altium/unlink', {}); render(true); toast('Unlinked Altium project'); return; }
      case 'saveset': {
        const set = {'agent.provider': $('#set-provider').value, 'agent.model': $('#set-model').value, 'user.language': $('#set-language').value, 'user.name': $('#set-name').value};
        const ap = $('#set-altium-path');
        if (ap) set['altium.install_path'] = ap.value.trim();
        const r = await api('/api/config', {set}); CONFIG = r.config; await loadAltium(); render(true); toast('Saved'); return; }
      case 'savemem': { await api('/api/memory', {text: $('#mem').value}); await refresh(true); toast('Memory saved'); return; }
      case 'rewritemem': { toast('Rewriting…'); await api('/api/memory', {}); await refresh(true); return; }
    }
  } catch (err) { /* api() already toasted */ }
  if (el.classList.contains('sug')) { send(el.textContent); return; }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'altium-pcb-select' || e.target.id === 'altium-outdir') {
    if (!ALTIUM_DATA || !ALTIUM_DATA.linked || !ALTIUM_DATA.linked.project_file) return;
    const pcbEl = $('#altium-pcb-select');
    const pcb = pcbEl ? pcbEl.value : (ALTIUM_DATA.linked.pcb_file || undefined);
    const outEl = $('#altium-outdir');
    const out = outEl ? outEl.value.trim() : (ALTIUM_DATA.linked.outputs_dir || undefined);
    try {
      ALTIUM_DATA = await api('/api/altium/link', {path: ALTIUM_DATA.linked.project_file, pcb_file: pcb, outputs_dir: out});
      render(true);
      toast('Project link updated');
    } catch (err) { /* toasted */ }
    return;
  }
  if (e.target.id === 'filepick') {
    const f = e.target.files[0]; if (!f) return;
    const buf = new Uint8Array(await f.arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    try { setState(await api('/api/upload', {name: f.name, data_b64: btoa(bin)})); render(true); toast('Uploaded ' + f.name); } catch (err) { /* toasted */ }
    e.target.value = ''; return;
  }
  const i = e.target.closest('input[data-edit]'); if (!i) return;
  const l = lineByKey(i.dataset.line); if (!l) return;
  const field = i.dataset.edit, val = i.value.trim();
  if (val === (l[field] ?? '') || (field === 'mpn' && !val)) return;
  try {
    setState(await api('/api/bom/edit', {line: l.key, field, value: val})); render(true);
    toast(field === 'mpn' ? `MPN updated. Checking stock for ${val}…` : 'Note saved');
    if (field === 'mpn') setTimeout(() => refresh(), 6000);
  } catch (err) { /* toasted */ }
});
$('#form').addEventListener('submit', e => { e.preventDefault(); const i = $('#input'); const t = i.value; i.value = ''; i.style.height = ''; send(t); });
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#form').requestSubmit(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeViewer(); } });

/* ---------- start ---------- */
(async function start() {
  try {
    const p = await (await fetch('/api/projects')).json();
    PROJECTS = p.projects || [];
    if (!PROJECT) PROJECT = p.default || (PROJECTS[0] && PROJECTS[0].name) || 'demo';
    const st = await api('/api/state'); setState(st);
    const [sk, cfg] = await Promise.all([api('/api/skills', undefined, {soft: true}), api('/api/config', undefined, {soft: true})]);
    SKILLS = sk.skills || []; CONFIG = cfg;
    if (!S.idea.confirmed && !S.bom.length) tab = 'idea';
    if (URLQ.get('page')) page = URLQ.get('page');
    if (URLQ.get('tab')) tab = URLQ.get('tab');
    if (URLQ.get('sel')) sel = URLQ.get('sel');
    if (URLQ.get('sheet')) sheetId = URLQ.get('sheet');
    if (URLQ.get('convs')) convsOpen = true;
    if (page === 'settings') loadAltium();
    render(true);
  } catch (err) { document.body.innerHTML = '<p style="padding:20px">Could not load the project: ' + esc(err.message) + '</p>'; return; }
  setInterval(() => { if (!pending && !document.hidden) refresh(); }, 4000);
})();
</script>
