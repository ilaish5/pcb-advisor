name: tests

# The portable test set on every push and pull request: everything except the tests marked `windows` (need Windows itself)
# or `altium` (need a live Altium Designer). Those run on the Windows PC: python -m pytest -q -m "windows or altium" < NUL
# (docs/TESTING.md).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4          # the UI tests run ui/js through node (shutil.which("node"))
        with:
          node-version: lts/*

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (not windows, not altium)
        run: python -m pytest -q -rfE -m "not windows and not altium" -o faulthandler_timeout=600 --junitxml=pytest-junit.xml < /dev/null

      - name: upload junit xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: pytest-junit.xml
