<title>PCB Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: chat (left) | main screen with tabs (center) | navigation sidebar (right). Light theme only, by choice. */
:root{
  color-scheme:light;
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --line:#d6dce8; --line2:#e7ebf2;
  --ink:#141a26; --ink2:#323c50; --dim:#5b667b;
  --accent:#2148c9; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --net:#6b2fb3; --net-soft:#f0e7fb;
  --ok:#167a46; --ok-soft:#e1f2e8; --warn:#8f5d00; --warn-soft:#fbefd2; --bad:#b8322a; --bad-soft:#fbe4e2;
  --nav:#17203a; --nav-ink:#dfe5f3; --nav-dim:#94a0bd; --nav-sel:#2a3657;
  --sch-bg:#fbfcfe; --sch-wire:#233f99; --sch-body:#fdf2c8; --sch-body-line:#7d2f14; --sch-text:#151515;
  --sch-pwr:#d27a12; --sch-pwr3:#2e7a33; --sch-gnd:#6b4a3a; --sch-dash:#a3abba;
  --hl:rgba(33,72,201,.15); --hl2:rgba(33,72,201,.07);
  --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 20px rgba(20,26,38,.07);
  --f-ui:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{font-family:var(--f-mono)}
.app{height:100%;display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr) 216px;gap:12px;padding-inline:16px;padding-block:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:0;min-width:0}

/* ---------- nav (right) ---------- */
.nav{background:var(--nav);color:var(--nav-ink);border-radius:12px;display:flex;flex-direction:column;gap:18px;padding:14px 10px;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:0 6px}
.brand svg{width:22px;height:22px;flex:none}
.ngroup{display:grid;gap:2px}
.nlabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-dim);padding:0 8px 4px}
.nitem{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--nav-ink);text-align:left;padding:7px 8px;border-radius:8px;font-size:13.5px}
.nitem svg{width:17px;height:17px;flex:none;opacity:.85}
.nitem .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .cnt{font-family:var(--f-mono);font-size:11px;color:var(--nav-dim)}
.nitem:hover{background:rgba(255,255,255,.06)}
.nitem[aria-current="true"]{background:var(--nav-sel);font-weight:600}
.nitem .pdot{width:8px;height:8px;border-radius:50%;background:var(--nav-dim);flex:none;margin-inline:4.5px}
.nitem[aria-current="true"] .pdot{background:#7fd1a4}
.nsub{display:grid;gap:1px;padding-left:35px}
.nsub button{border:0;background:none;color:var(--nav-dim);text-align:left;padding:3px 8px;border-radius:6px;font-size:12.5px}
.nsub button:hover{color:var(--nav-ink)}
.nsub button[aria-current="true"]{color:var(--nav-ink);font-weight:600}
.nfoot{margin-top:auto;display:grid;gap:8px}
.mock{font-size:11.5px;color:#f3d48c;border:1px solid #6b5a2c;border-radius:8px;padding:5px 8px;line-height:1.35}

/* ---------- chat (left) ---------- */
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.convbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px;min-width:0;flex:1;text-align:left}
.convbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.convbtn svg{width:14px;height:14px;flex:none}
.newbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap}
.newbtn:hover,.convbtn:hover{border-color:var(--accent)}
.convs{position:absolute;inset:51px 0 0 0;background:var(--panel);z-index:4;overflow-y:auto;padding:8px}
.convs h4{margin:8px 6px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.conv{display:grid;gap:1px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px}
.conv:hover{background:var(--panel2)}
.conv[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.conv .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.conv .t small{font-weight:400;color:var(--dim);font-size:11.5px;white-space:nowrap}
.conv .p{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .anc{font-family:var(--f-mono);font-size:11px;color:var(--net);background:var(--net-soft);border-radius:4px;padding:0 5px;margin-right:4px}
.msgs{overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px}
.msg.user{align-self:flex-end;max-width:88%}
.msg.user .bubble{background:var(--accent-soft);border-radius:12px 12px 3px 12px;padding:8px 12px;white-space:pre-wrap}
.msg.agent .who{font-size:11.5px;color:var(--dim);font-weight:600;margin-bottom:2px}
.msg.agent .txt{color:var(--ink2)}
.msg.agent .txt p{margin:0 0 6px}
.msg.agent .txt ul,.msg.agent .txt ol{margin:4px 0 6px;padding-left:18px}
.msg.agent .txt li{margin-bottom:4px}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--net);background:var(--net-soft);border:0;border-radius:5px;padding:0 6px}
.ref:hover{text-decoration:underline}
.src{display:inline-flex;gap:5px;align-items:baseline;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-top:3px;background:var(--panel2);text-align:left}
.src b{font-weight:600;color:var(--ink2);font-family:var(--f-mono);font-size:11px}
button.src:hover{border-color:var(--accent)}
.tools{border:1px solid var(--line2);border-radius:9px;background:var(--panel2);padding:6px 10px;display:grid;gap:3px;font-size:12.5px}
.tool{display:grid;grid-template-columns:16px auto minmax(0,1fr);gap:8px;align-items:baseline}
.tool .tt{font-weight:600;color:var(--ink2);white-space:nowrap}
.tool .td{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .ti::before{display:inline-block;width:14px;text-align:center;font-weight:700}
.tool.ok .ti::before{content:"✓";color:var(--ok)}
.tool.warn .ti::before{content:"!";color:var(--warn)}
.tool.run .ti::before{content:"";width:9px;height:9px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tool.run .ti::before{animation:none}}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.stage-k{font-size:11.5px;color:var(--ok);font-weight:600}
.stage-t{font-weight:600}
.stage-d{font-size:12.5px;color:var(--dim)}
.lnk{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.lnk:hover{text-decoration:underline}
.diff{border:1px solid var(--warn);border-radius:10px;overflow:hidden;background:var(--panel)}
.diff.ok{border-color:var(--ok)} .diff.no{border-color:var(--line);opacity:.75}
.diff-h{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--warn-soft);font-weight:600;font-size:13px}
.diff.ok .diff-h{background:var(--ok-soft)} .diff.no .diff-h{background:var(--panel2)}
.diff table{width:100%;border-collapse:collapse;font-size:12.5px}
.diff td{padding:4px 12px;border-top:1px solid var(--line2);vertical-align:top}
.diff td:first-child{color:var(--dim);width:30%}
.diff .old{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.diff .new{color:var(--ok);font-weight:600}
.diff-n{margin:0;padding:6px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--line2)}
.diff-a{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line2)}
.diff-s{padding:7px 12px;font-size:12.5px;font-weight:600;border-top:1px solid var(--line2);color:var(--dim)}
.diff.ok .diff-s{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.ctx{border:1px dashed var(--net);border-radius:10px;padding:8px 12px;font-size:12.5px;background:var(--net-soft);color:var(--ink2)}
.ctx b{color:var(--ink)}
.ctx .nets{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ctx .nets span{font-family:var(--f-mono);font-size:11px;color:var(--net);border:1px solid var(--net);border-radius:4px;padding:0 5px}
.composer{border-top:1px solid var(--line2);padding:8px 12px 12px;display:grid;gap:8px}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink2)}
.sug:hover{border-color:var(--accent);color:var(--accent)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:8px 11px;font:inherit;min-height:42px;max-height:120px}
.inrow .btn.pri{height:42px;padding-inline:16px}

/* ---------- center ---------- */
.work{display:grid;grid-template-rows:auto minmax(0,1fr);position:relative;overflow:hidden}
.whead{display:flex;align-items:center;gap:12px;padding:10px 16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--dim);padding-bottom:10px}
.crumb b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-right:auto}
.tab{border:0;background:none;padding:7px 12px 9px;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center;white-space:nowrap;color:var(--dim);font-weight:500}
.tab .n{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st{font-size:11px;border-radius:999px;padding:0 7px;font-weight:600;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.dim{background:var(--panel2);color:var(--dim)}
.view{overflow:auto;padding:14px 16px;min-width:0}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.vhead h2{margin:0;font-size:17px;text-wrap:balance}
.vhead p{margin:2px 0 0;color:var(--dim);font-size:13px;max-width:70ch}
.vacts{display:flex;gap:6px;flex-wrap:wrap}

/* BOM */
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:5px 12px;background:var(--panel2);display:flex;gap:8px;align-items:baseline}
.kpi b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--dim)}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)} .kpi.bad b{color:var(--bad)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)} .kpi.warn b{color:var(--warn)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.bom{border-collapse:collapse;width:100%;min-width:1000px;font-size:13px}
.bom th,.libt th,.srct th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;font-size:12px;color:var(--dim);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.bom td{padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
.bom tr,.libt tr{cursor:pointer}
.bom tbody tr:hover td,.libt tbody tr:hover td{background:var(--hl2)}
.bom tr.sel td,.libt tr.sel td{background:var(--hl)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--ok-soft)}100%{background:transparent}}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.refs{font-family:var(--f-mono);font-weight:600;color:var(--net)}
.bom .mpn input,.bom .note input{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:5px;padding:1px 5px;width:100%}
.bom .mpn input{font-family:var(--f-mono);font-size:12.5px;min-width:150px}
.bom .note input{min-width:170px;color:var(--dim)}
.bom input:hover{border-color:var(--line)}
.bom input:focus{border-color:var(--accent);background:var(--panel)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.na{background:var(--line)} .dot.pend{background:var(--accent)}
.lib{font-size:12px;border-radius:5px;padding:0 7px;white-space:nowrap}
.lib.std{color:var(--dim);background:var(--panel2)} .lib.ok{color:var(--ok);background:var(--ok-soft)} .lib.review{color:var(--warn);background:var(--warn-soft)} .lib.missing{color:var(--bad);background:var(--bad-soft)}
.secs{display:flex;gap:3px}
.secb{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:0 5px}
.secb:hover{border-color:var(--accent);color:var(--accent)}
.stock.bad{color:var(--bad);font-weight:600}
.foot{font-size:12px;color:var(--dim);margin-top:8px}

/* detail drawer */
.detail{position:absolute;top:0;right:0;bottom:0;width:320px;max-width:100%;border-left:1px solid var(--line);overflow-y:auto;background:var(--panel);box-shadow:-10px 0 28px rgba(20,26,38,.12);z-index:5}
.dt{padding:14px 16px;display:grid;gap:14px}
.dt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dt-h .refs{font-size:13px}
.dt-h h3{margin:2px 0 0;font-family:var(--f-mono);font-size:16px;word-break:break-all}
.dt-h p{margin:2px 0 0;color:var(--dim);font-size:12.5px}
.x{border:0;background:none;font-size:18px;line-height:1;color:var(--dim);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--panel2)}
.dt-a{display:flex;gap:6px;flex-wrap:wrap}
.dsec h4{margin:0 0 5px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.where{display:grid;gap:4px}
.where button{display:flex;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:4px 8px;font-size:12.5px}
.where button:hover{border-color:var(--accent)}
.where .r{font-family:var(--f-mono);font-weight:600;color:var(--net)}
.where .s{color:var(--dim)}
.netl{display:flex;flex-wrap:wrap;gap:4px}
.netl span{font-family:var(--f-mono);font-size:11px;color:var(--net);border:1px solid var(--net);border-radius:4px;padding:0 5px}
table.sup{width:100%;border-collapse:collapse;font-size:12.5px}
.sup td,.sup th{padding:3px 4px;border-bottom:1px solid var(--line2);text-align:left}
.sup th{font-weight:600;color:var(--dim);font-size:11.5px}
.sup tr.best td{color:var(--ok);font-weight:600}
.checked{font-size:11.5px;color:var(--dim);margin-top:4px}
.libg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.libg div{border:1px solid var(--line2);border-radius:7px;padding:4px 6px;text-align:center;font-size:12px}
.libg b{display:block;font-size:14px}
.y{color:var(--ok)} .nn{color:var(--bad)} .q{color:var(--warn)}
.dnote{font-size:12.5px;color:var(--ink2);background:var(--panel2);border-radius:7px;padding:6px 9px}

/* schematic */
.sheets{display:flex;gap:4px;flex-wrap:wrap}
.sheet{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:12.5px}
.sheet[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sheet:disabled{color:var(--dim);cursor:default;opacity:.7}
.schwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--sch-bg)}
svg.sch{display:block;width:100%;min-width:980px;height:auto}
.sch text{font-family:var(--f-mono);font-size:10px;fill:var(--sch-text)}
.sch .refd{font-weight:600;font-size:11.5px}
.sch .mpn{fill:var(--sch-wire);font-size:9.5px}
.sch .pnum{font-size:8.5px;fill:var(--dim)}
.sch .pname{font-weight:600}
.sch .net{fill:var(--net);font-weight:600}
.sch .pwr{fill:var(--sch-pwr);font-weight:700}
.sch .pwr3{fill:var(--sch-pwr3);font-weight:700}
.sch .refs{font-size:9.5px;fill:var(--sch-text);font-weight:400}
.sch .w{stroke:var(--sch-wire);stroke-width:1.6;fill:none;stroke-linecap:round}
.sch .pin{stroke:var(--sch-text);stroke-width:1.2}
.sch .pb{stroke:var(--sch-pwr);stroke-width:2.6}
.sch .pb3{stroke:var(--sch-pwr3);stroke-width:2.6}
.sch .g{stroke:var(--sch-gnd);stroke-width:1.6}
.sch .gt{fill:var(--sch-gnd);font-size:8px;font-weight:600}
.sch .body{fill:var(--sch-body);stroke:var(--sch-body-line);stroke-width:1.8}
.sch .nbox{fill:var(--sch-bg);stroke:var(--net);stroke-width:1.2}
.sch .secr{fill:none;stroke:var(--sch-dash);stroke-dasharray:7 5;stroke-width:1.3}
.sch .sect{font-family:var(--f-ui);font-weight:600;font-size:12px;fill:var(--ink)}
.sch .title{font-family:var(--f-ui);font-weight:700;font-size:14px;fill:var(--ink)}
.sch .nc{stroke:var(--bad);stroke-width:1.8}
.sch .nct{fill:var(--bad);font-size:8px}
.sch .note{fill:var(--dim);font-size:9px;font-style:italic}
.sch .wn{fill:var(--bad);font-size:9px;font-style:italic}
.sch .jn{fill:var(--sch-wire)}
.sch .dnp{opacity:.5}
.sch .dnp .w{stroke-dasharray:3 3}
.sch .tpc{fill:none;stroke:var(--sch-wire);stroke-width:1.8}
.sch .part{cursor:pointer;transition:opacity .2s}
.sch .hlbox{fill:transparent;stroke:none}
.sch .part:hover .hlbox{fill:var(--hl2)}
.sch .part.sel .hlbox{fill:var(--hl);stroke:var(--accent);stroke-width:1.6}
.sch.focus .part:not(.sel){opacity:.28}

/* idea */
.idea{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.card h3{margin:0;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--line2);color:var(--ink2)}
.agreed{margin:0}
.agreed div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2)}
.agreed div:last-child{border-bottom:0}
.agreed dt{font-weight:600;font-size:13px}
.agreed dd{margin:0;font-size:13px;color:var(--ink2)}
.agreed small{display:block;color:var(--dim);font-size:11.5px}
.reqs{list-style:none;margin:0;padding:8px 14px 6px;display:grid;gap:6px;font-size:13px}
.reqs li{display:flex;gap:8px;align-items:baseline}
.reqs .ic{font-weight:700;width:14px;flex:none}
svg.blocks{display:block;width:100%;height:auto}
.blocks rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.4}

table.libt,table.srct{border-collapse:collapse;width:100%;font-size:13px}
table.libt{min-width:740px} table.srct{min-width:780px}
.libt td,.srct td{padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}

const D30_NEW = {mpn:'PESD5V0S1BL', mfr:'Nexperia', pkg:'SOD-882', lib:'ok', libSrc:'Ultra Librarian', parts:[1,1,1], ds:'pesd', val:'TVS 5V', sup:{LCSC:[48200,0.045], Mouser:[31000,0.21], DigiKey:[52000,0.19]}};

const lineByKey = k => LINES.find(l => l.key === k);
const lineOfRef = r => LINES.find(l => l.refs.includes(r));
const qty = l => (l.dnp || l.nobuy) ? 0 : l.refs.length;
function best(l){
  if(!l.sup) return null;
  let b = null;
  for(const s of SUPS){ const v = l.sup[s]; if(!v) continue; const [st, p] = v;
    if(p != null && st > 0 && st >= qty(l) && (!b || p < b.price)) b = {s, stock:st, price:p}; }
  return b;
}
function status(l){
  if(l.nobuy || l.dnp) return 'na';
  if(!l.sup) return 'pend';
  if(!best(l)) return 'bad';
  if(l.lib === 'review' || l.lib === 'missing') return 'warn';
  return 'ok';
}
const money = p => p == null ? '—' : '$' + (p < 0.01 ? p.toFixed(4) : p < 1 ? p.toFixed(3) : p.toFixed(2));
const num = n => n.toLocaleString('en-US');
const LIBTXT = {std:'Altium default', ok:'In library · verified', review:'In library · to review', missing:'Missing'};
function totals(){
  let parts = 0, cost = 0, bad = 0, review = 0, buy = 0, inStock = 0;
  for(const l of LINES){ parts += qty(l); const b = best(l);
    if(qty(l)){ buy++; if(b){ inStock++; cost += b.price * qty(l); } }
    if(status(l) === 'bad') bad++; if(l.lib === 'review') review++; }
  return {lines:LINES.length, parts, cost, bad, review, buy, inStock};
}
const libCount = () => LINES.filter(l => l.lib === 'ok' || l.lib === 'review').length;

/* ---------- schematic: rendered from a netlist-like description ---------- */
const NETS = {}, PARTSEC = {};
const CW = 5.9;
let curSec = 'A';
const T = (x,y,s,c='',a='start') => `<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${esc(s)}</text>`;
const L = (x1,y1,x2,y2,c='w') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const addNet = (ref, n) => { if(n && n !== 'NC') (NETS[ref] ||= new Set()).add(n); };
const part = (ref, s) => { PARTSEC[ref] = curSec; return `<g class="part" data-ref="${ref}">${s}</g>`; };
function gndDown(x,y){ return L(x,y,x,y+6)+L(x-9,y+6,x+9,y+6,'g')+L(x-6,y+10,x+6,y+10,'g')+L(x-3,y+14,x+3,y+14,'g')+T(x,y+24,'GND','gt','middle'); }
function gndSide(x,y,dir){ return L(x,y-8,x,y+8,'g')+L(x+dir*4,y-5,x+dir*4,y+5,'g')+L(x+dir*8,y-2,x+dir*8,y+2,'g')+T(x+dir*12,y+3,'GND','gt',dir<0?'end':'start'); }
function netEnd(x,y,net,dir,ref){
  addNet(ref, net);
  if(net === 'NC') return L(x-4,y-4,x+4,y+4,'nc')+L(x-4,y+4,x+4,y-4,'nc')+T(x+dir*8,y+3,'No ERC','nct',dir<0?'end':'start');
  if(net === 'GND') return gndSide(x,y,dir);
  if(net.startsWith('+')){ const g = net === '+3V3'; return L(x,y-7,x,y+7,g?'pb3':'pb')+T(x+dir*5,y+4,net,g?'pwr3':'pwr',dir<0?'end':'start'); }
  const tw = net.length * CW + 4;
  return L(x,y,x+dir*tw,y)+T(x+dir*2,y-3,net,'net',dir<0?'end':'start');
}
function netTop(x,y,net,ref){
  addNet(ref, net);
  if(net.startsWith('+')){ const g = net === '+3V3'; return L(x-9,y,x+9,y,g?'pb3':'pb')+T(x,y-6,net,g?'pwr3':'pwr','middle'); }
  const w = net.length * CW + 10;
  return `<rect x="${x-w/2}" y="${y-16}" width="${w}" height="15" rx="3" class="nbox"/>`+T(x,y-5,net,'net','middle')+L(x,y-1,x,y);
}
function ic(ref,sub,x,y,w,left,right,pitch=26){
  const n = Math.max(left.length, right.length), h = n*pitch + 12;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="body"/>`+T(x,y-8,ref,'refd')+T(x,y+h+14,sub,'mpn');
  left.forEach((p,i)=>{ const py = y + pitch*i + pitch/2 + 6;
    s += L(x-30,py,x,py,'pin')+T(x-4,py-3,p[1],'pnum','end')+T(x+5,py+3.5,p[0],'pname')+netEnd(x-30,py,p[2],-1,ref); });
  right.forEach((p,i)=>{ const py = y + pitch*i + pitch/2 + 6;
    s += L(x+w,py,x+w+30,py,'pin')+T(x+w+4,py-3,p[1],'pnum')+T(x+w-5,py+3.5,p[0],'pname','end')+netEnd(x+w+30,py,p[2],1,ref); });
  return part(ref, s);
}
function zig(x,y,horiz){
  const pts = [[0,0]]; for(let i=0;i<6;i++) pts.push([3+i*6, i%2 ? 5 : -5]); pts.push([36,0]);
  return `<polyline class="w" points="${pts.map(([a,b]) => horiz ? `${x+a},${y+b}` : `${x+b},${y+a}`).join(' ')}"/>`;
}
function resH(ref,val,x,y,nl,nr,lw=0,rw=0){
  let s = zig(x,y,true)+T(x+18,y-10,`${ref} ${val}`,'refs','middle');
  if(nl){ s += lw ? L(x-lw,y,x,y) : ''; s += netEnd(x-lw,y,nl,-1,ref); }
  if(nr){ s += rw ? L(x+36,y,x+36+rw,y) : ''; s += netEnd(x+36+rw,y,nr,1,ref); }
  return part(ref, s);
}
function capV(ref,val,x,y,top,o={}){
  let s = '';
  if(top) s += netTop(x,y,top,ref);
  s += L(x,y,x,y+30)+L(x-11,y+30,x+11,y+30)+L(x-11,y+36,x+11,y+36)+L(x,y+36,x,y+60)+gndDown(x,y+60);
  s += T(x-16,y+31,ref,'refs','end')+T(x-16,y+43,val,'refs','end');
  if(o.pol) s += T(x+10,y+27,'+','pwr');
  addNet(ref,'GND');
  return part(ref, o.dnp ? `<g class="dnp">${s}</g>` : s);
}
function tvs(ref,mpn,x,y,top){
  const s = netTop(x,y,top,ref)+L(x,y,x,y+26)+L(x-9,y+26,x+9,y+26)+L(x-9,y+26,x-12,y+22)+L(x+9,y+26,x+12,y+30)
    +`<polygon points="${x-8},${y+40} ${x+8},${y+40} ${x},${y+27}" class="w"/>`+L(x,y+40,x,y+60)+gndDown(x,y+60)
    +T(x+14,y+31,ref,'refs')+T(x+14,y+43,mpn,'mpn');
  addNet(ref,'GND');
  return part(ref, s);
}
function tp(ref,x,y,net){
  let s = `<circle cx="${x}" cy="${y}" r="5.5" class="tpc"/>`+T(x+10,y-2,ref,'refd');
  if(net === 'GND') s += L(x,y+5.5,x,y+14)+gndDown(x,y+14);

function detailHTML(){
  const l = lineByKey(sel); if(!l) return '';
  const b = best(l);
  const nets = [...new Set(l.refs.flatMap(r => [...(NETS[r] || [])]))];
  const mk = v => v ? '<b class="y">✓</b>' : '<b class="nn">✗</b>';
  return `<div class="dt">
    <div class="dt-h"><div><div class="refs">${esc(l.refs.join(', '))}</div><h3>${esc(l.mpn)}</h3><p>${esc(l.mfr)} · ${esc(l.pkg)} · ${esc(l.desc)}</p></div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="dt-a"><button class="btn pri" data-chat="${l.key}">Discuss this part</button><button class="btn" data-show="${l.key}">Show on schematic</button></div>
    <div class="dsec"><h4>Where it's used</h4><div class="where">${l.refs.map(r => `<button data-show="${l.key}"><span class="r">${r}</span><span class="s">Sheet 03 · ${PARTSEC[r]} · ${SECTIONS[PARTSEC[r]]}</span></button>`).join('')}</div></div>
    ${nets.length ? `<div class="dsec"><h4>Nets</h4><div class="netl">${nets.map(n => `<span>${esc(n)}</span>`).join('')}</div></div>` : ''}
    ${qty(l) ? `<div class="dsec"><h4>Stock and price</h4><table class="sup"><thead><tr><th>Supplier</th><th style="text-align:right">Stock</th><th style="text-align:right">Unit @10</th></tr></thead><tbody>
      ${SUPS.map(s => { const v = l.sup[s] || [0,null]; return `<tr class="${b && b.s === s ? 'best' : ''}"><td>${s}</td><td class="n">${num(v[0])}</td><td class="n">${money(v[1])}</td></tr>`; }).join('')}
      </tbody></table><div class="checked">Checked ${CHECKED}${b ? ` · cheapest: ${b.s}` : ' · no supplier has stock'}</div></div>` : ''}
    <div class="dsec"><h4>Library</h4>${l.lib === 'std' ? `<div class="dnote">Standard part from Altium's default libraries.</div>` :
      `<div class="libg"><div>Symbol${mk(l.parts[0])}</div><div>Footprint${mk(l.parts[1])}</div><div>3D${l.parts[2] ? '<b class="y">STEP</b>' : '<b class="q">Simple</b>'}</div></div>
       <div class="checked">Model from ${esc(l.libSrc)} · <span class="lib ${l.lib}">${LIBTXT[l.lib]}</span></div>`}</div>

function renderCenter(){
  $('#whead').innerHTML = wheadHTML();
  const v = $('#view');
  v.innerHTML = page === 'workspace' ? (tab === 'bom' ? bomHTML() : tab === 'sch' ? schHTML() : ideaHTML())
    : page === 'library' ? libHTML() : page === 'sources' ? sourcesHTML() : page === 'skills' ? skillsHTML()
    : `<div class="vhead"><div><h2>Settings</h2><p>Not part of this mock.</p></div></div>`;
  if(page === 'workspace' && tab === 'sch'){ hlDone = false; requestAnimationFrame(() => { ensureHL(); applyFocus(); }); }
  if(page === 'sources' && hitSrc){ const r = document.getElementById('src-' + hitSrc); if(r) r.scrollIntoView({block:'center'}); hitSrc = null; }
  LINES.forEach(l => delete l.flash);
  renderDetail();
}
function renderDetail(){
  const d = $('#detail');
  const show = !!sel && ((page === 'workspace' && (tab === 'bom' || tab === 'sch')) || page === 'library');
  d.hidden = !show;
  d.innerHTML = show ? detailHTML() : '';
}
function go(p, t){ page = p; if(t) tab = t; renderNav(); renderCenter(); setView('work'); }
function select(key, goSch){
  sel = key;
  if(goSch) { go('workspace','sch'); return; }
  if(!(page === 'workspace' && (tab === 'bom' || tab === 'sch')) && page !== 'library'){ go('workspace','bom'); return; }
  document.querySelectorAll('#view tr[data-key]').forEach(tr => tr.classList.toggle('sel', tr.dataset.key === key));
  applyFocus(); renderDetail(); setView('work');
}
function setView(v){
  if(!matchMedia('(max-width:860px)').matches) return;
  $('#app').dataset.view = v;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }

function approve(){
  Object.assign(lineByKey('D30'), D30_NEW, {flash:true, note:''});
  diffState = 'ok';
  SCH = buildSchematic();
  threads.main.msgs.push({k:'agent', html:`<p>Updated. <button class="ref" data-ref="D30">D30</button> is now PESD5V0S1BL in the BOM, on the schematic label and in the library.</p>`});
  renderChat(); renderNav(); renderCenter();
  toast('D30 updated in the BOM, schematic and library');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('button, tr[data-key], g.part, g[data-tab]');
  if(!el) return;
  if(el.matches('g.part')){ const l = lineOfRef(el.dataset.ref); if(l) select(l.key); return; }
  if(el.matches('tr[data-key]')){ if(e.target.closest('input,button')) { if(!e.target.closest('button')) return; } else { select(el.dataset.key); return; } }
  const d = el.dataset;
  if(d.thread){ cur = d.thread; convsOpen = false; renderChat(); setView('chat'); return; }
  if(d.tab){ go('workspace', d.tab); return; }
  if(d.page){ go(d.page); return; }
  if(d.view){ setView(d.view); return; }
  if(d.src){ hitSrc = d.src; go('sources'); return; }
  if(d.ref){ const l = lineOfRef(d.ref); if(l) select(l.key); return; }
  if(d.show){ select(d.show, true); return; }
  if(d.chat){ openThread(d.chat); return; }
  if(d.say){ cur = 'main'; send(d.say); setView('chat'); return; }
  switch(d.act){
    case 'approve': approve(); return;
    case 'reject': diffState = 'no'; renderChat(); return;
    case 'close': sel = null; renderDetail(); document.querySelectorAll('#view tr.sel').forEach(r => r.classList.remove('sel')); applyFocus(); return;
    case 'export': toast(totals().review ? 'No download in the mock. Note: D31 is still unverified' : 'No download in the mock. The real one writes LTE_Tracker.IntLib'); return;
    case 'convs': convsOpen = !convsOpen; renderConvs(); return;
    case 'new': { const id = 'new' + order.length; threads[id] = {title:'New conversation', when:'now', msgs:[]}; order.unshift(id); cur = id; convsOpen = false; renderChat(); return; }
    case 'add-src': toast('Not in the mock. A new file lands in the project sources with its sidecar'); return;
    case 'other-proj': toast('Only LTE Tracker is filled in this mock'); return;
  }
  if(el.classList.contains('sug')){ send(el.textContent); return; }
});
document.addEventListener('change', e => {
  const i = e.target.closest('input[data-edit]'); if(!i) return;
  const l = lineByKey(i.closest('tr').dataset.key);
  if(i.dataset.edit === 'note'){ l.note = i.value; renderDetail(); toast('Note saved'); return; }
  if(i.value.trim() && i.value !== l.mpn){
    l.mpn = i.value.trim(); l.sup = null; l.mfr = '—';
    renderNav(); renderCenter();
    toast(`MPN updated. The agent will check stock for ${l.mpn}`);
  }
});
$('#form').addEventListener('submit', e => { e.preventDefault(); const i = $('#input'); send(i.value); i.value = ''; });
$('#input').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#form').requestSubmit(); } });

seed(); renderNav(); renderChat(); renderCenter();
</script>
