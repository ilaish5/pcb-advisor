<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<script src="/ui/js/theme-boot.js"></script>
<script src="/ui/diagram.js"></script>
<link rel="stylesheet" href="/ui/styles/base.css">
<link rel="stylesheet" href="/ui/styles/core.css">
<link rel="stylesheet" href="/ui/styles/shell.css">
<link rel="stylesheet" href="/ui/styles/chat.css">
<link rel="stylesheet" href="/ui/styles/bom.css">
<link rel="stylesheet" href="/ui/styles/previews.css">
<link rel="stylesheet" href="/ui/styles/inspector.css">
<link rel="stylesheet" href="/ui/styles/idea.css">
<link rel="stylesheet" href="/ui/styles/rules.css">
<link rel="stylesheet" href="/ui/styles/checks.css">
<link rel="stylesheet" href="/ui/styles/outputs.css">
<link rel="stylesheet" href="/ui/styles/pages.css">
<link rel="stylesheet" href="/ui/styles/viewer.css">
</head>
<body>
<div class="app" id="app" data-view="work">
  <!-- LEFT: project, stages, pages -->
  <nav class="nav" aria-label="Navigation" id="nav"></nav>

  <!-- CENTRE: the main sheet and, when asked for, a side sheet -->
  <div class="panes" id="panes">
    <main class="pane work" id="work" aria-label="Workspace">
      <div class="view" id="view"></div>
      <aside class="detail" id="detail" hidden></aside>
    </main>
    <section class="pane side" id="side" aria-label="Side sheet" hidden>
      <header class="side-h" id="side-h"></header>
      <div class="view" id="view-side"></div>
    </section>
  </div>

  <div class="splitter" id="splitter-chat" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize the chat. Double-click to reset" aria-label="Resize chat"></div>

  <!-- RIGHT: chat -->
  <section class="chat" aria-label="Chat with the agent">
    <header class="chat-h">
      <button type="button" class="chat-title" data-act="convs" aria-expanded="false" aria-haspopup="true" aria-controls="convs" title="Conversations"><span id="convtitle">Conversation</span><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button type="button" class="btn icon" data-act="new" title="New chat" aria-label="New chat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="btn icon" data-act="toggle-chat" title="Hide chat" aria-label="Hide chat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    </header>
    <div class="convs" id="convs" hidden></div>
    <div class="msgs" id="msgs" role="region" aria-label="Conversation" tabindex="0"></div>
    <div class="sr" id="chat-live" aria-live="polite" aria-atomic="true"></div>
    <div class="composer">
      <div class="sugs" id="sugs"></div>
      <form class="box" id="form">
        <textarea id="input" rows="1" dir="auto" placeholder="Ask about this board" aria-label="Message"></textarea>
        <div class="box-row">
          <span class="chat-chip" id="chat-chip" hidden></span>
          <button type="submit" class="send" id="sendbtn" title="Send" aria-label="Send" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </form>
      <div class="chat-status" id="chat-status" role="status"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="filepick" hidden>
<input type="file" id="dfmpick" accept=".pdf" hidden>

<script src="/ui/js/kit.js"></script>
<script src="/ui/js/core.js"></script>
<script src="/ui/js/shell.js"></script>
<script src="/ui/js/chat.js"></script>
<script src="/ui/js/views/idea.js"></script>
<script src="/ui/js/views/bom.js"></script>
<script src="/ui/js/views/previews.js"></script>
<script src="/ui/js/views/inspector.js"></script>
<script src="/ui/js/views/rules.js"></script>
<script src="/ui/js/views/checks.js"></script>
<script src="/ui/js/views/outputs.js"></script>
<script src="/ui/js/views/pages.js"></script>
<script src="/ui/js/markdown.js"></script>
<script src="/ui/js/viewer.js"></script>
<script src="/ui/js/palette.js"></script>
<script src="/ui/js/boot.js"></script>

</body>
</html>
