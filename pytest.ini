[pytest]
testpaths = tests
addopts = -q
markers =
    slow: a long run (a full board route, a minute or more); runs by default, deselect with -m "not slow"
    windows: needs Windows itself (a Windows API, cmd/.bat, the registry); skipped where os.name != "nt"
    altium: needs a live Altium Designer (X2.EXE answering the bridge); skipped unless PCB_ADVISOR_ALTIUM=1
    route_gate: reads the real board gate (store.route_state) instead of the routed, clean board every other test stands on
