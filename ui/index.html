<!doctype html>
<meta charset="utf-8">
<title>PCB Advisor</title>
<link rel="icon" href="data:,">

<script>
/* Runs before the first paint, so the page never flashes the wrong theme while
   /api/config is still in flight. The server's answer is the truth; this is the
   last answer it gave, cached. Private windows throw on localStorage - a theme
   is not worth a blank page, so failure just means "auto". */
(function(){
  try{
    var t=localStorage.getItem('pcbadv.theme');
    if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>

<style>
/* ---------- colour, in one place ----------
   Three modes. `auto` sets no data-theme at all and lets the media query below
   decide, so the OS is followed even with JS disabled; `light` and `dark` pin
   the attribute. Every colour in this file is a token - a literal here is a
   colour that cannot follow the theme. */
:root{
  /* tells the browser to render its own bits - spinners, scrollbars, the caret -
     in dark, instead of dropping a white control into a dark page */
  color-scheme: dark;
  --bg:#0f1117; --panel:#12151e; --card:#191d29; --menu:#161b28; --pop:#1b2030;
  --field:#0f1320; --lk:#1a1d28;
  --line:#282e3d; --line2:#1e2331; --edge:#33405c; --edge2:#3d4a68; --rule:#2b3550;
  --ink:#e9ebf1; --ink2:#cfd4e0; --dim:#8d95a8; --mute:#6b7488;
  --hover:#1a2030; --hover2:#222a3b; --sel:#22293a;
  --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --on-accent:#fff; --ring:#3b82f633;
  --you:#1b2a3d; --you-line:#24405c;
  --blk-line:#39435c; --wire:#5a6480; --wire-hot:#ef444455;
  --conflict-bg:#2a1518; --danger-ink:#fca5a5; --cost:#e59a9a;
  --warn-bg:#4a3a12; --warn-line:#4a3a12; --warn-edge:#6a5a2a; --warn-ink:#e0c169;
  --shadow:#0009; --shadow-menu:rgba(0,0,0,.55);
}

/* The light palette is written twice on purpose: once for an explicit choice and
   once for the media query. A shared class would need JS to attach it, and the
   whole point of the media query is to work before any JS has run. */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f6fa; --panel:#e9ecf3; --card:#fff; --menu:#fff; --pop:#fff;
  --field:#fff; --lk:#f3f5fa;
  --line:#c8cfdd; --line2:#e5e9f0; --edge:#b0bacd; --edge2:#9aa5be; --rule:#c3cbdb;
  --ink:#151922; --ink2:#333b4b; --dim:#556074; --mute:#5f6a7e;
  --hover:#e4e8f2; --hover2:#eaeef8; --sel:#dbe4f8;
  --accent:#1d4ed8; --ok:#15803d; --warn:#8a5a00; --bad:#c62828;
  --on-accent:#fff; --ring:#1d4ed833;
  --you:#dbeafe; --you-line:#8fbaf5;
  --blk-line:#8e9ab4; --wire:#68738c; --wire-hot:#ef444488;
  --conflict-bg:#fdeaea; --danger-ink:#9b1c1c; --cost:#9b2c2c;
  --warn-bg:#f7e7bd; --warn-line:#c99f42; --warn-edge:#c39b3e; --warn-ink:#6b4e0a;
  --shadow:#0f172a26; --shadow-menu:rgba(15,23,42,.16);
}

/* `auto`: no data-theme attribute, so this only ever applies to someone who has
   not chosen. An explicit choice sets the attribute and wins by not matching. */
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    color-scheme: light;
    --bg:#f4f6fa; --panel:#e9ecf3; --card:#fff; --menu:#fff; --pop:#fff;
    --field:#fff; --lk:#f3f5fa;
    --line:#c8cfdd; --line2:#e5e9f0; --edge:#b0bacd; --edge2:#9aa5be; --rule:#c3cbdb;
    --ink:#151922; --ink2:#333b4b; --dim:#556074; --mute:#5f6a7e;
    --hover:#e4e8f2; --hover2:#eaeef8; --sel:#dbe4f8;
    --accent:#1d4ed8; --ok:#15803d; --warn:#8a5a00; --bad:#c62828;
    --on-accent:#fff; --ring:#1d4ed833;
    --you:#dbeafe; --you-line:#8fbaf5;
    --blk-line:#8e9ab4; --wire:#68738c; --wire-hot:#ef444488;
    --conflict-bg:#fdeaea; --danger-ink:#9b1c1c; --cost:#9b2c2c;
    --warn-bg:#f7e7bd; --warn-line:#c99f42; --warn-edge:#c39b3e; --warn-ink:#6b4e0a;
    --shadow:#0f172a26; --shadow-menu:rgba(15,23,42,.16);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
     font:14px/1.6 -apple-system,"Segoe UI",Inter,Arial,sans-serif;
     display:flex;overflow:hidden}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font:inherit;font-size:13px;padding:6px 9px;
  -webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* a checkbox we control, instead of the OS one */
input[type=checkbox]{width:17px;height:17px;border-radius:5px;cursor:pointer;
  position:relative;flex:none;padding:0}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;
  width:4px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(43deg)}

/* ---------- dropdowns: ours, so the popup matches the app ---------- */
.dd{position:relative;flex:1;min-width:0}
.dd-t{width:100%;display:flex;align-items:center;gap:7px;text-align:left}
.dd-t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-t i{font-style:normal;color:var(--dim);font-size:10px;transform:translateY(1px)}
.dd.open .dd-t{border-color:var(--accent)}
.dd-m{display:none;position:absolute;z-index:40;top:calc(100% + 5px);left:0;min-width:100%;
  width:max-content;max-width:300px;max-height:290px;overflow-y:auto;background:var(--menu);border:1px solid var(--edge);
  border-radius:10px;padding:5px;box-shadow:0 14px 34px var(--shadow-menu)}
.dd.open .dd-m{display:block}
.dd-m.right{left:auto;right:0}
.dd-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;
  background:transparent;border-radius:7px;padding:7px 9px;font-size:13px;white-space:nowrap}
.dd-i:hover{background:var(--hover2)}
.dd-i.on{background:var(--sel);color:var(--ink)}
.dd-i b{flex:none;font-weight:400}
.dd-i em{font-style:normal;color:var(--mute);font-size:11px;margin-left:auto;
  overflow:hidden;text-overflow:ellipsis}
.dd-i .tick{color:var(--accent);font-size:11px;visibility:hidden}
.dd-i.on .tick{visibility:visible}

/* ---------- three columns: nav | design | conversation ---------- */
.side{width:300px;min-width:210px;flex:none;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.mid{flex:1;min-width:280px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel)}
.chat{width:430px;min-width:300px;flex:none;border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.split{width:5px;flex:none;cursor:col-resize;background:transparent}
.split:hover,.split.on{background:var(--accent)}

.brand{font-weight:600;padding:13px 16px 11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;font-size:14.5px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.picker{padding:10px 12px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:7px}
.picker .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.picker .row{display:flex;gap:6px}

.picker button{padding:6px 9px;font-size:12px}
.snav{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.snav button{padding:5px 10px;font-size:12.5px;border-color:transparent;background:transparent;
  color:var(--dim)}
.snav button:hover{color:var(--ink);background:var(--hover);border-color:transparent}
.snav button.on{background:var(--sel);border-color:var(--edge2);color:var(--ink)}
.snav .badge{background:var(--warn-bg);color:var(--warn);border-radius:99px;
  font-size:10px;padding:0 5px;margin-left:5px}
.sbody{flex:1;overflow-y:auto;padding:12px 13px}
.sfoot{border-top:1px solid var(--line);padding:8px 13px;font-size:11.5px;color:var(--mute);
  display:flex;gap:8px;align-items:center}

/* ---------- the diagram: real DOM, so it is legible and editable ---------- */
.diagram{flex:1;background:var(--panel);display:flex;flex-direction:column;
  min-height:0;position:relative}
/* dragging must not select the text underneath */
body.nosel{user-select:none;-webkit-user-select:none}
.zoom{display:flex;align-items:center;gap:2px;margin-inline-start:6px}
.zoom button{padding:4px 9px;font-size:13px;line-height:1}
.zoom .pct{color:var(--dim);font-size:11.5px;width:42px;text-align:center}
.dbar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--dim)}
.dbar .sp{flex:1}
.dbar button{padding:5px 10px;font-size:12px}
.dbar button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.canvas{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.canvas.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.blk{position:absolute;width:158px;min-height:64px;background:var(--card);
  border:1.5px solid var(--blk-line);border-radius:10px;padding:9px 11px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  font-size:13px;line-height:1.35;z-index:2}
.blk:hover{border-color:var(--accent)}
.blk.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.blk.linking{border-color:var(--ok);border-style:dashed}
.blk .kind{font-size:10px;color:var(--dim)}
.wires{position:absolute;inset:0;z-index:1;overflow:visible}
.wires path{stroke:var(--wire);fill:none}
.wires path.hit{stroke:transparent;stroke-width:14;cursor:pointer;fill:none}
.wires path.hit:hover{stroke:var(--wire-hot)}
.pop{position:absolute;z-index:20;background:var(--pop);border:1px solid var(--edge2);
  border-radius:10px;padding:12px;width:250px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 12px 32px var(--shadow)}
.pop input,.pop select{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;color:var(--ink);font:inherit;font-size:13px}
.pop .row{display:flex;gap:7px}
.pop .dd{width:100%}
.pop .row button{flex:1;font-size:12px}
.danger{color:var(--danger-ink)}
.hintbar{font-size:11.5px;color:var(--dim);padding:0 14px 8px}

/* ---------- the conversation ---------- */
.chead{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:9px;font-size:12.5px;color:var(--dim)}
.chead .sp{flex:1}
.log{flex:1;overflow-y:auto;padding:18px 0}
.wrap{max-width:100%;margin:0 auto;padding:0 16px;
      display:flex;flex-direction:column;gap:15px}
.msg{display:flex;flex-direction:column;gap:5px}
.who{font-size:11px;color:var(--dim)}
.bubble{border-radius:12px;padding:12px 15px;font-size:14px}
.you .bubble{background:var(--you);border:1px solid var(--you-line);align-self:flex-end;max-width:80%}
.you{align-items:flex-end}
.advisor .bubble{background:var(--card);border:1px solid var(--line)}

/* a decision, shown inline in the timeline */
.dec{border-left:2px solid var(--ok);padding:2px 0 2px 14px}
.dec .head{font-size:13.5px}
.dec .head b{color:var(--ok);font-weight:600}
.locked{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.lk{background:var(--lk);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;font-size:13px;color:var(--ink2)}
.lk .tag{color:var(--dim);font-size:11px;margin-right:6px}

/* the live question, with its answers right there */
.ask{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:16px}
.ask .q{font-size:15.5px;font-weight:600;margin-bottom:5px}
.ask .why{color:var(--dim);font-size:13px;margin-bottom:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 13px;font-size:14px;width:100%}
.opt .cost{color:var(--cost);font-size:12px;margin-top:3px}
.opt .note-opt{color:var(--dim);font-size:12px;margin-top:3px}
.opt .adds{color:var(--mute);font-size:11.5px;margin-top:4px}
.empty{color:var(--dim);text-align:center;padding:36px 14px;font-size:13px;line-height:1.7}

/* ---------- input ---------- */
.compose{border-top:1px solid var(--line);padding:12px 0}
.askchip{display:flex;align-items:center;gap:7px;margin:0 16px 9px;font-size:12px;
  color:var(--dim);background:var(--field);border:1px solid var(--edge);
  border-radius:99px;padding:4px 6px 4px 12px;width:fit-content}
.askchip b{color:var(--ink);font-weight:600}
.askchip button{padding:0 6px;border:0;background:transparent;color:var(--dim);font-size:13px}
.thinking{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;
  padding:2px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.about{font-size:11px;color:var(--dim);margin-bottom:3px}
.compose .wrap{flex-direction:row;gap:9px;align-items:flex-end}
textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;color:var(--ink);font:inherit;resize:none;height:48px}
.send{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:11px 20px}

/* ---------- settings, in the left rail like an IDE ---------- */
.set h4{margin:16px 0 7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);font-weight:600}
.set h4:first-child{margin-top:0}
.set label{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.set label span{flex:1;color:var(--dim)}
.set label input{width:116px;flex:none;font-size:12.5px;padding:5px 8px}
.set label .dd{width:116px;flex:none}
.set label .dd-t{font-size:12.5px;padding:5px 8px}
.set label input[type=checkbox]{width:17px}
.set .note{color:var(--mute);font-size:11px;line-height:1.5;margin:5px 0 0}
.thr{margin-top:8px;border-left:2px solid var(--rule);padding-left:9px}
.thr .m{margin:5px 0;font-size:12.5px;line-height:1.5}
.thr .m b{color:var(--dim);font-weight:600;margin-right:5px}
.thr .row{display:flex;gap:6px;margin-top:7px}
.thr input{flex:1;background:var(--field);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
.ask-badge{cursor:pointer;border:1px solid var(--line);background:var(--hover);border-radius:999px;
  padding:1px 8px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.ask-badge.wait{border-color:var(--warn-edge);color:var(--warn-ink)}
.ask-badge.done{opacity:.55}

/* cards, not tables: the rail is narrow and a two-column table clips */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;margin-bottom:9px;font-size:12.5px;line-height:1.55}
.card .q{color:var(--dim);font-size:12px;margin-bottom:3px}
.card .a{font-weight:600;font-size:13px}
.card .foot{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:500;font-size:10.5px;letter-spacing:.07em;
   text-transform:uppercase;padding:5px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.quote{color:var(--dim);font-size:12px;margin-top:5px;font-style:italic}
.meta{color:var(--mute);font-size:11px;margin-top:4px}
.pill{font-size:10.5px;border:1px solid var(--line);border-radius:99px;
      padding:1px 7px;color:var(--dim);white-space:nowrap}
.pill.u{color:var(--warn);border-color:var(--warn-line)}
a{color:var(--accent);text-decoration:none}
.conflict{background:var(--conflict-bg);border-left:3px solid var(--bad);border-radius:8px;
          padding:11px 13px;margin-bottom:12px;font-size:13px}
.conflict b{color:var(--danger-ink)}
.srcrow{display:flex;gap:10px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.srcrow .g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:8px;margin-top:10px}
input[type=text]{flex:1;padding:8px 11px}
</style>

<aside class="side" id="side">
  <div class="brand"><span class="dot"></span>PCB Advisor</div>

  <div class="picker">
    <span class="lab">Board</span>
    <div class="row">
      <span id="projsel"></span>
      <button onclick="newProject()" title="a new board">+</button>
    </div>
    <span class="lab" id="sesslab">Conversation</span>
    <div class="row" id="sessrow">
      <span id="sesssel"></span>
      <button onclick="newSession()" title="a clean conversation about this board">+</button>
    </div>
  </div>

  <nav class="snav">
    <button id="t-decisions" onclick="showPanel('decisions')">Decisions</button>
    <button id="t-constraints" onclick="showPanel('constraints')">Constraints</button>
    <button id="t-sources" onclick="showPanel('sources')">Sources</button>
    <button id="t-memory" onclick="showPanel('memory')">Memory</button>
    <button id="t-settings" onclick="showPanel('settings')">Settings</button>
  </nav>

  <div class="sbody" id="sbody"></div>
  <div class="sfoot"><span id="foot"></span></div>
</aside>

<div class="split" id="splitL" title="drag to resize"></div>

<main class="mid">
  <div class="diagram" id="diagram">
    <div class="dbar">
      <span id="dtitle">Diagram</span>
      <span class="sp"></span>
      <button onclick="addBlock()">+ Block</button>
      <span class="zoom">
        <button onclick="zoomBy(1/1.2)" title="zoom out">−</button>
        <span class="pct" id="zpct">100%</span>
        <button onclick="zoomBy(1.2)" title="zoom in">+</button>
        <button onclick="fit(true)" title="fit and centre">Fit</button>
      </span>
      <button class="go" id="sendsketch" style="display:none" onclick="sendSketch()">
        Send changes to advisor</button>
    </div>
    <div class="canvas" id="canvas"><div class="stage" id="stage"></div></div>
    <div class="hintbar" id="dhint"></div>
  </div>
</main>

<div class="split" id="splitR" title="drag to resize"></div>

<section class="chat">
  <div class="chead">
    <span id="stat"></span>
    <span class="sp"></span>
    <span id="engine"></span>
  </div>
  <div class="log" id="log"><div class="wrap" id="wrap"></div></div>
  <div class="compose">
    <div class="askchip" id="askchip" style="display:none"></div>
    <div class="wrap">
    <textarea id="say" dir="auto" placeholder="Describe what you want to design…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button class="send" id="sendbtn" onclick="send()">Send</button>
  </div></div>
</section>

<script>
let S=null, busy=false, TAB='decisions';
let CFG=null;
// no project in the URL means "whatever config calls the default" - boot() fills it in
let PROJ=new URLSearchParams(location.search).get('project')||'';
let SESS=new URLSearchParams(location.search).get('session')||'';
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEB=/[\u0590-\u05FF]/;
// A flow arrow between two Hebrew words has to point the other way. Only flip
// when Hebrew sits on BOTH sides, so "Vin -> SW -> L" is left alone.
const flow=s=>(s||'')
  .replace(/([\u0590-\u05FF][^\S\n]*)→([^\S\n]*[\u0590-\u05FF])/g,'$1←$2')
  .replace(/([\u0590-\u05FF][^\S\n]*)->([^\S\n]*[\u0590-\u05FF])/g,'$1<-$2');
// dir=auto lets the browser pick paragraph direction from the first strong character
const bi=s=>HEB.test(s)?'rtl':'auto';
const txt=s=>esc(flow(s)).replace(/\n/g,'<br>');
const q=p=>p+(p.includes('?')?'&':'?')+'project='+encodeURIComponent(PROJ)
  +(SESS?'&session='+encodeURIComponent(SESS):'');

/* localStorage is not merely empty in a private window - reading it throws, and
   an uncaught throw up here takes the whole script with it. Nothing kept in it
   (a tab, two pane widths, the theme) is worth a blank page. */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* Our own dropdown. A native <select> renders its popup with the OS chrome,
   which cannot be styled and does not match anything else on the page. */
const DD={};

function ddSet(id, items, value, pick, opts){
  DD[id]={items, value, pick, ...(opts||{})};
  const host=$(id); if(host) host.innerHTML=ddHTML(id);
}

function ddHTML(id){
  const d=DD[id]||{items:[]};
  const cur=d.items.find(x=>String(x.v)===String(d.value));
  return `<div class="dd" id="dd-${id}">
    <button class="dd-t" onclick="ddToggle('${id}',event)">
      <span>${esc(cur?cur.label:(d.placeholder||'—'))}</span><i>▾</i></button>
    <div class="dd-m ${d.right?'right':''}">${d.items.map((x,i)=>
      `<button class="dd-i ${String(x.v)===String(d.value)?'on':''}"
         onclick="ddPick('${id}',${i},event)"><b>${esc(x.label)}</b>${
         x.sub?`<em>${esc(x.sub)}</em>`:''}<span class="tick">✓</span></button>`).join('')}</div></div>`;
}

function ddClose(){ document.querySelectorAll('.dd.open').forEach(e=>e.classList.remove('open')); }

function ddToggle(id,ev){
  ev.stopPropagation();
  const el=$('dd-'+id), was=el.classList.contains('open');
  ddClose(); if(!was) el.classList.add('open');
}

function ddPick(id,i,ev){
  ev.stopPropagation(); ddClose();
  const d=DD[id], item=d.items[i]; if(!item) return;
  d.value=item.v;
  const host=$(id); if(host) host.innerHTML=ddHTML(id);
  if(d.pick) d.pick(item.v);
}

const ddValue=id=>DD[id]?DD[id].value:undefined;
addEventListener('click', ddClose);
addEventListener('keydown', e=>{ if(e.key==='Escape') ddClose(); });

/* ===================== theme =====================
   Three modes. `light` and `dark` pin data-theme on <html>; `auto` removes it
   and lets the stylesheet's prefers-color-scheme block decide, which is also
   what renders correctly before any of this has run. */
const THEMES=['auto','light','dark'];
const THEME_MQ = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;

// what the pre-paint script already applied, so THEME never disagrees with the DOM
let THEME=(()=>{ const t=lsGet('pcbadv.theme'); return THEMES.includes(t)?t:'auto'; })();

// no matchMedia at all (very old browsers) means we cannot tell: assume dark,
// which is what the stylesheet renders when the media query never matches.
const systemTheme = () => (THEME_MQ && THEME_MQ.matches) ? 'light' : 'dark';

function applyTheme(mode){
  THEME = THEMES.includes(mode) ? mode : 'auto';
  if(THEME==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', THEME);
  // cached so the next load paints the right colours before /api/config answers
  lsSet('pcbadv.theme', THEME);
}

/* A choice that forgets itself on reload is not a choice. The cache alone is
   not enough: boot() takes the server's user.theme as authoritative, so a pick
   that never reached the server is overwritten by the default on the next load. */
async function chooseTheme(mode){
  applyTheme(mode);
  try{
    const r=await (await fetch('/api/config',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({set:{'user.theme':mode}})})).json();
    if(r.config) CFG=r.config;
  }catch(e){ /* the colours are already right; the server can catch up later */ }
}

/* In `auto` the colours follow the OS through the media query, with no JS in the
   path. What JS still owes the student is the label: the Theme menu says which
   way auto currently resolves, and that has to keep up. Patching the one text
   node rather than re-rendering keeps an open menu open and keeps focus put. */
function refreshThemeMenu(){
  const d=DD['s-theme']; if(!d) return;
  const auto=d.items.find(x=>x.v==='auto'); if(!auto) return;
  auto.sub='system · now '+systemTheme();
  const em=document.querySelector('#s-theme .dd-i em');
  if(em) em.textContent=auto.sub;
}

if(THEME_MQ){
  const onScheme=()=>{ if(THEME==='auto') refreshThemeMenu(); };
  if(THEME_MQ.addEventListener) THEME_MQ.addEventListener('change', onScheme);
  else if(THEME_MQ.addListener) THEME_MQ.addListener(onScheme);   // older Safari
}

/* ===================== the diagram ===================== */
const KINDS=['power_in','regulation','mcu','digital','sensor','analog','adc','other'];
const BW=158, BH=76, GX=74, GY=26;
let sketch={blocks:[],links:[],confirmed:false}, dirty=false, linkFrom=null, popFor=null;
let zoom=1, panX=0, panY=0, moved=false, bbox={w:0,h:0}, lastShape='';

function isRTL(s){return HEB.test(s||'');}

function layerOf(blocks,links){
  const ids=blocks.map(b=>b.id), pre={}; ids.forEach(i=>pre[i]=[]);
  links.forEach(([a,b])=>{ if(pre[b]&&a!==b&&ids.includes(a)) pre[b].push(a); });
  const L={}; ids.forEach(i=>L[i]=0);
  for(let k=0;k<=ids.length;k++){ let ch=false;
    ids.forEach(i=>{ const w=Math.max(0,...pre[i].map(p=>L[p]+1)); if(w>L[i]){L[i]=w;ch=true;} });
    if(!ch) break; }
  return L;
}

function applyView(){
  $('stage').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  $('zpct').textContent=Math.round(zoom*100)+'%';
  if(popFor) placePop();
}
function clamp(v,a,b){ if(b<a) b=a; return Math.min(b,Math.max(a,v)); }

function fit(manual){
  const c=$('canvas');
  if(!bbox.w){zoom=1;panX=panY=0;return applyView();}
  const pad=34;
  const k=clamp(Math.min((c.clientWidth-pad*2)/bbox.w,(c.clientHeight-pad*2)/bbox.h),0.3,1.25);
  zoom=k;
  panX=(c.clientWidth-bbox.w*k)/2;          // centred, always
  panY=(c.clientHeight-bbox.h*k)/2;
  if(manual) moved=false;
  applyView();
}
function zoomBy(k){
  const c=$('canvas'), cx=c.clientWidth/2, cy=c.clientHeight/2;
  const nz=clamp(zoom*k,0.3,2.5);
  panX=cx-(cx-panX)*(nz/zoom); panY=cy-(cy-panY)*(nz/zoom);
  zoom=nz; moved=true; applyView();
}

/* wheel zooms about the cursor; dragging empty canvas pans */
(function(){
  const c=$('canvas');
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=c.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
    const nz=clamp(zoom*(e.deltaY<0?1.12:1/1.12),0.3,2.5);
    panX=cx-(cx-panX)*(nz/zoom); panY=cy-(cy-panY)*(nz/zoom);
    zoom=nz; moved=true; applyView();
  },{passive:false});

  let sx=0,sy=0,ox=0,oy=0,down=false,shifted=false;
  c.addEventListener('pointerdown',e=>{
    if(e.target.closest('.blk')||e.target.closest('.pop')) return;
    down=true; shifted=false; sx=e.clientX; sy=e.clientY; ox=panX; oy=panY;
    c.setPointerCapture(e.pointerId); c.classList.add('drag');
    document.body.classList.add('nosel');
  });
  c.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) shifted=true;
    panX=ox+dx; panY=oy+dy; moved=true; applyView();
  });
  const up=()=>{ if(down&&!shifted&&popFor){popFor=null;drawDiagram();} down=false;
                 c.classList.remove('drag'); document.body.classList.remove('nosel'); };
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
})();

/* drag either splitter, IDE style. Widths persist per browser. */
(function(){
  for(const [id, el, key, dir] of [['splitL', 'side', 'pcbadv.wL', 1],
                                   ['splitR', 'chat', 'pcbadv.wR', -1]]){
    const grip=$(id), pane=document.querySelector('.'+ (el==='side'?'side':'chat'));
    const saved=parseInt(lsGet(key)||'0',10);
    if(saved>180) pane.style.width=saved+'px';
    let down=false,sx=0,w0=0;
    grip.addEventListener('pointerdown',e=>{
      down=true; sx=e.clientX; w0=pane.getBoundingClientRect().width;
      grip.setPointerCapture(e.pointerId); grip.classList.add('on');
      document.body.classList.add('nosel');
    });
    grip.addEventListener('pointermove',e=>{
      if(!down) return;
      const vw=document.documentElement.clientWidth||1200;
      pane.style.width=clamp(w0+dir*(e.clientX-sx),200,Math.max(260,vw-480))+'px';
      applyView();
    });
    const up=()=>{ if(down) lsSet(key,
                     Math.round(pane.getBoundingClientRect().width));
                   down=false; grip.classList.remove('on');
                   document.body.classList.remove('nosel'); };
    grip.addEventListener('pointerup',up); grip.addEventListener('pointercancel',up);
  }
  addEventListener('resize', ()=>applyView());
})();

function drawDiagram(){
  const stage=$('stage'), canvas=$('canvas');
  const inSketch = S.stage==='sketch';
  // In cascade stage the sketch is still the spine: keep the student's blocks
  // with their real kind, keep the topology they drew, and chain only what the
  // cascade added on top - otherwise their design vanishes the moment they
  // confirm it.
  const built = (S.blocks||[]).filter(b=>b.from!=='sketch');
  const blocks = inSketch ? (sketch.blocks||[])
                          : (S.blocks||[]).map(b=>({id:b.id, label:b.label,
                              kind:b.kind||'built', from:b.from}));
  const links  = inSketch ? (sketch.links||[])
                          : [...(S.links||[]),
                             ...built.slice(1).map((b,i)=>[built[i].id, b.id])];
  $('dtitle').textContent = inSketch
    ? (sketch.confirmed?'Block diagram — confirmed':'Block diagram — click a block to correct it')
    : `Signal path — ${S.progress.answered} decisions`;
  $('dhint').textContent = inSketch
    ? (linkFrom ? 'Now click the block it feeds into. Esc to cancel.'
                : 'Click a block to rename it, change its kind, link it or delete it. Click an arrow to remove it.')
    : 'This follows from your decisions. Go back to the sketch to change the structure.';
  $('sendsketch').style.display = (inSketch&&dirty)?'':'none';

  if(!blocks.length){
    stage.innerHTML=`<div style="color:var(--dim);width:420px;font-size:13.5px">
      Nothing sketched yet. Describe what you want to build, or press <b>+ Block</b>.</div>`;
    stage.style.width='420px'; stage.style.height='60px';
    bbox={w:420,h:60}; if(!moved) fit(); applyView(); return;
  }

  const rtl = blocks.some(b=>isRTL(b.label));
  const L=layerOf(blocks,links), cols={};
  blocks.forEach(b=>{ (cols[L[b.id]] ||= []).push(b); });
  const nc=Math.max(...Object.keys(cols).map(Number))+1;
  const maxRows=Math.max(...Object.values(cols).map(a=>a.length));
  const pos={};
  Object.entries(cols).forEach(([c,items])=>{
    const col=rtl ? (nc-1-Number(c)) : Number(c);
    const x=col*(BW+GX);
    const span=(items.length-1)*(BH+GY);
    items.forEach((b,i)=>{ pos[b.id]={x, y:(maxRows-1)*(BH+GY)/2 - span/2 + i*(BH+GY)}; });
  });

  const wDiag=(nc-1)*(BW+GX)+BW, hDiag=(maxRows-1)*(BH+GY)+BH;
  const skips=links.filter(([a,b])=>pos[a]&&pos[b]&&Math.abs(L[b]-L[a])>1).length;
  const laneH=skips*22+(skips?18:0);

  let wires='', hits='';
  let lane=hDiag+14;
  links.forEach(([a,b],i)=>{
    if(!pos[a]||!pos[b]) return;
    const p=pos[a], r=pos[b], right=r.x>p.x;
    const sx=p.x+(right?BW:0), sy=p.y+BH/2;
    const ex=r.x+(right?0:BW), ey=r.y+BH/2;
    let d;
    if(Math.abs(L[b]-L[a])>1){
      const cx1=p.x+BW/2, cx2=r.x+BW/2;
      d=`M ${cx1} ${p.y+BH} L ${cx1} ${lane} L ${cx2} ${lane} L ${cx2} ${r.y+BH}`;
      lane+=22;
    } else if(Math.abs(sy-ey)<1){ d=`M ${sx} ${sy} L ${ex} ${ey}`; }
    else { const mx=(sx+ex)/2; d=`M ${sx} ${sy} L ${mx} ${sy} L ${mx} ${ey} L ${ex} ${ey}`; }
    wires+=`<path d="${d}" stroke-width="1.6" marker-end="url(#ah)"/>`;
    hits +=`<path class="hit" d="${d}" onclick="dropLink(${i})"><title>click to remove</title></path>`;
  });

  stage.style.width=wDiag+'px'; stage.style.height=(hDiag+laneH)+'px';
  bbox={w:wDiag,h:hDiag+laneH};
  stage.innerHTML=
    `<svg class="wires" width="${wDiag}" height="${hDiag+laneH}">
       <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3"
         orient="auto"><path d="M0,0 L0,6 L8,3 z"/></marker></defs>
       ${wires}${hits}</svg>` +
    blocks.map(b=>{const pt=pos[b.id];
      return `<div class="blk ${popFor===b.id?'sel':''} ${linkFrom===b.id?'linking':''}"
        style="left:${pt.x}px;top:${pt.y}px" onclick="clickBlock(event,'${b.id}')">
        <div dir="auto">${esc(b.label||b.id)}</div>
        <div class="kind">${esc(b.id)} · ${esc(b.kind||'?')}</div></div>`;}).join('');

  // re-fit when the diagram's shape changes, but never fight a manual zoom
  const shapeKey=blocks.map(b=>b.id).join(',')+'|'+links.length+'|'+S.stage;
  if(shapeKey!==lastShape){ lastShape=shapeKey; if(!moved) fit(); }
  applyView();
  if(popFor) openPop(popFor,pos); else closePops();
}

function clickBlock(ev,id){
  ev.stopPropagation();
  if(linkFrom && linkFrom!==id){
    sketch.links.push([linkFrom,id]); linkFrom=null; dirty=true; drawDiagram(); return;
  }
  linkFrom=null; popFor=(popFor===id?null:id); drawDiagram();
}
function dropLink(i){ sketch.links.splice(i,1); dirty=true; drawDiagram(); }

let popAt={x:0,y:0};
/* The popup lives in #canvas, but drawDiagram only rebuilds #stage - so nothing
   ever removed it. With a block selected, the 3-second poll minted a new one on
   every redraw, and clicking away never closed the old ones. */
function closePops(){ document.querySelectorAll('.pop').forEach(e=>e.remove()); }

function placePop(){
  const el=document.querySelector('.pop'); if(!el) return;
  el.style.left=(panX+popAt.x*zoom)+'px';
  el.style.top =(panY+(popAt.y+BH)*zoom+10)+'px';
}
function openPop(id,pos){
  closePops();
  const b=sketch.blocks.find(x=>x.id===id);
  // the block can vanish underneath us - the stage moves on, or an agent
  // rewrites the sketch while the popup is open. Drop the selection, do not throw.
  if(!b || !pos[id]){ popFor=null; return; }
  popAt=pos[id];
  const el=document.createElement('div');
  el.className='pop';
  el.onclick=e=>e.stopPropagation();
  el.innerHTML=`<input id="pl" dir="auto" value="${esc(b.label||'')}" placeholder="label">
    <span id="pk"></span>
    <div class="row"><button onclick="startLink('${id}')">Link →</button>
      <button class="danger" onclick="delBlock('${id}')">Delete</button></div>
    <button style="width:100%;margin-top:7px" onclick="askAbout('${id}')">Ask about this</button>`;
  $('canvas').appendChild(el); placePop();
  // the block kind is what selects which cascade loads, so it is worth a real menu
  ddSet('pk', KINDS.map(k=>({v:k, label:k})), b.kind,
        v=>{ b.kind=v; dirty=true; drawDiagram(); });
  const l=el.querySelector('#pl');
  l.oninput=()=>{b.label=l.value;dirty=true;};
  l.onblur=()=>drawDiagram();
}

/* ---------- ask the advisor about one block ---------- */
let ASK_BLOCK=null;

function askAbout(id){
  ASK_BLOCK=id; popFor=null; drawDiagram();
  paintAskChip(); $('say').focus();
}
function clearAsk(){ ASK_BLOCK=null; paintAskChip(); }
function paintAskChip(){
  const el=$('askchip'); if(!el) return;
  el.innerHTML = ASK_BLOCK
    ? `asking about <b>${esc(ASK_BLOCK)}</b>
       <button onclick="clearAsk()" title="ask about the design instead">✕</button>` : '';
  el.style.display = ASK_BLOCK ? '' : 'none';
}
function startLink(id){ linkFrom=id; popFor=null; drawDiagram(); }
function delBlock(id){
  sketch.blocks=sketch.blocks.filter(b=>b.id!==id);
  sketch.links=sketch.links.filter(([a,b])=>a!==id&&b!==id);
  popFor=null; dirty=true; drawDiagram();
}
function addBlock(){
  let n=1; while(sketch.blocks.some(b=>b.id==='B'+n)) n++;
  sketch.blocks.push({id:'B'+n,kind:'other',label:'new block'});
  dirty=true; popFor='B'+n; drawDiagram();
}
async function sendSketch(){
  $('sendsketch').textContent='…';
  await fetch(q('/api/sketch'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({blocks:sketch.blocks,links:sketch.links,confirmed:sketch.confirmed,
      tell_agent:true,
      note:'I edited the block diagram directly — here is the corrected version.'})});
  dirty=false; popFor=null; $('sendsketch').textContent='Send changes to advisor';
  load();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){linkFrom=null;popFor=null;drawDiagram();}});
document.addEventListener('click',()=>{if(popFor){popFor=null;drawDiagram();}});
window.addEventListener('resize',()=>{if(!moved)fit();else applyView();});

function paint(){
  const waiting=(S.progress.waiting_on_agent||0)+(S.progress.waiting_on_student||0);
  const p=S.progress, atBottom = $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight < 120;
  $('stat').textContent = S.stage==='sketch'
    ? 'sketching — confirm the blocks'
    : `${p.answered} decisions · ${p.constraints} constraints` +
      (p.conflicts?` · ${p.conflicts} conflict`:'') +
      (waiting?` · ${waiting} question${waiting>1?'s':''} open`:'');

  let h='';
  for(const m of (S.chat||[])){
    if(m.role==='decision'){
      h+=`<div class="msg"><div class="dec" dir="${bi(m.text)}">
        <div class="head">✓ <b>${txt(m.text)}</b></div>
        ${(m.locked||[]).length?`<div class="locked">${m.locked.map(l=>
          `<div class="lk" dir="${bi(l.text)}"><span class="tag">${l.icon}${l.verified?'':' unverified'}</span>${txt(l.text)}</div>`
        ).join('')}</div>`:''}
      </div></div>`;
    } else {
      h+=`<div class="msg ${m.role==='agent'?'advisor':'you'}">
        <div class="who">${m.role==='agent'?'advisor':'you'}</div>
        ${m.block?`<div class="about">about ${esc(m.block)}</div>`:''}
        <div class="bubble" dir="${bi(m.text)}">${txt(m.text)}</div></div>`;
    }
  }
  // the live question sits at the end of the conversation, with its answers attached
  if(S.open && S.open.length){
    const n=S.open[0];
    h+=`<div class="ask" dir="${bi(n.question)}"><div class="q">${txt(n.question)}</div>
      <div class="why">${txt(n.why||'')}</div><div class="opts">` +
      (n.options||[]).map(o=>`<button class="opt" dir="${bi(o.label)}" onclick="answer('${n.id}','${o.id}')">
        ${txt(o.label)}${optWeight(o)}
      </button>`).join('') + `</div></div>`;
  }
  if(busy) h+=`<div class="msg advisor"><div class="thinking"><i></i>the advisor is working…</div></div>`;
  if(!h) h=`<div class="empty">Describe what you want to build.<br>
    The advisor will sketch it back to you, then walk you through the decisions.</div>`;
  $('wrap').innerHTML=h;
  if(atBottom) $('log').scrollTop=$('log').scrollHeight;

  renderPanel();
}

function showPanel(tab){ TAB=tab; lsSet('pcbadv.tab',tab); renderPanel(); }

let PANEL_SHOWN=null;

function renderPanel(){
  if(!S) return;
  // The state polls every few seconds. Re-rendering under someone's hands would
  // shut an open menu and wipe half-typed text, so while they are working in
  // the panel, leave it alone.
  const working = $('sbody').contains(document.activeElement)
                || document.querySelector('.dd.open');
  if(working && PANEL_SHOWN===TAB) return;

  for(const t of ['decisions','constraints','sources','memory','settings'])
    $('t-'+t).classList.toggle('on', t===TAB);
  const w=(S.progress.waiting_on_agent||0)+(S.progress.waiting_on_student||0);
  $('t-constraints').innerHTML='Constraints'+(w?`<span class="badge">${w}</span>`:'');
  let h='';
  if(TAB==='decisions'){
    // a 300px rail is too narrow for a table; one card per row reads better
    h = S.answered.length ? S.answered.map(n=>{
        const o=(n.options||[]).find(x=>x.id===n.chosen)||{};
        return `<div class="card">
          <div class="q" dir="auto">${txt(n.question)}</div>
          <div class="a" dir="auto">${txt(o.label||n.chosen)}</div>
          <div class="foot"><span class="pill">${esc(n.domain)}</span>${badge(n.id)}</div>
          ${thread(n.id)}</div>`;}).join('')
      : `<div class="empty">Nothing decided yet.</div>`;
  }
  if(TAB==='constraints'){
    h = (S.conflicts||[]).map(c=>`<div class="conflict"><b>Conflict</b> — ${esc(c.note)}</div>`).join('');
    h += S.constraints.length ? S.constraints.map(c=>{const s=c.source||{};
        return `<div class="card">
          <div dir="auto">${txt(c.text)}</div>
          ${s.quote?`<div class="quote">“${esc(s.quote)}”</div>`:''}
          <div class="foot">
            <span class="pill ${c.verified?'':'u'}">${c.icon} ${esc(c.provenance)}${c.verified?'':' · unverified'}</span>
            ${badge(c.id)}</div>
          <div class="meta">from ${esc(c.from_label)}${s.doc?' · ':''}
            ${s.url?`<a href="${esc(s.url)}" target="_blank">${esc(s.doc)}</a>`:esc(s.doc||'')}
            ${esc(s.locator||'')}</div>
          ${thread(c.id)}</div>`;}).join('')
      : `<div class="empty">Constraints appear as you decide.</div>`;
  }
  if(TAB==='sources'){
    h = (S.sources||[]).map(f=>`<div class="srcrow"><span>${f.name.endsWith('.pdf')?'📄':'📘'}</span>
      <span class="g">${esc(f.name)}</span><span class="pill">${esc(f.scope)}</span>
      <a href="${q('/api/source/'+encodeURIComponent(f.name))}" target="_blank">open</a></div>`).join('')
      || `<div class="empty">No documents yet.</div>`;
    h += `<div class="tools"><input type="text" id="srcurl" placeholder="https://…/datasheet.pdf">
      <button onclick="fetchSrc()">Fetch</button>
      <button onclick="document.getElementById('up').click()">Upload</button>
      <input type="file" id="up" style="display:none" onchange="upload(this)"></div>`;
  }
  if(TAB==='memory'){
    // what this conversation would otherwise forget. The student owns it.
    h = `<div class="empty" style="text-align:left">This conversation's memory. The advisor
      rewrites it every few messages, and it is sent with every turn. Decisions are not
      repeated here — they are already sent in full. You can edit it.</div>
      <textarea id="mem" dir="auto" style="width:100%;min-height:280px;background:var(--field);
        color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;
        font:13px/1.55 ui-monospace,monospace">${esc(S.memory||'')}</textarea>
      <div class="tools"><button onclick="saveMemory()">Save</button>
      <button onclick="rewriteMemory()">Rewrite now</button>
      <span class="meta" id="memlen"></span></div>`;
  }
  if(TAB==='settings') h=settingsHTML();
  $('sbody').innerHTML=h;
  if(TAB==='settings') settingsDropdowns();
  if(TAB==='memory') memlen();
  PANEL_SHOWN=TAB;
}

/* A thread hangs on a design element, not on a conversation: it is everything
   ever said about THIS constraint, in any session. */
let OPEN_THREAD=null;

function badge(id){
  const t=(S.threads||{})[id];
  const said=t?(t.messages||[]).filter(m=>m.role!=='resolved').length:0;
  const cls=t&&t.waiting_on?'wait':(t&&t.resolved?'done':'');
  const label=said?`💬 ${said}${t.waiting_on?' · waiting on '+t.waiting_on:''}`:'ask';
  return `<span class="ask-badge ${cls}" onclick="toggleThread('${esc(id)}')">${label}</span>`;
}

function thread(id){
  if(OPEN_THREAD!==id) return '';
  const t=(S.threads||{})[id]||{messages:[]};
  const body=(t.messages||[]).filter(m=>m.role!=='resolved')
    .map(m=>`<div class="m" dir="${bi(m.text)}"><b>${esc(m.role)}</b>${txt(m.text)}</div>`).join('')
    || `<div class="m" style="color:var(--dim)">Nothing asked about this yet.</div>`;
  return `<div class="thr">${body}
    <div class="row"><input id="thr-in" dir="auto" placeholder="Ask about this…"
      onkeydown="if(event.key==='Enter')postThread('${esc(id)}')">
      <button onclick="postThread('${esc(id)}')">Ask</button>
      ${t.messages&&t.messages.length&&!t.resolved
        ? `<button onclick="resolveThread('${esc(id)}')">Resolve</button>`:''}</div></div>`;
}

function toggleThread(id){ OPEN_THREAD = OPEN_THREAD===id ? null : id; renderPanel(); }

async function postThread(id){
  const el=$('thr-in'); const text=(el?el.value:'').trim(); if(!text) return;
  el.disabled=true; el.value='thinking…';
  try{
    S=await (await fetch(q('/api/message'),{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({anchor:id,text,role:'user'})})).json();
  } finally { renderPanel(); }
}

async function resolveThread(id){
  S=await (await fetch(q('/api/thread/resolve'),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({anchor:id})})).json();
  OPEN_THREAD=null; renderPanel();
}

/* ---------- settings, where the student expected to find them ---------- */
function settingsHTML(){
  if(!CFG) return `<div class="empty">Loading…</div>`;
  const b=S.board||{}, u=CFG.user||{};
  const num=(k,label,v,step)=>`<label><span>${label}</span>
    <input type="number" step="${step||1}" id="s-${k}" value="${v}"></label>`;
  const engines=(CFG.engines||[]).filter(e=>e.status==='implemented')
    .map(e=>({v:e.id, label:e.title, sub:e.available?'ready':e.reason}));
  return `<div class="set">
    <h4>This board</h4>
    <label><span>Title</span><input type="text" id="s-title" value="${esc(S.title||'')}"></label>
    ${num('layers','Layers',b.layers)}
    ${num('copper_oz','Copper, oz',b.copper_oz,0.5)}
    ${num('max_temp_rise_c','Max rise, °C',b.max_temp_rise_c)}
    ${num('min_track_mm','Min track, mm',b.min_track_mm,0.05)}
    <p class="note">Copied from the defaults when the board was created. The
      calculation scripts use these numbers.</p>
    <div class="tools"><button onclick="saveBoard()">Save board</button></div>

    <h4>Preferences</h4>
    <label><span>Language</span><span id="s-language"></span></label>
    <label><span>Units</span><span id="s-units"></span></label>
    <label><span>Theme</span><span id="s-theme"></span></label>
    <label><span>Show unverified</span>
      <input type="checkbox" id="s-show_unverified" ${u.show_unverified?'checked':''}></label>

    <h4>Engine</h4>
    <label><span>Provider</span><span id="s-provider"></span></label>
    ${num('memory_every','Memory every',CFG.agent?CFG.agent.memory_every:10)}
    ${num('memory_max_chars','Memory chars',CFG.agent?CFG.agent.memory_max_chars:2000,100)}
    <div class="tools"><button onclick="savePrefs()">Save settings</button></div>
    <p class="note">Everything else lives in <code>config.json</code>.
      See docs/configuration.md.</p>
  </div>`;
}

function settingsDropdowns(){
  const u=CFG.user||{}, a=CFG.agent||{};
  ddSet('s-language', [{v:'auto',label:'auto',sub:'follow what you type'},
                       {v:'en',label:'English'},{v:'he',label:'עברית'}],
        u.language||'auto', null, {right:true});
  ddSet('s-units', [{v:'mm',label:'mm'},{v:'mil',label:'mil'}], u.units||'mm', null, {right:true});
  // applied on the pick, not on Save: a theme you have to commit to before you
  // can see it is not a theme you can choose. Save settings still persists it.
  ddSet('s-theme', [{v:'auto',label:'auto',sub:'system · now '+systemTheme()},
                    {v:'light',label:'light'},{v:'dark',label:'dark'}],
        THEME, chooseTheme, {right:true});
  ddSet('s-provider', (CFG.engines||[]).filter(e=>e.status==='implemented')
        .map(e=>({v:e.id,label:e.title,sub:e.available?'ready':e.reason})),
        a.provider||CFG.engine, null, {right:true});
}

const val=id=>{
  const e=$(id);
  if(DD[id]) return ddValue(id);
  return e ? (e.type==='checkbox'?e.checked:e.value) : undefined;
};

async function saveBoard(){
  await fetch(q('/api/project/meta'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:val('s-title'), board:{
      layers:+val('s-layers'), copper_oz:+val('s-copper_oz'),
      max_temp_rise_c:+val('s-max_temp_rise_c'), min_track_mm:+val('s-min_track_mm')}})});
  await load(); renderPanel();
}

async function savePrefs(){
  const r=await (await fetch('/api/config',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({set:{
      'user.language':val('s-language'), 'user.units':val('s-units'),
      'user.theme':val('s-theme')||THEME,
      'user.show_unverified':val('s-show_unverified'),
      'agent.provider':val('s-provider'),
      'agent.memory_every':+val('s-memory_every'),
      'agent.memory_max_chars':+val('s-memory_max_chars')}})})).json();
  if(r.error){ alert(r.error); return; }
  CFG=r.config;
  if(CFG.user) applyTheme(CFG.user.theme);
  renderPanel(); load();
}

/* An option's price is rarely only in `costs`. It is also the parts it adds and
   the rules it locks in - and an option with none of those rendered bare read as
   free next to one with a red line under it. Every option now carries its weight,
   and `note` is neutral: reassurance should not wear the same alarm red as a hazard. */
function optWeight(o){
  const parts=(o.blocks||[]).map(b=>(b.label||b.id).replace(/\n/g,' '));
  const locks=(o.locks||[]).length;
  let h='';
  if((o.costs||[]).length) h+=`<div class="cost">${o.costs.map(txt).join(' · ')}</div>`;
  if(o.note) h+=`<div class="note-opt">${txt(o.note)}</div>`;
  const adds=[];
  if(parts.length) adds.push(`adds ${parts.map(esc).join(', ')}`);
  if(locks)        adds.push(`${locks} rule${locks>1?'s':''} follow${locks>1?'':'s'}`);
  if(adds.length)  h+=`<div class="adds">${adds.join(' · ')}</div>`;
  return h;
}

function memlen(){
  const el=$('mem'); if(!el) return;
  $('memlen').textContent = el.value.length + ' characters';
  el.oninput = () => $('memlen').textContent = el.value.length + ' characters';
}

async function saveMemory(){
  const r=await (await fetch(q('/api/memory'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:$('mem').value})})).json();
  if(r.trimmed) alert('Saved, but it was over the limit and was trimmed.');
  load();
}

async function rewriteMemory(){
  const b=event.target; b.disabled=true; b.textContent='Rewriting…';
  try{
    const r=await (await fetch(q('/api/memory'),{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({})})).json();
    if(r.rewritten && !r.rewritten.ok) alert(r.rewritten.reason||'could not rewrite');
  } finally { b.disabled=false; b.textContent='Rewrite now'; await load(); renderPanel(); }
}

async function answer(node,value){
  await fetch(q('/api/answer'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({node,value,by:'user'})});
  load();
}
async function send(){
  const el=$('say'), text=el.value.trim(); if(!text||busy) return;
  const block=ASK_BLOCK;
  busy=true; $('sendbtn').textContent='…'; el.value=''; clearAsk();

  // A reply takes ten to twenty-five seconds. Waiting for the round trip before
  // showing anything meant your own message vanished and nothing replaced it -
  // the tool looked broken rather than busy. Show it now; load() replaces the
  // whole log with the server's copy when the answer lands.
  if(S){ S.chat=[...(S.chat||[]), {role:'user', text, block, ts:new Date().toISOString()}];
         paint(); }

  let failed=false;
  try{
    const r=await fetch(q('/api/chat'),{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, block})});
    failed=!r.ok;
  }catch(e){ failed=true; }
  finally{
    busy=false; $('sendbtn').textContent='Send';
    if(failed && S){ S.chat=[...(S.chat||[]),
      {role:'agent', text:'That did not reach the advisor. Your message is not saved — try again.'}];
      paint(); }
    else load();
  }
}
async function fetchSrc(){
  const u=$('srcurl').value.trim(); if(!u) return; $('srcurl').value='';
  const r=await (await fetch(q('/api/fetch_source'),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})})).json();
  if(r.error) alert(r.error); load();
}
function upload(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{ await fetch(q('/api/upload'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:f.name,data_b64:rd.result.split(',')[1]})});
    input.value=''; load(); };
  rd.readAsDataURL(f);
}
async function boot(){
  TAB=lsGet('pcbadv.tab')||'decisions';
  try{ CFG=await (await fetch('/api/config')).json(); }catch(e){ CFG=null; }
  // the server owns the setting; the cached one only covered the round trip
  if(CFG && CFG.user) applyTheme(CFG.user.theme);
  await loadProjects();          // settles PROJ before the first state fetch
  await load();
  setInterval(()=>{if(!busy)load();},3000);
}
boot();
</script>
