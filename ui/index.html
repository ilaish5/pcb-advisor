<!doctype html>
<meta charset="utf-8">
<title>PCB Advisor</title>
<link rel="icon" href="data:,">

<script>
/* Runs before the first paint, so the page never flashes the wrong theme while
   /api/config is still in flight. The server's answer is the truth; this is the
   last answer it gave, cached. Private windows throw on localStorage - a theme
   is not worth a blank page, so failure just means "auto". */
(function(){
  try{
    var t=localStorage.getItem('pcbadv.theme');
    if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>

<style>
/* ---------- colour, in one place ----------
   Three modes. `auto` sets no data-theme at all and lets the media query below
   decide, so the OS is followed even with JS disabled; `light` and `dark` pin
   the attribute. Every colour in this file is a token - a literal here is a
   colour that cannot follow the theme. */
:root{
  /* tells the browser to render its own bits - spinners, scrollbars, the caret -
     in dark, instead of dropping a white control into a dark page */
  color-scheme: dark;
  --bg:#0b0f19; --panel:rgba(15, 23, 42, 0.75); --card:rgba(30, 41, 59, 0.6); --menu:#1e293b; --pop:#1e293b;
  --field:rgba(15, 23, 42, 0.5); --lk:rgba(30, 41, 59, 0.3);
  --line:rgba(255, 255, 255, 0.1); --line2:rgba(255, 255, 255, 0.05); --edge:rgba(255, 255, 255, 0.15); --edge2:rgba(255, 255, 255, 0.2); --rule:rgba(255, 255, 255, 0.1);
  --ink:#f8fafc; --ink2:#cbd5e1; --dim:#94a3b8; --mute:#64748b;
  --hover:rgba(255, 255, 255, 0.05); --hover2:rgba(255, 255, 255, 0.08); --sel:rgba(56, 189, 248, 0.15);
  --accent:#38bdf8; --ok:#10b981; --warn:#fbbf24; --bad:#ef4444;
  --on-accent:#0f172a; --ring:rgba(56, 189, 248, 0.3);
  --you:rgba(56, 189, 248, 0.1); --you-line:rgba(56, 189, 248, 0.2);
  --blk-line:rgba(56, 189, 248, 0.5); --wire:#64748b; --wire-hot:#ef4444;
  --conflict-bg:rgba(239, 68, 68, 0.1); --danger-ink:#fca5a5;
  --warn-bg:rgba(251, 191, 36, 0.1); --warn-line:rgba(251, 191, 36, 0.2); --warn-edge:rgba(251, 191, 36, 0.3); --warn-ink:#fcd34d;
  --shadow:rgba(0,0,0,0.5); --shadow-menu:rgba(0,0,0,0.6);
}

/* The light palette is written twice on purpose: once for an explicit choice and
   once for the media query. A shared class would need JS to attach it, and the
   whole point of the media query is to work before any JS has run. */
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f6fa; --panel:#e9ecf3; --card:#fff; --menu:#fff; --pop:#fff;
  --field:#fff; --lk:#f3f5fa;
  --line:#c8cfdd; --line2:#e5e9f0; --edge:#b0bacd; --edge2:#9aa5be; --rule:#c3cbdb;
  --ink:#151922; --ink2:#333b4b; --dim:#556074; --mute:#5f6a7e;
  --hover:#e4e8f2; --hover2:#eaeef8; --sel:#dbe4f8;
  --accent:#1d4ed8; --ok:#15803d; --warn:#8a5a00; --bad:#c62828;
  --on-accent:#fff; --ring:#1d4ed833;
  --you:#dbeafe; --you-line:#8fbaf5;
  --blk-line:#8e9ab4; --wire:#68738c; --wire-hot:#ef444488;
  --conflict-bg:#fdeaea; --danger-ink:#9b1c1c;
  --warn-bg:#f7e7bd; --warn-line:#c99f42; --warn-edge:#c39b3e; --warn-ink:#6b4e0a;
  --shadow:#0f172a26; --shadow-menu:rgba(15,23,42,.16);
}

/* `auto`: no data-theme attribute, so this only ever applies to someone who has
   not chosen. An explicit choice sets the attribute and wins by not matching. */
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    color-scheme: light;
    --bg:#f4f6fa; --panel:#e9ecf3; --card:#fff; --menu:#fff; --pop:#fff;
    --field:#fff; --lk:#f3f5fa;
    --line:#c8cfdd; --line2:#e5e9f0; --edge:#b0bacd; --edge2:#9aa5be; --rule:#c3cbdb;
    --ink:#151922; --ink2:#333b4b; --dim:#556074; --mute:#5f6a7e;
    --hover:#e4e8f2; --hover2:#eaeef8; --sel:#dbe4f8;
    --accent:#1d4ed8; --ok:#15803d; --warn:#8a5a00; --bad:#c62828;
    --on-accent:#fff; --ring:#1d4ed833;
    --you:#dbeafe; --you-line:#8fbaf5;
    --blk-line:#8e9ab4; --wire:#68738c; --wire-hot:#ef444488;
    --conflict-bg:#fdeaea; --danger-ink:#9b1c1c;
    --warn-bg:#f7e7bd; --warn-line:#c99f42; --warn-edge:#c39b3e; --warn-ink:#6b4e0a;
    --shadow:#0f172a26; --shadow-menu:rgba(15,23,42,.16);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
     font:14px/1.6 -apple-system,"Segoe UI",Inter,Arial,sans-serif;
     display:flex;overflow:hidden}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font:inherit;font-size:13px;padding:6px 9px;
  -webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* a checkbox we control, instead of the OS one */
input[type=checkbox]{width:17px;height:17px;border-radius:5px;cursor:pointer;
  position:relative;flex:none;padding:0}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:1px;
  width:4px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(43deg)}

/* ---------- dropdowns: ours, so the popup matches the app ---------- */
.dd{position:relative;flex:1;min-width:0}
.dd-t{width:100%;display:flex;align-items:center;gap:7px;text-align:left}
.dd-t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-t i{font-style:normal;color:var(--dim);font-size:10px;transform:translateY(1px)}
.dd.open .dd-t{border-color:var(--accent)}
.dd-m{display:none;position:absolute;z-index:40;top:calc(100% + 5px);left:0;min-width:100%;
  width:max-content;max-width:300px;max-height:290px;overflow-y:auto;background:var(--menu);border:1px solid var(--edge);
  border-radius:10px;padding:5px;box-shadow:0 14px 34px var(--shadow-menu)}
.dd.open .dd-m{display:block}
.dd-m.right{left:auto;right:0}
.dd-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;
  background:transparent;border-radius:7px;padding:7px 9px;font-size:13px;white-space:nowrap}
.dd-i:hover{background:var(--hover2)}
.dd-i.on{background:var(--sel);color:var(--ink)}
.dd-i b{flex:none;font-weight:400}
.dd-i em{font-style:normal;color:var(--mute);font-size:11px;margin-left:auto;
  overflow:hidden;text-overflow:ellipsis}
.dd-i .tick{color:var(--accent);font-size:11px;visibility:hidden}
.dd-i.on .tick{visibility:visible}

/* ---------- UI layout: unified sidebar | design ---------- */
.side{width:430px;min-width:300px;flex:none;background:var(--panel);backdrop-filter:blur(16px);
  border-right:1px solid var(--line2);display:flex;flex-direction:column;overflow:hidden}
.mid{flex:1;min-width:280px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg)}
.chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
.split{width:5px;flex:none;cursor:col-resize;background:transparent}
.split:hover,.split.on{background:var(--accent)}

.brand{font-weight:600;padding:13px 16px 11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;font-size:14.5px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.picker{padding:10px 12px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:7px}
.picker .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.picker .row{display:flex;gap:6px}

.picker button{padding:6px 9px;font-size:12px}
.snav{display:flex;flex-wrap:nowrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto; align-items:center;}
.snav::-webkit-scrollbar { display: none; }
.snav { -ms-overflow-style: none; scrollbar-width: none; }
.snav-item { display:flex; align-items:center; background:transparent; border-radius:6px; border:1px solid transparent; }
.snav-item:hover { border-color:var(--edge2); background:var(--hover); }
.snav button{padding:4px 8px;font-size:12px;border-color:transparent;background:transparent; color:var(--dim); cursor:pointer;}
.snav button:hover{color:var(--ink);}
.snav button.on{background:var(--sel);border-color:var(--edge2);color:var(--ink); border-radius:4px;}
.snav .open-ide-btn { padding:4px 6px; font-size:11px; opacity:0.6; }
.snav .open-ide-btn:hover { opacity:1; }
.snav .badge{background:var(--warn-bg);color:var(--warn);border-radius:99px;
  font-size:10px;padding:0 5px;margin-left:5px}
.sbody{flex:1;overflow-y:auto;padding:12px 13px}
.sfoot{border-top:1px solid var(--line);padding:8px 13px;font-size:11.5px;color:var(--mute);
  display:flex;gap:8px;align-items:center}

/* ---------- the diagram: real DOM, so it is legible and editable ---------- */
.diagram{flex:1;background:radial-gradient(circle, rgba(100,116,139,0.3) 1.5px, transparent 1.5px);background-size:24px 24px;display:flex;flex-direction:column;
  min-height:0;position:relative}
/* dragging must not select the text underneath */
body.nosel{user-select:none;-webkit-user-select:none}
.zoom{display:flex;align-items:center;gap:2px;margin-inline-start:6px}
.zoom button{padding:4px 9px;font-size:13px;line-height:1}
.zoom .pct{color:var(--dim);font-size:11.5px;width:42px;text-align:center}
.dbar{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--dim)}
.dbar .sp{flex:1}
.dbar button{padding:5px 10px;font-size:12px}
.dbar button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.canvas{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.canvas.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.blk{position:absolute;width:158px;min-height:64px;background:rgba(15, 23, 42, 0.85);backdrop-filter:blur(12px);
  border:1px solid rgba(255, 255, 255, 0.1);border-radius:12px;padding:9px 11px;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  font-size:13px;line-height:1.35;z-index:2;box-shadow:0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);color:#f1f5f9;transition:all 0.2s ease;}
/* a part the design questions added: on the board, but nothing says where */
.blk.loose{border-style:dashed;opacity:.7}
.loosecap{position:absolute;left:0;text-align:center;color:var(--dim);font-size:12px;
  z-index:1;pointer-events:none}
.blk:hover{border-color:var(--accent);box-shadow:0 0 10px var(--ring);}
.blk.sel{border-color:var(--accent);box-shadow:0 0 15px rgba(56, 189, 248, 0.4), inset 0 1px 1px rgba(255,255,255,0.2);}
.blk.linking{border-color:var(--ok);border-style:dashed}
.blk .kind{font-size:10px;color:var(--dim)}
.wires{position:absolute;inset:0;z-index:1;overflow:visible}
.wires path{stroke:var(--wire);fill:none;filter:drop-shadow(0 0 3px rgba(100,116,139,0.5))}
.wires path.hit{stroke:transparent;stroke-width:14;cursor:pointer;fill:none}
.wires marker path { fill: var(--wire); stroke: none; filter: none; }
.wires path.hit:hover{stroke:var(--wire-hot)}
.pop{position:absolute;z-index:20;background:var(--pop);border:1px solid var(--edge2);
  border-radius:10px;padding:12px;width:250px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 12px 32px var(--shadow)}
.pop input,.pop select{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;color:var(--ink);font:inherit;font-size:13px}
.pop .row{display:flex;gap:7px}
.pop .dd{width:100%}
.pop .row button{flex:1;font-size:12px}
.danger{color:var(--danger-ink)}
.hintbar{font-size:11.5px;color:var(--dim);padding:0 14px 8px}
.demobar{background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--warn-line);
  padding:8px 14px;font-size:12px;line-height:1.5}
.demobar b{font-weight:600}

/* ---------- the conversation ---------- */
.chead{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:9px;font-size:12.5px;color:var(--dim)}
.chead .sp{flex:1}
.log{flex:1;overflow-y:auto;padding:18px 0}
.wrap{max-width:100%;margin:0 auto;padding:0 16px;
      display:flex;flex-direction:column;gap:15px}
.msg{display:flex;flex-direction:column;gap:5px}
.who{font-size:11px;color:var(--dim)}
.bubble{border-radius:12px;padding:12px 15px;font-size:14px}
.you .bubble{background:var(--you);border:1px solid var(--you-line);align-self:flex-end;max-width:80%}
.you{align-items:flex-end}
.advisor .bubble{background:var(--card);border:1px solid var(--line)}

/* a decision, shown inline in the timeline */
.dec{border-left:2px solid var(--ok);padding:2px 0 2px 14px}
.dec .head{font-size:13.5px}
.dec .head b{color:var(--ok);font-weight:600}
/* taking something out is not an achievement: it must not read like one */
.dec.gone{border-left-color:var(--line)}
.dec.gone .head b{color:var(--dim);font-weight:500}
.dec.gone .locked{opacity:.6}
.dec .lost{margin-top:8px;font-size:12px;color:var(--dim)}
.locked{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.lk{background:var(--lk);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;font-size:13px;color:var(--ink2)}
.lk .tag{color:var(--dim);font-size:11px;margin-right:6px}
/* An answer that locks nothing used to pass in silence, which reads as "nothing
   applies" when it often means "the question could not express your case". */
.nothing{margin-top:7px;font-size:12.5px;color:var(--dim);line-height:1.5;
  border-left:2px solid var(--warn-line);padding-left:10px}

/* the live question, with its answers right there */
.ask{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:16px}
.ask .q{font-size:15.5px;font-weight:600;margin-bottom:5px}
.ask .why{color:var(--dim);font-size:13px;margin-bottom:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 13px;font-size:14px;width:100%}
/* Both lines are neutral on purpose. Red is a hazard signal; an option is not a
   hazard, and colouring one option's consequence red turns a consideration into
   a verdict - which is the one thing the advisor is forbidden to hand out. */
.opt .weigh{color:var(--mute);font-size:11.5px;margin-top:4px}
.opt .nuance{color:var(--dim);font-size:12px;margin-top:3px}
.empty{color:var(--dim);text-align:center;padding:36px 14px;font-size:13px;line-height:1.7}

/* ---------- input ---------- */
.compose{border-top:1px solid var(--line);padding:12px 0}
.askchip{display:flex;align-items:center;gap:7px;margin:0 16px 9px;font-size:12px;
  color:var(--dim);background:var(--field);border:1px solid var(--edge);
  border-radius:99px;padding:4px 6px 4px 12px;width:fit-content}

/* ---------- IDE tabs ---------- */
.ide-tabs {
  display: flex;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 0 8px;
  gap: 2px;
  overflow-x: auto;
  flex-shrink: 0;
}
.ide-tab {
  padding: 6px 14px;
  font-size: 13px;
  color: var(--dim);
  background: transparent;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  user-select: none;
}
.ide-tab:hover {
  background: var(--hover);
  color: var(--ink);
}
.ide-tab.active {
  background: var(--card);
  color: var(--ink);
  font-weight: 500;
  box-shadow: 0 -2px 0 var(--accent) inset;
}
.ide-tab .close-btn {
  font-size: 16px;
  color: var(--mute);
  padding: 0 4px;
  border-radius: 4px;
  line-height: 1;
}
.ide-tab .close-btn:hover {
  background: var(--line);
  color: var(--ink);
}
.doc-viewer {
  display: none;
  flex: 1;
  min-height: 0;
  background: var(--bg);
}
.doc-viewer iframe {
  width: 100%;
  height: 100%;
  border: none;
}
.askchip b{color:var(--ink);font-weight:600}
.askchip button{padding:0 6px;border:0;background:transparent;color:var(--dim);font-size:13px}
.thinking{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;
  padding:2px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.about{font-size:11px;color:var(--dim);margin-bottom:3px}
.compose .wrap{flex-direction:row;gap:9px;align-items:flex-end}
textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;color:var(--ink);font:inherit;resize:none;height:48px}
.send{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:11px 20px}

/* ---------- settings, in the left rail like an IDE ---------- */
.set h4{margin:16px 0 7px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);font-weight:600}
.set h4:first-child{margin-top:0}
.set label{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.set label span{flex:1;color:var(--dim)}
.set label input{width:116px;flex:none;font-size:12.5px;padding:5px 8px}
.set{max-width:460px}
.set label .dd{width:200px;flex:none}
.set label .meta{width:200px;flex:none;padding:5px 8px}
.set label .dd-t{font-size:12.5px;padding:5px 8px}
.set label input[type=checkbox]{width:17px}
.set .note{color:var(--mute);font-size:11px;line-height:1.5;margin:5px 0 0}
.thr{margin-top:8px;border-left:2px solid var(--rule);padding-left:9px}
.thr .m{margin:5px 0;font-size:12.5px;line-height:1.5}
.thr .m b{color:var(--dim);font-weight:600;margin-right:5px}
.thr .row{display:flex;gap:6px;margin-top:7px}
.thr input{flex:1;background:var(--field);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
.thr .settled{margin-top:7px;color:var(--dim);font-size:12px;line-height:1.5}
.thr .settled .still{color:var(--warn-ink);margin-top:3px}
.thr-err{margin-top:7px;color:var(--warn-ink);font-size:12px;line-height:1.5}
.ask-badge{cursor:pointer;border:1px solid var(--line);background:var(--hover);border-radius:999px;
  padding:1px 8px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.ask-badge.wait{border-color:var(--warn-edge);color:var(--warn-ink)}
.ask-badge.done{opacity:.55}
/* settled, but what it was about is still in the design: not the same as done */
.ask-badge.ack{border-color:var(--warn-edge);color:var(--dim)}
/* Taking a question out is a real edit, so it does not get a button competing
   with the answers. It is a quiet link that opens one field asking why. */
.drop{cursor:pointer;color:var(--mute);font-size:11px;border-bottom:1px dotted var(--line);
      margin-left:auto;white-space:nowrap}
.drop:hover{color:var(--warn-ink)}
.droprow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.droprow input{flex:1;min-width:150px;background:var(--field);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px}
.card.gone{opacity:.72;border-style:dashed}
.card.gone .a{font-weight:400;color:var(--dim)}
.gone-head{color:var(--mute);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  margin:14px 0 7px}
.gone-head.foryou{cursor:pointer;user-select:none}
.gone-head.foryou:hover{color:var(--dim)}
.card.corpus{border-style:dashed}
.card.corpus .a{font-weight:500}
.card .why{margin-top:5px;font-size:12px;line-height:1.5;color:var(--dim)}
.qty{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.qty input{width:140px;background:var(--field);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.qty .unit{color:var(--dim);font-size:13px}
.qty .thr-err{flex-basis:100%}

/* cards, not tables: the rail is narrow and a two-column table clips */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;

<script>
let S=null, busy=false, TAB='chat';
let CFG=null;
// no project in the URL means "whatever config calls the default" - boot() fills it in
let PROJ=new URLSearchParams(location.search).get('project')||'';
let SESS=new URLSearchParams(location.search).get('session')||'';
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderMarkdown(md) {
  let html = esc(md);
  html = html.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  const lines = html.split('\n');
  let inTable = false;
  let out = [];
  let isFirstRow = false;
  
  for(let i=0; i<lines.length; i++) {
    let line = lines[i].trim();
    if(line.startsWith('|') && line.endsWith('|')) {
      if(!inTable) {
        out.push('<table class="bom-table">');
        inTable = true;
        isFirstRow = true;
      }
      if(line.includes('|---')) continue;
      let cells = line.split('|').slice(1, -1);
      if(isFirstRow) { 
        out.push('<tr>' + cells.map(c => `<th>${c.trim()}</th>`).join('') + '</tr>');
        isFirstRow = false;
      } else {
        out.push('<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>');
      }
    } else {
      if(inTable) { out.push('</table>'); inTable = false; }
      if(line.startsWith('#')) {
        out.push(`<div style="font-weight:bold; font-size:16px; margin:15px 0 5px;">${line.replace(/^#+\s*/, '')}</div>`);
      } else if (line) {
        out.push(`<div>${line}</div>`);
      } else {
        out.push('<br>');
      }
    }
  }
  if(inTable) out.push('</table>');
  return out.join('');
}
const HEB=/[\u0590-\u05FF]/;
// A flow arrow between two Hebrew words has to point the other way. Only flip
// when Hebrew sits on BOTH sides, so "Vin -> SW -> L" is left alone.
const flow=s=>(s||'')
  .replace(/([\u0590-\u05FF][^\S\n]*)→([^\S\n]*[\u0590-\u05FF])/g,'$1←$2')
  .replace(/([\u0590-\u05FF][^\S\n]*)->([^\S\n]*[\u0590-\u05FF])/g,'$1<-$2');
// dir=auto lets the browser pick paragraph direction from the first strong character
const bi=s=>HEB.test(s)?'rtl':'auto';
const txt=s=>esc(flow(s)).replace(/\n/g,'<br>');
const q=p=>p+(p.includes('?')?'&':'?')+'project='+encodeURIComponent(PROJ)
  +(SESS?'&session='+encodeURIComponent(SESS):'');

let openTabs = [];
let activeIdeTab = 'diagram';

function applyTabToContainer(tab, containerId) {
  let container = $(containerId);
  if(!container) return;
  
  // if diagram/chat is currently here, park it back to body if we are removing it
  if (container.contains($('diagram')) && tab !== 'diagram') {
     $('anchor-diagram').parentNode.insertBefore($('diagram'), $('anchor-diagram'));
     $('diagram').style.display = 'none';
  }
  if (container.contains($('chatPane')) && tab !== 'panel:chat') {
     $('anchor-chatPane').parentNode.insertBefore($('chatPane'), $('anchor-chatPane'));
     $('chatPane').style.display = (TAB === 'chat') ? 'flex' : 'none';
  }
  if (container.contains($('sbody')) && tab !== 'panel:' + TAB) {
     $('anchor-sbody').parentNode.insertBefore($('sbody'), $('anchor-sbody'));
     $('sbody').style.display = (TAB !== 'chat') ? 'block' : 'none';
  }

  // Clear existing iframe/panels
  container.querySelectorAll('.doc-frame').forEach(e => e.remove());
  
  if (!tab) {
     // do nothing
  } else if (tab === 'diagram') {
    container.appendChild($('diagram'));
    $('diagram').style.display = 'flex';
  } else if (tab.startsWith('panel:')) {
    let p = tab.substring(6);
    if (p === 'chat') {
       container.appendChild($('chatPane'));
       $('chatPane').style.display = 'flex';
       setTimeout(scrollLog, 10);
    } else {
       // move sbody into here
       container.appendChild($('sbody'));
       $('sbody').style.display = 'block';
       let oldTab = TAB;
       TAB = p;
       renderPanel(true);
       TAB = oldTab;
    }
  } else {
    let iframe = document.createElement('iframe');
    iframe.className = 'doc-frame';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    iframe.src = q('/api/source/' + encodeURIComponent(tab));
    container.appendChild(iframe);
  }
}

function openInIde(filename) {
  if (!openTabs.includes(filename)) {
    openTabs.push(filename);
  }
  switchIdeTab(filename);
}

function switchIdeTab(tab) {
  activeIdeTab = tab;
  renderIdeTabs();
  applyTabToContainer(tab, 'ide-content-left');
}

function closeIdeTab(e, tab) {
  e.stopPropagation();
  openTabs = openTabs.filter(t => t !== tab);
  
  if (activeIdeTab === tab) switchIdeTab(openTabs.length ? openTabs[0] : 'diagram');
  
  renderIdeTabs();
}

function makeTabsHtml(activeTab) {
    let clickFn = 'switchIdeTab';
    let html = `<div class="ide-tab ${activeTab==='diagram'?'active':''}" onclick="${clickFn}('diagram')">Diagram</div>`;
    for (const t of openTabs) {
      let disp = t.startsWith('panel:') ? t.substring(6) : t;
      html += `<div class="ide-tab ${activeTab===t?'active':''}" onclick="${clickFn}('${esc(t).replace(/'/g, "\\'")}')">
        ${esc(disp)} <span class="close-btn" onclick="closeIdeTab(event, '${esc(t).replace(/'/g, "\\'")}')">×</span>
      </div>`;
    }
    
    // Add dropdown menu arrow at the end of tabs for quick access
    let dropdownId = 'ide-dd-left';
    html += `<div style="margin-left:auto; display:flex; align-items:flex-end; padding-bottom:5px;">
        <button onclick="ddToggle('${dropdownId}', event)" style="background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:2px 8px; font-size:10px; cursor:pointer; color:var(--dim);">▾</button>
        <div class="dd" id="dd-${dropdownId}" style="position:absolute; right:10px; top:100%; min-width:150px; z-index:1000; width:0; height:0;"></div>
      </div>`;
    return html;
}

function renderIdeTabs() {
  if($('ide-tabs')) $('ide-tabs').innerHTML = makeTabsHtml(activeIdeTab);
  
  let items = [ {v: 'diagram', label: 'Diagram'} ];
  for (const t of openTabs) {
    items.push({v: t, label: t.startsWith('panel:') ? t.substring(6) : t});
  }
  
  ddSet('ide-dd-left', items, activeIdeTab, (v) => { switchIdeTab(v); });
}

/* Every write to the server goes through here.

   The old pattern was `S = await (await fetch(...)).json()`, which has three
   ways to fail silently. A rejected request returns a JSON error body, and
   assigning it to S replaced the entire design state with {error:"..."} - the
   next render then read S.constraints off an object that has none and threw,
   killing the panel with nothing on screen to say why. A hung request never
   resolved, leaving whatever control was disabled disabled forever. And a
   thrown fetch was an unhandled rejection nobody saw.

   So: never return the server's error as state, always answer, always in
   bounded time. The caller gets {ok:true,data} or {ok:false,error} and decides
   what to show; S is only ever replaced on a success. */
async function post(path, body, ms){
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), ms||30000) : null;
  try{
    const r = await fetch(q(path), {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body),
      signal: ctl?ctl.signal:undefined});
    let data=null;
    try{ data = await r.json(); }catch(e){ data=null; }
    if(!r.ok) return {ok:false, error:(data&&data.error) || ('the server said '+r.status)};
    return {ok:true, data};
  }catch(e){
    return {ok:false, error: (e&&e.name==='AbortError')
      ? 'the server did not answer in time' : 'could not reach the server'};
  }finally{ if(timer) clearTimeout(timer); }
}

/* localStorage is not merely empty in a private window - reading it throws, and
   an uncaught throw up here takes the whole script with it. Nothing kept in it
   (a tab, two pane widths, the theme) is worth a blank page. */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* Our own dropdown. A native <select> renders its popup with the OS chrome,
   which cannot be styled and does not match anything else on the page. */
const DD={};

function ddSet(id, items, value, pick, opts){
  DD[id]={items, value, pick, ...(opts||{})};
  const host=$(id); if(host) host.innerHTML=ddHTML(id);
}

function ddHTML(id){
  const d=DD[id]||{items:[]};
  const cur=d.items.find(x=>String(x.v)===String(d.value));
  return `<div class="dd" id="dd-${id}">
    <button class="dd-t" onclick="ddToggle('${id}',event)">
      <span>${esc(cur?cur.label:(d.placeholder||'—'))}</span><i>▾</i></button>
    <div class="dd-m ${d.right?'right':''}">${d.items.map((x,i)=>
      `<button class="dd-i ${String(x.v)===String(d.value)?'on':''}"
         onclick="ddPick('${id}',${i},event)"><b>${esc(x.label)}</b>${
         x.sub?`<em>${esc(x.sub)}</em>`:''}<span class="tick">✓</span></button>`).join('')}</div></div>`;
}

function ddClose(){ document.querySelectorAll('.dd.open').forEach(e=>e.classList.remove('open')); }

function ddToggle(id,ev){
  ev.stopPropagation();
  const el=$('dd-'+id), was=el.classList.contains('open');
  ddClose(); if(!was) el.classList.add('open');
}

function ddPick(id,i,ev){
  ev.stopPropagation(); ddClose();
  const d=DD[id], item=d.items[i]; if(!item) return;
  d.value=item.v;
  const host=$(id); if(host) host.innerHTML=ddHTML(id);
  if(d.pick) d.pick(item.v);
}

const ddValue=id=>DD[id]?DD[id].value:undefined;
addEventListener('click', ddClose);
addEventListener('keydown', e=>{ if(e.key==='Escape') ddClose(); });

/* ===================== theme =====================
   Three modes. `light` and `dark` pin data-theme on <html>; `auto` removes it
   and lets the stylesheet's prefers-color-scheme block decide, which is also
   what renders correctly before any of this has run. */
const THEMES=['auto','light','dark'];
const THEME_MQ = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;

// what the pre-paint script already applied, so THEME never disagrees with the DOM
let THEME=(()=>{ const t=lsGet('pcbadv.theme'); return THEMES.includes(t)?t:'auto'; })();

// no matchMedia at all (very old browsers) means we cannot tell: assume dark,
// which is what the stylesheet renders when the media query never matches.
const systemTheme = () => (THEME_MQ && THEME_MQ.matches) ? 'light' : 'dark';

function applyTheme(mode){
  THEME = THEMES.includes(mode) ? mode : 'auto';
  if(THEME==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', THEME);
  // cached so the next load paints the right colours before /api/config answers
  lsSet('pcbadv.theme', THEME);
}

/* A choice that forgets itself on reload is not a choice. The cache alone is
   not enough: boot() takes the server's user.theme as authoritative, so a pick
   that never reached the server is overwritten by the default on the next load. */
async function chooseTheme(mode){
  applyTheme(mode);
  try{
    const r=await (await fetch('/api/config',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({set:{'user.theme':mode}})})).json();
    if(r.config) CFG=r.config;
  }catch(e){ /* the colours are already right; the server can catch up later */ }
}

/* In `auto` the colours follow the OS through the media query, with no JS in the
   path. What JS still owes the student is the label: the Theme menu says which
   way auto currently resolves, and that has to keep up. Patching the one text
   node rather than re-rendering keeps an open menu open and keeps focus put. */
function refreshThemeMenu(){
  const d=DD['s-theme']; if(!d) return;
  const auto=d.items.find(x=>x.v==='auto'); if(!auto) return;
  auto.sub='system · now '+systemTheme();
  const em=document.querySelector('#s-theme .dd-i em');
  if(em) em.textContent=auto.sub;
}

if(THEME_MQ){
  const onScheme=()=>{ if(THEME==='auto') refreshThemeMenu(); };
  if(THEME_MQ.addEventListener) THEME_MQ.addEventListener('change', onScheme);
  else if(THEME_MQ.addListener) THEME_MQ.addListener(onScheme);   // older Safari
}

async function loadProjects(){
  const r=await (await fetch('/api/projects')).json();
  if(!PROJ) PROJ=r.default;
  ddSet('projsel', r.projects.map(p=>({v:p.name, label:p.title||p.name,
    sub:`${p.decisions} decisions`})), PROJ, switchTo);
}
const switchTo=n=>{if(n!==PROJ) location.search='?project='+encodeURIComponent(n);};
const switchSession=n=>{if(n!==SESS)
  location.search='?project='+encodeURIComponent(PROJ)+'&session='+encodeURIComponent(n);};

function paintSessions(){
  if(!S) return;
  SESS = S.session;
  const rows=S.sessions||[];
  ddSet('sesssel', rows.map(x=>({v:x.id, label:x.title,
    sub:`${x.messages} message${x.messages===1?'':'s'}`})), S.session, switchSession);
  // always shown: with one conversation the "+" is the only way to start another
  $('sesslab').style.display='';
  $('sessrow').style.display='';
  $('foot').textContent=`${rows.length} conversation${rows.length>1?'s':''}`;
}

async function newSession(){
  const r=await (await fetch(q('/api/sessions/new'),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({})})).json();
  location.search='?project='+encodeURIComponent(PROJ)+'&session='+encodeURIComponent(r.created);
}
async function newProject(){
  const name=prompt('Name the new project:'); if(!name) return;
  const r=await (await fetch('/api/projects/new',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})).json();
  location.search='?project='+encodeURIComponent(r.created);
}

async function load(){
  // this also runs on a three-second timer. A failed poll must leave the last
  // good state on screen - blanking the whole design because a laptop slept or
  // the server restarted is worse than showing something slightly stale.
  let next=null;
  try{
    const r=await fetch(q('/api/state'));
    if(r.ok) next=await r.json();
  }catch(e){ next=null; }
  if(!next || !next.progress) return;
  S=next;
  if(!dirty) sketch=JSON.parse(JSON.stringify(S.sketch||{blocks:[],links:[],confirmed:false}));
  paintSessions(); paint(); drawDiagram();
  $('engine').textContent = S.engine || '';
}

/* ===================== the diagram ===================== */
const KINDS=['power_in','regulation','mcu','digital','sensor','analog','adc','other'];
const BW=158, BH=76, GX=74, GY=26;
let sketch={blocks:[],links:[],confirmed:false}, dirty=false, linkFrom=null, popFor=null;
let zoom=1, panX=0, panY=0, moved=false, bbox={w:0,h:0}, lastShape='';

function isRTL(s){return HEB.test(s||'');}

function layerOf(blocks,links){
  const ids=blocks.map(b=>b.id), pre={}; ids.forEach(i=>pre[i]=[]);
  links.forEach(([a,b])=>{ if(pre[b]&&a!==b&&ids.includes(a)) pre[b].push(a); });
  const L={}; ids.forEach(i=>L[i]=0);
  for(let k=0;k<=ids.length;k++){ let ch=false;
    ids.forEach(i=>{ const w=Math.max(0,...pre[i].map(p=>L[p]+1)); if(w>L[i]){L[i]=w;ch=true;} });
    if(!ch) break; }
  return L;
}

function applyView(){
  $('stage').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  $('zpct').textContent=Math.round(zoom*100)+'%';
  if(popFor) placePop();
}
function clamp(v,a,b){ if(b<a) b=a; return Math.min(b,Math.max(a,v)); }

function fit(manual){
  const c=$('canvas');
  if(!bbox.w){zoom=1;panX=panY=0;return applyView();}
  const pad=34;
  const k=clamp(Math.min((c.clientWidth-pad*2)/bbox.w,(c.clientHeight-pad*2)/bbox.h),0.3,1.25);
  zoom=k;
  panX=(c.clientWidth-bbox.w*k)/2;          // centred, always
  panY=(c.clientHeight-bbox.h*k)/2;
  if(manual) moved=false;
  applyView();
}
function zoomBy(k){
  const c=$('canvas'), cx=c.clientWidth/2, cy=c.clientHeight/2;
  const nz=clamp(zoom*k,0.3,2.5);
  panX=cx-(cx-panX)*(nz/zoom); panY=cy-(cy-panY)*(nz/zoom);
  zoom=nz; moved=true; applyView();
}

/* wheel zooms about the cursor; dragging empty canvas pans */
(function(){
  const c=$('canvas');
  c.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=c.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
    const nz=clamp(zoom*(e.deltaY<0?1.12:1/1.12),0.3,2.5);
    panX=cx-(cx-panX)*(nz/zoom); panY=cy-(cy-panY)*(nz/zoom);
    zoom=nz; moved=true; applyView();
  },{passive:false});

  let sx=0,sy=0,ox=0,oy=0,down=false,shifted=false,draggingBlock=null,bx=0,by=0;
  c.addEventListener('pointerdown',e=>{
    const blk = e.target.closest('.blk');
    if (blk && S.stage === 'sketch') {
       const id = blk.dataset.id;
       const b = sketch.blocks.find(x => x.id === id);
       if (b) {
         draggingBlock = b;
         down = true; shifted = false;
         sx = e.clientX; sy = e.clientY;
         // Compute initial x, y if not already set manually, wait we can just read from style.left
         bx = b.x !== undefined ? b.x : parseInt(blk.style.left, 10);
         by = b.y !== undefined ? b.y : parseInt(blk.style.top, 10);
         c.setPointerCapture(e.pointerId);
         document.body.classList.add('nosel');
         return;
       }
    }
    if(e.target.closest('.blk')||e.target.closest('.pop')) return;
    down=true; shifted=false; sx=e.clientX; sy=e.clientY; ox=panX; oy=panY;
    c.setPointerCapture(e.pointerId); c.classList.add('drag');
    document.body.classList.add('nosel');
  });
  c.addEventListener('pointermove',e=>{
    if(!down) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) shifted=true;
    if (draggingBlock) {
      draggingBlock.x = Math.round(bx + dx/zoom);
      draggingBlock.y = Math.round(by + dy/zoom);
      dirty = true;
      drawDiagram();
    } else {
      panX=ox+dx; panY=oy+dy; moved=true; applyView();
    }
  });
  const up=(e)=>{ 
    if(down&&!shifted&&popFor&&!draggingBlock){popFor=null;drawDiagram();} 
    if(down&&!shifted&&draggingBlock){clickBlock(e, draggingBlock.id);}
    down=false; draggingBlock=null;
    c.classList.remove('drag'); document.body.classList.remove('nosel'); 
  };
  c.addEventListener('pointerup',up); c.addEventListener('pointercancel',up);
})();

/* drag either splitter, IDE style. Widths persist per browser. */
(function(){
  for(const [id, el, key, dir] of [['splitL', 'side', 'pcbadv.wL', 1]]){
    const grip=$(id), pane=document.querySelector('.'+ el);
    const saved=parseInt(lsGet(key)||'0',10);
    if(saved>180) pane.style.width=saved+'px';
    let down=false,sx=0,w0=0;
    grip.addEventListener('pointerdown',e=>{
      down=true; sx=e.clientX; w0=pane.getBoundingClientRect().width;
      grip.setPointerCapture(e.pointerId); grip.classList.add('on');
      document.body.classList.add('nosel');
    });
    grip.addEventListener('pointermove',e=>{
      if(!down) return;
      const vw=document.documentElement.clientWidth||1200;
      pane.style.width=clamp(w0+dir*(e.clientX-sx),200,Math.max(260,vw-480))+'px';
      applyView();
    });
    const up=()=>{ if(down) lsSet(key,
                     Math.round(pane.getBoundingClientRect().width));
                   down=false; grip.classList.remove('on');
                   document.body.classList.remove('nosel'); };
    grip.addEventListener('pointerup',up); grip.addEventListener('pointercancel',up);
  }
  addEventListener('resize', ()=>applyView());
})();

/* What J, U and Q mean on THIS board. A teaching tool that prints reference
   designators and never expands them withholds the one convention the student
   has not met yet - and the diagram is exactly where they first meet it. */
function designHint(){
  const rows=(S.designators||[]);
  if(!rows.length) return '';
  return '  ·  ' + rows.map(r=>`${r.prefix} = ${r.means}`).join(', ');
}

function drawDiagram(){
  const stage=$('stage'), canvas=$('canvas');
  const inSketch = S.stage==='sketch';
  // In cascade stage the sketch is still the spine: the student's blocks with
  // their real kind, and the topology THEY drew. Parts the design questions
  // added are shown, but not wired: we have no idea how they connect, and the
  // list's order is not a circuit. Chaining them here claimed a test point sat
  // in series between a crystal and a debug header.
  const blocks = inSketch ? (sketch.blocks||[])
                          : (S.blocks||[]).map(b=>({id:b.id, label:b.label,
                              kind:b.kind||'built', from:b.from}));
  const links  = inSketch ? (sketch.links||[]) : (S.links||[]);
  $('dtitle').textContent = inSketch
    ? (sketch.confirmed?'Block diagram — confirmed':'Block diagram — click a block to correct it')
    : `Your board — ${S.progress.answered} decisions`;
  $('dhint').textContent = inSketch
    ? (linkFrom ? 'Now click the block it feeds into. Esc to cancel.'
                : 'Click a block to rename it, change its kind, link it or delete it. Click an arrow to remove it.')
    : 'Only the connections you drew are shown. Go back to the sketch to change the structure.'
      + designHint();
  $('sendsketch').style.display = (inSketch&&dirty)?'':'none';

  if(!blocks.length){
    stage.innerHTML=`<div style="color:var(--dim);width:420px;font-size:13.5px">
      Nothing sketched yet. Describe what you want to build, or press <b>+ Block</b>.</div>`;
    stage.style.width='420px'; stage.style.height='60px';
    bbox={w:420,h:60}; if(!moved) fit(); applyView(); return;
  }

  const rtl = blocks.some(b=>isRTL(b.label));
  // Blocks nothing connects to would all land in layer 0 and stack into one
  // very tall column. They are laid out separately, wrapped, under a caption
  // that says why they have no arrows.
  const joined=new Set(); links.forEach(([a,b])=>{joined.add(a);joined.add(b);});
  const wired=blocks.filter(b=>joined.has(b.id));
  const loose=blocks.filter(b=>!joined.has(b.id));

  const L=layerOf(wired,links), cols={};
  wired.forEach(b=>{ (cols[L[b.id]] ||= []).push(b); });
  const keys=Object.keys(cols).map(Number);
  const nc=keys.length?Math.max(...keys)+1:0;
  const maxRows=keys.length?Math.max(...Object.values(cols).map(a=>a.length)):0;
  const pos={};
  Object.entries(cols).forEach(([c,items])=>{
    const col=rtl ? (nc-1-Number(c)) : Number(c);
    const x=col*(BW+GX);
    const span=(items.length-1)*(BH+GY);
    items.forEach((b,i)=>{ pos[b.id]={x, y:(maxRows-1)*(BH+GY)/2 - span/2 + i*(BH+GY)}; });
  });

  let wDiag=Math.max(nc-1,0)*(BW+GX)+(nc?BW:0);
  let hDiag=Math.max(maxRows-1,0)*(BH+GY)+(maxRows?BH:0);
  const LOOSE_COLS=4, looseTop=hDiag+(hDiag?54:0);
  if(loose.length){
    const w=Math.min(LOOSE_COLS, loose.length);
    loose.forEach((b,i)=>{
      const c=i%w, r=Math.floor(i/w);
      pos[b.id]={x:(rtl?(w-1-c):c)*(BW+GX), y:looseTop+r*(BH+GY), loose:true};
    });
    wDiag=Math.max(wDiag, (w-1)*(BW+GX)+BW);
    hDiag=looseTop+(Math.ceil(loose.length/w)-1)*(BH+GY)+BH;
  }
  blocks.forEach(b => {
    if (b.x !== undefined && b.y !== undefined) {
      pos[b.id] = {x: b.x, y: b.y, loose: pos[b.id] ? pos[b.id].loose : false};
      wDiag = Math.max(wDiag, b.x + BW + 40);
      hDiag = Math.max(hDiag, b.y + BH + 40);
    }
  });

  const skips=links.filter(([a,b])=>pos[a]&&pos[b]&&Math.abs((L[b]||0)-(L[a]||0))>1).length;
  const laneH=skips*22+(skips?18:0);

  let wires='', hits='';
  let lane=hDiag+14;
  links.forEach(([a,b],i)=>{
    if(!pos[a]||!pos[b]) return;
    const p=pos[a], r=pos[b], right=r.x>p.x;
    const sx=p.x+(right?BW:0), sy=p.y+BH/2;
    const ex=r.x+(right?0:BW), ey=r.y+BH/2;
    let d;
    if(Math.abs(L[b]-L[a])>1){
      const cx1=p.x+BW/2, cx2=r.x+BW/2;
      d=`M ${cx1} ${p.y+BH} L ${cx1} ${lane} L ${cx2} ${lane} L ${cx2} ${r.y+BH}`;
      lane+=22;
    } else if(Math.abs(sy-ey)<1){ d=`M ${sx} ${sy} L ${ex} ${ey}`; }
    else if(p.x === r.x) { const mx = sx - 40; d=`M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ey}, ${ex} ${ey}`; }
    else { const mx=(sx+ex)/2; d=`M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ey}, ${ex} ${ey}`; }
    wires+=`<path d="${d}" stroke-width="1.6" marker-end="url(#ah)"/>`;
    hits +=`<path class="hit" d="${d}" onclick="dropLink(${i})"><title>click to remove</title></path>`;
  });

  stage.style.width=wDiag+'px'; stage.style.height=(hDiag+laneH)+'px';
  bbox={w:wDiag,h:hDiag+laneH};
  stage.innerHTML=
    `<svg class="wires" width="${wDiag}" height="${hDiag+laneH}">
       <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3"
         orient="auto"><path d="M0,0 L0,6 L8,3 z"/></marker></defs>
       ${wires}${hits}</svg>` +
    (loose.length&&!inSketch
      ? `<div class="loosecap" style="top:${looseTop-30}px;width:${wDiag}px">added by your
         decisions — how these connect is not decided yet</div>` : '') +
    blocks.map(b=>{const pt=pos[b.id];
      return `<div class="blk ${pt.loose?'loose':''} ${popFor===b.id?'sel':''} ${linkFrom===b.id?'linking':''}"
        data-id="${esc(b.id)}" style="left:${pt.x}px;top:${pt.y}px">
        <div dir="auto">${esc(b.label||b.id)}</div>
        <div class="kind">${esc(b.id)} · ${esc(b.kind||'?')}</div></div>`;}).join('');

  // re-fit when the diagram's shape changes, but never fight a manual zoom
  const shapeKey=blocks.map(b=>b.id).join(',')+'|'+links.length+'|'+S.stage;
  if(shapeKey!==lastShape){ lastShape=shapeKey; if(!moved) fit(); }
  applyView();
  if(popFor) openPop(popFor,pos); else closePops();
}

function clickBlock(ev,id){
  ev.stopPropagation();
  if(linkFrom && linkFrom!==id){
    sketch.links.push([linkFrom,id]); linkFrom=null; dirty=true; drawDiagram(); return;
  }
  linkFrom=null; popFor=(popFor===id?null:id); drawDiagram();
}
function dropLink(i){ sketch.links.splice(i,1); dirty=true; drawDiagram(); }

let popAt={x:0,y:0};
/* The popup lives in #canvas, but drawDiagram only rebuilds #stage - so nothing
   ever removed it. With a block selected, the 3-second poll minted a new one on
   every redraw, and clicking away never closed the old ones. */
function closePops(){ document.querySelectorAll('.pop').forEach(e=>e.remove()); }

function placePop(){
  const el=document.querySelector('.pop'); if(!el) return;
  el.style.left=(panX+popAt.x*zoom)+'px';
  el.style.top =(panY+(popAt.y+BH)*zoom+10)+'px';
}
function openPop(id,pos){
  closePops();
  const b=sketch.blocks.find(x=>x.id===id);
  // the block can vanish underneath us - the stage moves on, or an agent
  // rewrites the sketch while the popup is open. Drop the selection, do not throw.
  if(!b || !pos[id]){ popFor=null; return; }
  popAt=pos[id];
  const el=document.createElement('div');
  el.className='pop';
  el.onclick=e=>e.stopPropagation();
  el.innerHTML=`<input id="pl" dir="auto" value="${esc(b.label||'')}" placeholder="label">
    <span id="pk"></span>
    <div class="row"><button onclick="startLink('${id}')">Link →</button>
      <button class="danger" onclick="delBlock('${id}')">Delete</button></div>
    <button style="width:100%;margin-top:7px" onclick="askAbout('${id}')">Ask about this</button>`;
  $('canvas').appendChild(el); placePop();
  // the block kind is what selects which cascade loads, so it is worth a real menu
  ddSet('pk', KINDS.map(k=>({v:k, label:k})), b.kind,
        v=>{ b.kind=v; dirty=true; drawDiagram(); });
  const l=el.querySelector('#pl');
  l.oninput=()=>{b.label=l.value;dirty=true;};
  l.onblur=()=>drawDiagram();
}

/* ---------- ask the advisor about one block ---------- */
let ASK_BLOCK=null;

function askAbout(id){
  ASK_BLOCK=id; popFor=null; drawDiagram();
  paintAskChip(); $('say').focus();
}
function clearAsk(){ ASK_BLOCK=null; paintAskChip(); }
function paintAskChip(){
  const el=$('askchip'); if(!el) return;
  el.innerHTML = ASK_BLOCK
    ? `asking about <b>${esc(ASK_BLOCK)}</b>
       <button onclick="clearAsk()" title="ask about the design instead">✕</button>` : '';
  el.style.display = ASK_BLOCK ? '' : 'none';
}
function startLink(id){ linkFrom=id; popFor=null; drawDiagram(); }
function delBlock(id){
  sketch.blocks=sketch.blocks.filter(b=>b.id!==id);
  sketch.links=sketch.links.filter(([a,b])=>a!==id&&b!==id);
  popFor=null; dirty=true; drawDiagram();
}
function addBlock(){
  let n=1; while(sketch.blocks.some(b=>b.id==='B'+n)) n++;
  sketch.blocks.push({id:'B'+n,kind:'other',label:'new block'});
  dirty=true; popFor='B'+n; drawDiagram();
}
async function sendSketch(){
  $('sendsketch').textContent='…';
  await fetch(q('/api/sketch'),{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({blocks:sketch.blocks,links:sketch.links,confirmed:sketch.confirmed,
      tell_agent:true,
      note:'I edited the block diagram directly — here is the corrected version.'})});
  dirty=false; popFor=null; $('sendsketch').textContent='Send changes to advisor';
  load();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){linkFrom=null;popFor=null;drawDiagram();}});
document.addEventListener('click',()=>{if(popFor){popFor=null;drawDiagram();}});
window.addEventListener('resize',()=>{if(!moved)fit();else applyView();});

function paint(){
  const waiting=(S.progress.waiting_on_agent||0)+(S.progress.waiting_on_student||0);
  const p=S.progress, atBottom = $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight < 120;
  $('stat').textContent = S.stage==='sketch'
    ? 'sketching — confirm the blocks'
    : `${p.answered} decisions · ${p.constraints} constraints` +
      (p.conflicts?` · ${p.conflicts} conflict`:'') +
      (waiting?` · ${waiting} question${waiting>1?'s':''} open`:'');

  let h='';
  for(const m of (S.chat||[])){
    if(m.role==='decision'){
      // a withdrawal reuses this card, and must not be mistaken for a decision:
      // the same green tick over a list of rules that were REMOVED reads as if
      // they had just been added
      const gone=!!m.withdrawn, rules=(m.locked||[]), held=(m.waiting||[]);
      h+=`<div class="msg"><div class="dec${gone?' gone':''}" dir="${bi(m.text)}">
        <div class="head">${gone?'–':'✓'} <b>${txt(m.text)}</b></div>
        ${!gone&&!rules.length&&!held.length?`<div class="nothing">Nothing follows from this in the
          design questions I have — if your case is unusual, say so and I will tell you
          what I cannot cover.</div>`:''}
        ${!gone&&held.length?`<div class="nothing">${held.length===1?'One rule follows':
          held.length+' rules follow'} from this, but only once your board has
          ${esc(held.map(w=>w.needs||w.needs_block).filter((v,i,a)=>a.indexOf(v)===i).join(' and '))}.
          Nothing is hidden from you — ask and I will read them out.</div>`:''}
        ${gone&&rules.length?`<div class="lost">These no longer apply to your board:</div>`:''}
        ${rules.length?`<div class="locked">${rules.map(l=>
          `<div class="lk" dir="${bi(l.text)}"><span class="tag">${l.icon}${l.verified?'':' unverified'}</span>${txt(l.text)}</div>`
        ).join('')}</div>`:''}
      </div></div>`;
    } else {
      h+=`<div class="msg ${m.role==='agent'?'advisor':'you'}">
        <div class="who">${m.role==='agent'?'advisor':'you'}</div>
        ${m.block?`<div class="about">about ${esc(m.block)}</div>`:''}
        <div class="bubble" dir="${bi(m.text)}">${txt(m.text)}</div></div>`;
    }
  }
  // the live question sits at the end of the conversation, with its answers attached
  if(S.open && S.open.length){
    const n=S.open[0];
    // A question can want a number rather than a choice. "How long must it run"
    // has no shortlist of right answers, which is why it was never asked.
    const q=n.answer;
    h+=`<div class="ask" dir="${bi(n.question)}"><div class="q">${txt(n.question)}</div>
      <div class="why">${txt(n.why||'')}</div>` + (q
      ? `<div class="qty">
           <input id="qty-in" type="number" inputmode="decimal" step="any"
             ${q.min!=null?`min="${q.min}"`:''} ${q.max!=null?`max="${q.max}"`:''}
             placeholder="${esc(q.hint||'')}"
             onkeydown="if(event.key==='Enter')answerQty('${esc(n.id)}')">
           <span class="unit">${esc(q.unit||'')}</span>
           <button onclick="answerQty('${esc(n.id)}')">Record</button>
           ${QTY_ERR?`<div class="thr-err" dir="auto">${esc(QTY_ERR)}</div>`:''}</div>`
      : `<div class="opts">` +
        (n.options||[]).map(o=>`<button class="opt" dir="${bi(o.label)}" onclick="answer('${n.id}','${o.id}')">
          ${txt(o.label)}${optWeight(o)}
        </button>`).join('') + `</div>`) + `</div>`;
  }
  if(busy) h+=`<div class="msg advisor"><div class="thinking"><i></i>the advisor is working…</div></div>`;
  if(!h) h=`<div class="empty">Describe what you want to build.<br>
    The advisor will sketch it back to you, then walk you through the decisions.</div>`;
  $('wrap').innerHTML=h;
  if(atBottom) $('log').scrollTop=$('log').scrollHeight;

  renderPanel();
}

function showPanel(tab){ 
  TAB=tab; 
  lsSet('pcbadv.tab',tab); 
  if(tab==='chat') { $('sbody').style.display='none'; $('chatPane').style.display='flex'; }
  else { $('sbody').style.display='block'; $('chatPane').style.display='none'; }
  renderPanel(true); 
}

let PANEL_SHOWN=null;

function renderPanel(force){
  if(!S) return;
  // sbody can live in the main area (a panel opened from the gear or the ↗).
  // The poll renders with the rail's TAB, which would wipe it blank, so render
  // the panel it is actually hosting.
  const host=$('ide-content-left');
  if(host && host.contains($('sbody')) && activeIdeTab.startsWith('panel:')){
    const hosted=activeIdeTab.substring(6);
    if(hosted!=='chat' && hosted!==TAB){
      const old=TAB; TAB=hosted;
      try{ return renderPanel(force); } finally{ TAB=old; }
    }
  }
  // The state polls every few seconds. Re-rendering under someone's hands would
  // shut an open menu and wipe half-typed text, so while they are working in
  // the panel, leave it alone.
  //
  // `force` is for the panel's own buttons. The guard is against the POLL, not
  // against the student: without it a Cancel clicked from inside the field it
  // cancels did nothing, and an error about the field you are typing in could
  // never be drawn - the one moment it most needs to be.
  // and it is TYPING that must be protected, not focus. A clicked button keeps
  // focus inside the panel, so testing for focus alone froze the whole rail
  // after every button press until the student happened to click elsewhere.
  const el = document.activeElement;
  const typing = el && $('sbody').contains(el)
              && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !el.disabled;
  if(!force && (typing || document.querySelector('.dd.open')) && PANEL_SHOWN===TAB) return;

  for(const t of ['chat','decisions','constraints','sources','memory','settings'])
    $('t-'+t).classList.toggle('on', t===TAB);
  const w=(S.progress.waiting_on_agent||0)+(S.progress.waiting_on_student||0);
  $('t-constraints').innerHTML='Constraints'+(w?`<span class="badge">${w}</span>`:'');
  let h='';
  if(TAB==='decisions'){
    // a 300px rail is too narrow for a table; one card per row reads better
    // Two kinds, kept apart. A student who cannot tell an architecture choice
    // from a ten-second yes is looking at fourteen rows of equal weight, and
    // the ones that taught them something are lost in the ones that did not.
    const mine=(S.answered||[]).filter(n=>n.chosen_by!=='corpus');
    const forYou=(S.answered||[]).filter(n=>n.chosen_by==='corpus');
    h = mine.length ? mine.map(n=>{
        const o=(n.options||[]).find(x=>x.id===n.chosen)||{};
        return `<div class="card">
          <div class="q" dir="auto">${txt(n.question)}</div>
          <div class="a" dir="auto">${txt(n.chosen_label||o.label||n.chosen)}</div>
          ${restsOn(n)}
          <div class="foot"><span class="pill">${esc(n.domain)}</span>${badge(n.id)}
            ${DROPPING===n.id?''
              :`<span class="drop" onclick="askDrop('${esc(n.id)}')">no longer relevant</span>`}</div>
          ${dropRow(n.id)}${thread(n.id)}</div>`;}).join('')
      : `<div class="empty">Nothing decided yet.</div>`;
    if(forYou.length) h += forYouHTML(forYou);
    // what the student took out. Visible, with the reason, and reversible -
    // an edit you cannot see or undo is one nobody dares make.
    const gone=(S.irrelevant||[]).filter(n=>n.withdrawn);
    if(gone.length) h += `<div class="gone-head">Not part of this board</div>` +
      gone.map(n=>`<div class="card gone">
        <div class="q" dir="auto">${txt(n.question)}</div>
        <div class="a" dir="auto">${txt(n.reason||'')}</div>
        <div class="foot"><span class="pill">${esc(n.domain)}</span>${badge(n.id)}
          <span class="drop" onclick="reinstate('${esc(n.id)}')">it does apply after all</span></div>
        ${thread(n.id)}</div>`).join('');
  }
  if(TAB==='constraints'){
    h = (S.conflicts||[]).map(c=>`<div class="conflict"><b>Conflict</b> — ${esc(c.note)}</div>`).join('');
    h += S.constraints.length ? S.constraints.map(c=>{const s=c.source||{};
        return `<div class="card">
          <div dir="auto">${txt(c.text)}</div>
          ${s.quote?`<div class="quote">“${esc(s.quote)}”</div>`:''}
          ${c.calculation?`<div class="quote">${esc(c.calculation)}</div>`:''}
          <div class="foot">
            <span class="pill ${c.verified?'':'u'}">${c.icon} ${esc(c.provenance_label||c.provenance)}${c.verified?'':' · unverified'}</span>
            ${badge(c.id)}</div>
          <div class="meta">from ${esc(c.from_label)}${s.doc?' · ':''}
            ${s.url?`<a href="${esc(s.url)}" target="_blank">${esc(s.doc)}</a>`:esc(s.doc||'')}
            ${esc(s.locator||'')}</div>
          ${thread(c.id)}</div>`;}).join('')
      : `<div class="empty">Constraints appear as you decide.</div>`;
  }
  if(TAB==='sources'){
    const datasheets = (S.sources||[]).filter(f => f.name.toLowerCase().endsWith('.pdf') || f.name.toLowerCase().endsWith('.csv'));
    const outputs = (S.sources||[]).filter(f => !f.name.toLowerCase().endsWith('.pdf') && !f.name.toLowerCase().endsWith('.csv'));
    
    const renderSrc = (f) => `<div>
      <div class="srcrow"><span>${f.name.endsWith('.pdf')?'📄':'📘'}</span>
      <span class="g">${esc(f.name)}</span><span class="pill">${esc(f.scope)}</span>
      <a href="javascript:void(0)" onclick="openInIde('${esc(f.name).replace(/'/g, "\\'")}')">open</a>
      <a href="javascript:void(0)" onclick="askSrc('${esc(f.name).replace(/'/g, "\\'")}')" style="margin-left:8px;">ask</a>
      <a href="javascript:void(0)" onclick="deleteSource('${esc(f.name).replace(/'/g, "\\'")}')" style="color:var(--warn-ink); margin-left:8px;">delete</a></div>
      ${ASKING_SRC === f.name ? `
        <div style="display:flex; gap:8px; margin: 0 14px 14px 34px;">
          <input id="src-q-${esc(f.name).replace(/[^a-zA-Z0-9]/g, '_')}" style="flex:1; background:var(--card); border:1px solid var(--line); border-radius:7px; padding:7px 9px; color:var(--ink); font-size:13px;" placeholder="Ask about this document..." onkeydown="if(event.key==='Enter') sendSrcQ('${esc(f.name).replace(/'/g, "\\'")}')">
          <button onclick="sendSrcQ('${esc(f.name).replace(/'/g, "\\'")}')">Ask</button>
        </div>` : ''}
      </div>`;

    h = `<details open style="margin-bottom:12px;"><summary style="cursor:pointer; font-weight:bold; margin-bottom:8px;">Datasheets</summary>` + 
        (datasheets.length ? datasheets.map(renderSrc).join('') : `<div class="empty" style="margin-top:0">No datasheets yet.</div>`) + 
        `</details>`;
    h += `<details open style="margin-bottom:12px;"><summary style="cursor:pointer; font-weight:bold; margin-bottom:8px;">Outputs</summary>` + 
        (outputs.length ? outputs.map(renderSrc).join('') : `<div class="empty" style="margin-top:0">No outputs yet.</div>`) + 
        `</details>`;
    h += `<div class="tools"><input type="text" id="srcurl" placeholder="https://…/datasheet.pdf">
      <button onclick="fetchSrc()">Fetch</button>
      <button onclick="document.getElementById('up').click()">Upload</button>
      <input type="file" id="up" style="display:none" onchange="upload(this)"></div>`;
  }
  if(TAB==='components'){
    const isEdit = window.BOM_EDIT_MODE;
    if(isEdit) {
      h = `<div class="empty" style="text-align:left">Editing Bill of Materials (BOM.md).</div>
        <textarea id="bom-text" dir="auto" style="width:100%;min-height:280px;background:var(--field);
          color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;
          font:13px/1.55 ui-monospace,monospace">${esc(S.bom||'')}</textarea>
        <div class="tools">
          <button onclick="saveBom()">Save BOM</button>
          <button onclick="window.BOM_EDIT_MODE=false; renderPanel(true)" style="background:transparent; border:1px solid var(--line); color:var(--dim);">Cancel</button>
        </div>`;
    } else {
      h = `<div class="empty" style="text-align:left">Bill of Materials (BOM.md). The advisor updates this automatically.</div>
        <div style="background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px;">
          ${renderMarkdown(S.bom||'')}
        </div>
        <div class="tools"><button onclick="window.BOM_EDIT_MODE=true; renderPanel(true)">Edit Raw Text</button></div>`;
    }
  }
  if(TAB==='memory'){
    // what this conversation would otherwise forget. The student owns it.
    h = `<div class="empty" style="text-align:left">This conversation's memory. The advisor
      rewrites it every few messages, and it is sent with every turn. Decisions are not
      repeated here — they are already sent in full. You can edit it.</div>
      <textarea id="mem" dir="auto" style="width:100%;min-height:280px;background:var(--field);
        color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;
        font:13px/1.55 ui-monospace,monospace">${esc(S.memory||'')}</textarea>
      <div class="tools"><button onclick="saveMemory()">Save</button>
      <button onclick="rewriteMemory()">Rewrite now</button>
      <span class="meta" id="memlen"></span></div>`;
  }
  if(TAB==='settings') h=settingsHTML();
  $('sbody').innerHTML=h;
  if(TAB==='settings') settingsDropdowns();
  if(TAB==='memory') memlen();
  PANEL_SHOWN=TAB;
}

/* A thread hangs on a design element, not on a conversation: it is everything
   ever said about THIS constraint, in any session. */
let OPEN_THREAD=null, CLOSING=null, THREAD_ERR=null;

function badge(id){
  const t=(S.threads||{})[id];
  const said=t?(t.messages||[]).filter(m=>m.role!=='resolved').length:0;
  const cls=t&&t.waiting_on?'wait':(t&&t.still_live?'ack':(t&&t.resolved?'done':''));
  const label=said?`💬 ${said}`+(t.waiting_on?' · waiting on '+t.waiting_on
                                :(t.still_live?' · noted':'')):'ask';
  return `<span class="ask-badge ${cls}" onclick="toggleThread('${esc(id)}')">${label}</span>`;
}

function thread(id){
  if(OPEN_THREAD!==id) return '';
  const t=(S.threads||{})[id]||{messages:[]};
  const body=(t.messages||[]).filter(m=>m.role!=='resolved')
    .map(m=>`<div class="m" dir="${bi(m.text)}"><b>${esc(m.role)}</b>${txt(m.text)}</div>`).join('')
    || `<div class="m" style="color:var(--dim)">Nothing asked about this yet.</div>`;
  const mine = THREAD_ERR && THREAD_ERR.anchor===id;
  const err = mine ? `<div class="thr-err" dir="auto">${esc(THREAD_ERR.text)}</div>` : '';
  const draft = mine ? (THREAD_ERR.draft||'') : '';
  // Closing a discussion says what settled it, and says so plainly when the
  // thing discussed is still in the design - "we talked about it" is not
  // "we fixed it", and the old one-click close could not tell them apart.
  const settled = t.resolved
    ? `<div class="settled" dir="auto">Settled — ${txt(t.resolution||'')}
       ${t.still_live?`<div class="still">This is still part of your design; closing
         the discussion did not change it.</div>`:''}</div>` : '';

  if(CLOSING===id) return `<div class="thr">${body}${settled}${err}
    <div class="row"><input id="thr-why" dir="auto" value="${esc(draft)}"
      placeholder="What settled it?" onkeydown="if(event.key==='Enter')resolveThread('${esc(id)}')">
      <button onclick="resolveThread('${esc(id)}')">Done</button>
      <button onclick="closeReason(null)">Cancel</button></div></div>`;

  return `<div class="thr">${body}${settled}${err}
    <div class="row"><input id="thr-in" dir="auto" value="${esc(draft)}"
      placeholder="Ask about this…" onkeydown="if(event.key==='Enter')postThread('${esc(id)}')">
      <button onclick="postThread('${esc(id)}')">Ask</button>
      ${t.messages&&t.messages.length&&!t.resolved
        ? `<button onclick="closeReason('${esc(id)}')">Resolve</button>`:''}</div></div>`;
}

/* Questions the corpus answered, because they have one defensible answer and a
   student stopped by them learns nothing. Collapsed, not hidden: the whole
   design is that this is browsable rather than blocking. Someone who wants to
   know what decoupling is opens it and reads one line, instead of being held up
   by a question whose vocabulary they do not have yet.

   Which makes each `why` load-bearing. Those sentences are the teaching surface
   now, not a footnote. A default whose reason is not worth reading should have
   stayed a question. */
let SHOW_FOR_YOU=false, CHANGING=null;

function forYouHTML(rows){
  const body = SHOW_FOR_YOU ? rows.map(n=>{
    const o=(n.options||[]).find(x=>x.id===n.chosen)||{};
    return `<div class="card corpus">
      <div class="q" dir="auto">${txt(n.question)}</div>
      <div class="a" dir="auto">${txt(o.label||n.chosen)}</div>
      <div class="why" dir="auto">${esc(n.default_icon||'')} ${txt(n.default_why||'')}</div>
      <div class="foot"><span class="pill">${esc(n.default_provenance||'convention')}</span>
        ${badge(n.id)}
        ${CHANGING===n.id?''
          :`<span class="drop" onclick="changeThis('${esc(n.id)}')">change this</span>`}</div>
      ${CHANGING===n.id?`<div class="droprow">${(n.options||[])
        .filter(x=>x.id!==n.chosen)     // the one it already is, is not a choice
        .map(x=>`<button onclick="answer('${esc(n.id)}','${esc(x.id)}')"
          >${esc(x.label)}</button>`).join('')}
        <button onclick="changeThis(null)">Cancel</button></div>`:''}
      ${thread(n.id)}</div>`;}).join('') : '';
  return `<div class="gone-head foryou" onclick="toggleForYou()">
      ${SHOW_FOR_YOU?'▾':'▸'} Decided for you (${rows.length})</div>${body}`;
}

function toggleForYou(){ SHOW_FOR_YOU=!SHOW_FOR_YOU; CHANGING=null; renderPanel(true); }
function changeThis(id){ CHANGING=id; renderPanel(true); }

/* A decision is not withdrawn along with the question it was built on - that
   would delete work nobody asked to undo. But it was decided on a premise that
   has since gone, and silence is how a board keeps carrying rules nobody would
   choose again. Say it on the card and leave the choice with them. */
function restsOn(n){
  const on=(n.rests_on||[]); if(!on.length) return '';
  const name=id=>{
    const g=(S.irrelevant||[]).find(x=>x.id===id);
    return g ? (g.question||id) : id;
  };
  return `<div class="stale" dir="auto">Decided back when “${esc(name(on[0]))}”
    still applied to your board. Worth a second look.</div>`;
}

function toggleThread(id){
  OPEN_THREAD = OPEN_THREAD===id ? null : id;
  CLOSING=null; THREAD_ERR=null; renderPanel(true);
}

function closeReason(id){ CLOSING=id; THREAD_ERR=null; renderPanel(true);
  const el=$('thr-why'); if(el) el.focus(); }

async function postThread(id){
  const el=$('thr-in'); const text=(el?el.value:'').trim(); if(!text) return;
  el.disabled=true; el.blur(); THREAD_ERR=null; renderPanel(true);
  const r=await post('/api/message',{anchor:id,text,role:'user'});
  // a rejected request used to be assigned straight into S, replacing the whole
  // design with {error:"..."}. The question stays in the box instead.
  if(r.ok){ await load(); renderPanel(true); }
  else { THREAD_ERR={anchor:id, draft:text,
           text:'Not sent — '+r.error+'. Nothing was saved; try again.'}; renderPanel(true); }
}

async function resolveThread(id){
  const el=$('thr-why'); const why=(el?el.value:'').trim();
  if(!why){ THREAD_ERR={anchor:id, draft:'', text:'Say what settled it, in a few words.'};
            return renderPanel(true); }
  el.disabled=true; el.blur(); THREAD_ERR=null;
  const r=await post('/api/thread/resolve',{anchor:id, text:why});
  if(r.ok){ CLOSING=null; OPEN_THREAD=null; await load(); renderPanel(true); }
  else { THREAD_ERR={anchor:id, draft:why, text:'Not saved — '+r.error}; renderPanel(true); }
}

/* Taking a question out of the design, and putting it back. Both are appends:
   decisions.jsonl still shows the answer was given and why it stopped applying,
   so this is an edit the student can make without destroying the record. */
let DROPPING=null, DROP_ERR=null;

function askDrop(id){ DROPPING=id; DROP_ERR=null; renderPanel(true);
  const el=$('drop-why'); if(el) el.focus(); }

function dropRow(id){
  if(DROPPING!==id) return '';
  return `<div class="droprow">
    <input id="drop-why" dir="auto" placeholder="Why doesn't it apply to your board?"
      onkeydown="if(event.key==='Enter')doDrop('${esc(id)}')">
    <button onclick="doDrop('${esc(id)}')">Remove</button>
    <button onclick="askDrop(null)">Cancel</button>
    ${DROP_ERR?`<div class="thr-err" dir="auto">${esc(DROP_ERR)}</div>`:''}</div>`;
}

async function doDrop(id){
  const el=$('drop-why'); const why=(el?el.value:'').trim();
  if(!why){ DROP_ERR='Say why, so this is still readable in a month.'; return renderPanel(true); }
  el.disabled=true; el.blur(); DROP_ERR=null;
  const r=await post('/api/retract',{node:id, why, by:'user'});
  if(r.ok){ DROPPING=null; await load(); renderPanel(true); }
  else { DROP_ERR='Not saved — '+r.error; renderPanel(true); }
}

async function reinstate(id){
  const r=await post('/api/reopen',{node:id, by:'user'});
  if(r.ok){ await load(); renderPanel(true); }
  else { DROP_ERR='Not saved — '+r.error; renderPanel(true); }
}

function settingsDropdowns(){
  const u=CFG.user||{}, a=CFG.agent||{};
  ddSet('s-language', [{v:'auto',label:'auto',sub:'follow what you type'},
                       {v:'en',label:'English'},{v:'he',label:'עברית'}],
        u.language||'auto', null, {right:true});

// a model belongs to one engine, so the list follows the provider picked
function modelDropdown(engine, current){
  const e=(CFG.engines||[]).find(x=>x.id===engine)||{};
  const items=(e.models||[]).map(m=>({v:m.id,label:m.name||m.id}));
  const keep=items.some(x=>x.v===current)?current:(items[0]&&items[0].v)||'';
  ddSet('s-model', items, keep, null, {right:true});
}

const val=id=>{
  const e=$(id);
  if(DD[id]) return ddValue(id);
  return e ? (e.type==='checkbox'?e.checked:e.value) : undefined;

async function saveBoard(){

async function savePrefs(btn){
  const oldText = btn.textContent;
  btn.textContent = 'Saving...';
  const r=await (await fetch('/api/config',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({set:{
      'user.language':val('s-language'), 'user.units':val('s-units'),
      'user.theme':val('s-theme')||THEME,
      'user.show_unverified':val('s-show_unverified'),

/* An option's price is rarely only in `costs`. It is also the parts it adds and
   the rules it locks in - and an option with none of those rendered bare read as
   free next to one with a red line under it. Every option now carries its weight,
   and `note` is neutral: reassurance should not wear the same alarm red as a hazard. */
function optWeight(o){
  // Weight comes from the structural fields first, because an author cannot
  // forget to add a part or a rule - they CAN forget to write a cost, and in
  // this corpus they usually did on whichever option they preferred. `costs`
  // and `note` are the nuance the counts cannot express, not a verdict.
  const parts=(o.blocks||[]).map(b=>(b.label||b.id).replace(/\n/g,' '));
  const locks=(o.locks||[]).length;
  const weigh=[];
  if(parts.length) weigh.push(`adds ${parts.map(esc).join(', ')}`);
  if(locks)        weigh.push(`${locks} rule${locks>1?'s':''} follow${locks>1?'':'s'}`);
  if(!weigh.length) weigh.push('adds nothing');
  const nuance=[...(o.costs||[]), ...(o.note?[o.note]:[])];
  return `<div class="weigh">${weigh.join(' · ')}</div>` +
         (nuance.length?`<div class="nuance">${nuance.map(txt).join(' · ')}</div>`:'');
}

function memlen(){
  const el=$('mem'); if(!el) return;
  $('memlen').textContent = el.value.length + ' characters';
  el.oninput = () => $('memlen').textContent = el.value.length + ' characters';
}

async function saveMemory(){
  const r=await (await fetch(q('/api/memory'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:$('mem').value})})).json();
  if(r.trimmed) alert('Saved, but it was over the limit and was trimmed.');

async function saveBom(){
  const r=await (await fetch(q('/api/bom'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:$('bom-text').value})})).json();

async function rewriteMemory(){

    const r=await (await fetch(q('/api/memory'),{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({})})).json();
    if(r.rewritten && !r.rewritten.ok) alert(r.rewritten.reason||'could not rewrite');
  } finally { b.disabled=false; b.textContent='Rewrite now'; await load(); renderPanel(); }
}

let QTY_ERR=null;

/* A typed number. The server checks it against the unit and range the question
   declares, because decisions.jsonl is append-only and "about a year" written
   into it once is written into it for good. */
async function answerQty(node){
  const el=$('qty-in'); const raw=(el?el.value:'').trim();
  if(!raw){ QTY_ERR='Type a number.'; return paint(); }
  el.disabled=true; QTY_ERR=null;
  const r=await post('/api/answer',{node, value:raw, by:'user'});
  if(r.ok) return load();
  QTY_ERR=r.error; paint();
}

async function answer(node,value){
  QTY_ERR=null;
  const r=await post('/api/answer',{node,value,by:'user'});
  if(r.ok) return load();
  if(S){ S.chat=[...(S.chat||[]), {role:'agent',
    text:'That answer did not reach the server — '+r.error+'. Nothing was recorded, so pick it again.'}];
    paint(); }
}
async function send(){
  const el=$('say'), text=el.value.trim(); if(!text||busy) return;
  const block=ASK_BLOCK;
  busy=true; $('sendbtn').textContent='…'; el.value=''; clearAsk();

  // A reply takes ten to twenty-five seconds. Waiting for the round trip before
  // showing anything meant your own message vanished and nothing replaced it -
  // the tool looked broken rather than busy. Show it now; load() replaces the
  // whole log with the server's copy when the answer lands.
  if(S){ S.chat=[...(S.chat||[]), {role:'user', text, block, ts:new Date().toISOString()}];
         paint(); }

  let failed=false;
  try{
    const r=await fetch(q('/api/chat'),{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, block})});
    failed=!r.ok;
  }catch(e){ failed=true; }
  finally{
    busy=false; $('sendbtn').textContent='Send';
    if(failed && S){ S.chat=[...(S.chat||[]),
      {role:'agent', text:'That did not reach the advisor. Your message is not saved — try again.'}];
      paint(); }
    else load();
  }
}
async function deleteSource(name) {
  if (!confirm(`Delete source: ${name}?`)) return;
  const r = await post('/api/delete_source', {name});
  if(r.error) alert(r.error); else load();
}
async function fetchSrc(){
  const u=$('srcurl').value.trim(); if(!u) return; $('srcurl').value='';
  const r=await (await fetch(q('/api/fetch_source'),{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})})).json();
  if(r.error) alert(r.error); load();
}
function upload(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async()=>{ await fetch(q('/api/upload'),{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:f.name,data_b64:rd.result.split(',')[1]})});
    input.value=''; load(); };
  rd.readAsDataURL(f);
}

document.addEventListener('paste', (e) => {
  if (TAB !== 'chat') return;
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let index in items) {
    const item = items[index];
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const name = `screenshot_${Date.now()}.png`;
      const rd = new FileReader();
      rd.onload = async () => {
        const r = await fetch(q('/api/upload'), {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name, data_b64: rd.result.split(',')[1]})
        });
        if (r.ok) {
          const el = $('say');
          const prefix = el.value ? el.value + '\n\n' : '';
          el.value = prefix + `![screenshot](sources/${name})`;
        } else {
          alert('Failed to upload image.');
        }
      };
      rd.readAsDataURL(blob);
    }
  }
});
let ASKING_SRC = null;
function askSrc(name) {
  ASKING_SRC = ASKING_SRC === name ? null : name;
  renderPanel(true);
}
function sendSrcQ(name) {
  const safeId = name.replace(/[^a-zA-Z0-9]/g, '_');
  const el = $('src-q-' + safeId);
  if (!el || !el.value.trim()) return;
  const q = el.value.trim();
  const text = `Please answer based on the attached file: [${name}](sources/${name})\n\n${q}`;
  
  ASKING_SRC = null;
  TAB = 'chat';
  showPanel(TAB);
  
  const chatEl = $('say');
  if (chatEl) {
    chatEl.value = text;
    send();
  }
}

async function boot(){
  TAB=lsGet('pcbadv.tab')||'chat';
  showPanel(TAB);
  try{ CFG=await (await fetch('/api/config')).json(); }catch(e){ CFG=null; }
  if(CFG && CFG.user) applyTheme(CFG.user.theme);
  const c=(CFG&&CFG.corpus)||{};
  if(c.status && c.status!=='authored' && c.note){
    $('demobar').innerHTML=`<b>Demonstration content.</b> ${esc(c.note)}`;
    $('demobar').style.display='';
  }
  await loadProjects();
  switchIdeTab(activeIdeTab);
  await load();
  setInterval(()=>{if(!busy)load();},3000);
}
boot();
</script>
