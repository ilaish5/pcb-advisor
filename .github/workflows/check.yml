name: check

on:
  push:
  pull_request:

jobs:
  test:
    # Altium only runs on Windows, so that is where most students run this.
    # The authors are on macOS. All three have to pass.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-dev.txt
      - name: nothing is broken
        run: python -m pytest tests/ -q

      - name: the worked example builds and checks
        run: |
          python pcb.py init
          python pcb.py seed
          python pcb.py check
