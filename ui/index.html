<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">
<script src="/ui/js/theme-boot.js"></script>
<script src="/ui/diagram.js"></script>
<link rel="stylesheet" href="/ui/styles/core.css">
<link rel="stylesheet" href="/ui/styles/base.css">
<link rel="stylesheet" href="/ui/styles/shell.css">
<link rel="stylesheet" href="/ui/styles/chat.css">
<link rel="stylesheet" href="/ui/styles/bom.css">
<link rel="stylesheet" href="/ui/styles/previews.css">
<link rel="stylesheet" href="/ui/styles/inspector.css">
<link rel="stylesheet" href="/ui/styles/idea.css">
<link rel="stylesheet" href="/ui/styles/rules.css">
<link rel="stylesheet" href="/ui/styles/checks.css">
<link rel="stylesheet" href="/ui/styles/outputs.css">
<link rel="stylesheet" href="/ui/styles/pages.css">
<link rel="stylesheet" href="/ui/styles/viewer.css">
</head>
<body>
<div class="app" id="app" data-view="work">
  <!-- LEFT: chat -->
  <section class="panel chat" aria-label="Chat with the agent">
    <div class="chead">
      <button class="convbtn" data-act="convs" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.6" fill="none"/></svg><span id="convtitle">Conversation</span></button>
      <button class="newbtn" data-act="new">+ New</button>
    </div>
    <div class="convs" id="convs" hidden></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="composer">
      <div class="sugs" id="sugs"></div>
      <div class="chat-chip" id="chat-chip" hidden></div>
      <form class="inrow" id="form">
        <textarea id="input" rows="1" dir="auto" placeholder="Message the agent… (Enter to send)"></textarea>
        <button class="btn pri" type="submit" id="sendbtn">Send</button>
      </form>
    </div>
  </section>

  <div class="splitter" id="splitter-chat" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize chat panel (Enter to toggle, arrow keys to resize)" aria-label="Resize chat panel"></div>

  <!-- CENTER: main screen -->
  <section class="panel work" aria-label="Workspace">
    <div class="whead" id="whead"></div>
    <div class="editor-groups-container" id="editor-groups-container">
      <div class="editor-group active" id="group-g1" data-group-id="g1">
        <div class="editor-tabs-bar" id="tabs-bar-g1">
          <div class="editor-tabs" role="tablist" aria-label="Editor tabs group 1"></div>
          <div class="editor-group-actions">
            <button type="button" class="editor-split-btn" data-act="split-editor" aria-label="Split editor" title="Split editor (⇆)">⇆</button>
          </div>
        </div>
        <div class="editor-group-body">
          <div class="drop-zone drop-zone-left" hidden>Drop to split left</div>
          <div class="drop-zone drop-zone-right" hidden>Drop to split right</div>
          <div class="view editor-content" id="view" data-group-id="g1"></div>
        </div>
      </div>
    </div>
    <aside class="detail" id="detail" hidden></aside>
    <aside class="viewer" id="viewer" hidden aria-label="File viewer"></aside>
  </section>

  <div class="splitter" id="splitter-nav" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize navigation panel (Enter to toggle, arrow keys to resize)" aria-label="Resize navigation panel"></div>

  <!-- RIGHT: navigation -->
  <nav class="nav" aria-label="Navigation" id="nav"></nav>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filepick" hidden>
<input type="file" id="dfmpick" accept=".pdf" hidden>

<script src="/ui/js/kit.js"></script>
<script src="/ui/js/core.js"></script>
<script src="/ui/js/shell.js"></script>
<script src="/ui/js/chat.js"></script>
<script src="/ui/js/views/idea.js"></script>
<script src="/ui/js/views/bom.js"></script>
<script src="/ui/js/views/previews.js"></script>
<script src="/ui/js/views/inspector.js"></script>
<script src="/ui/js/views/rules.js"></script>
<script src="/ui/js/views/checks.js"></script>
<script src="/ui/js/views/outputs.js"></script>
<script src="/ui/js/views/pages.js"></script>
<script src="/ui/js/viewer.js"></script>
<script src="/ui/js/boot.js"></script>

</body>
</html>
