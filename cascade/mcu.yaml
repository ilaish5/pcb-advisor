version: 2
domain: mcu
title: "Microcontroller"
blocks: [mcu, digital]

nodes:
  - id: mcu.clock
    type: decision
    question: "Where does the clock come from?"
    why: "The clock choice decides whether you inherit a crystal's placement rules at all."
    options:
      - id: internal_rc
        label: "Internal RC oscillator"
        costs: ["typically 1-2% accuracy - not good enough for UART at high rates or for timekeeping"]
      - id: crystal
        label: "External crystal"
        costs: ["two more parts", "strict placement rules"]
        locks:
          - id: mcu.xtal.place
            text: "Crystal and its load capacitors go within a few millimetres of the pins, with a local ground under them and no other traces crossing."
            provenance: check_your_part
            source: {doc: "MCU hardware design guide", locator: "Oscillator layout"}
          - id: mcu.xtal.guard
            text: "Guard the oscillator area with ground and keep switching nodes away from it. It is a high-impedance analog circuit wearing a digital costume."
            provenance: convention
        blocks: [{id: Y1, label: "Y1\ncrystal", order: 52}]

  - id: mcu.decoupling
    type: decision
    question: "Decoupling strategy?"
    why: "The most commonly skipped step, and the one that produces the most mysterious faults."
    default:
      option: per_pin
      why: "One 100 nF capacitor at every supply pin. There is no digital board where this is the wrong answer, and skipping it is the most common cause of faults that look random."
      provenance: convention
    options:
      - id: per_pin
        label: "100 nF at every VDD pin"
        locks:
          - id: mcu.decap.place
            text: "One 100 nF per supply pin, on the same side as the pin, with the shortest possible path to the ground plane. A capacitor on the far side of the board is decoration."
            provenance: convention
      - id: bulk_only
        label: "One bulk capacitor"
        costs: ["leaves each pin exposed to its own switching transients"]

  - id: mcu.program
    type: decision
    question: "How do you program and debug it?"
    why: "A board you cannot reflash is a paperweight. This is decided at placement, not after."
    default:
      option: header
      why: "A debug header costs four pads and is how you get a program onto the board and see why it is not running. Drop it only when the board is too small to hold one."
      provenance: convention
    options:
      - id: header
        label: "Dedicated debug header"
        locks:
          - id: mcu.prog.access
            text: "Place the header where a probe can physically reach once the board is in its enclosure or on its stack."
            provenance: convention
        blocks: [{id: J_DBG, label: "J2\ndebug", order: 55}]
      - id: testpads
        label: "Test pads only"
        costs: ["needs a pogo jig or soldered wires"]
